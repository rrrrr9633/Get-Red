<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛皮俱乐部</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .create-container {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .create-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .create-header h1 {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .create-header p {
            opacity: 0.8;
            font-size: 14px;
            color: #00ffff;
        }
        
        .user-type-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .user-type-card {
            background: rgba(30, 30, 50, 0.8);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .user-type-card:hover {
            border-color: #ffd700;
            transform: translateY(-2px);
        }
        
        .user-type-card.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
        
        .user-type-icon {
            font-size: 32px;
            margin-bottom: 10px;
            display: block;
        }
        
        .user-type-title {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .user-type-desc {
            font-size: 12px;
            color: #ccc;
        }

        .warning {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .warning h4 {
            color: #ff6b6b;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ffd700;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .password-requirements {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .btn-create {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-create:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error, .success {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
        }

        .success {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid #4ade80;
        }

        .ip-info {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="create-container">
        <div class="create-header">
            <h1>� 用户管理中心</h1>
            <p>创建和管理不同类型的用户账户</p>
        </div>

        <!-- 用户类型选择器 -->
        <div class="user-type-selector">
            <div class="user-type-card" onclick="selectUserType('user')">
                <span class="user-type-icon">👤</span>
                <div class="user-type-title">普通用户</div>
                <div class="user-type-desc">基础用户权限</div>
            </div>
            <div class="user-type-card" onclick="selectUserType('service')">
                <span class="user-type-icon">💬</span>
                <div class="user-type-title">客服用户</div>
                <div class="user-type-desc">客服工作台权限</div>
            </div>
            <div class="user-type-card" onclick="selectUserType('super_admin')">
                <span class="user-type-icon">🔐</span>
                <div class="user-type-title">超级管理员</div>
                <div class="user-type-desc">最高系统权限</div>
            </div>
        </div>

        <div class="warning" id="userTypeWarning" style="display: none;">
            <h4>⚠️ 重要提醒</h4>
            <p id="warningText"></p>
        </div>

        <div id="message"></div>

        <form id="createUserForm" style="display: none;">
            <input type="hidden" id="selectedUserType" name="userType">
            
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required 
                       placeholder="请输入用户名">
            </div>
            
            <div class="form-group">
                <label for="nickname">昵称</label>
                <input type="text" id="nickname" name="nickname" required 
                       placeholder="请输入昵称">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required
                       placeholder="请输入密码">
                <div class="password-requirements" id="passwordReq">
                    密码要求：至少6位字符
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       placeholder="请再次输入密码">
            </div>

            <!-- 超级管理员专用字段 -->
            <div class="form-group" id="superAdminFields" style="display: none;">
                <label for="secretKey">超级管理员身份码</label>
                <input type="password" id="secretKey" name="secretKey"
                       placeholder="请输入超级管理员身份码进行验证">
                <div class="password-requirements">
                    需要当前超级管理员身份码验证（默认：admin）
                </div>
            </div>

            <div class="form-group">
                <label for="email">邮箱（可选）</label>
                <input type="email" id="email" name="email" 
                       placeholder="请输入邮箱地址">
            </div>

            <button type="submit" class="btn-create" id="createBtn">
                创建用户
            </button>
        </form>

        <div class="ip-info" id="ipInfo">
            当前IP: <span id="currentIP">获取中...</span>
        </div>
    </div>
    <script>
        let selectedUserType = null;
        
        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            getCurrentIP();
            
            // 绑定表单提交事件
            document.getElementById('createUserForm').addEventListener('submit', handleFormSubmit);
        });
        
        // 选择用户类型
        function selectUserType(type) {
            selectedUserType = type;
            
            // 更新选择状态
            document.querySelectorAll('.user-type-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            // 设置隐藏字段
            document.getElementById('selectedUserType').value = type;
            
            // 显示对应的警告和要求
            showUserTypeWarning(type);
            
            // 显示表单
            document.getElementById('createUserForm').style.display = 'block';
            
            // 更新表单字段显示
            updateFormFields(type);
        }
        
        // 显示用户类型警告
        function showUserTypeWarning(type) {
            const warningDiv = document.getElementById('userTypeWarning');
            const warningText = document.getElementById('warningText');
            
            const warnings = {
                user: '普通用户只能访问基础功能，无法进入管理后台。',
                service: '客服用户可以访问客服工作台，处理用户咨询和问题。',
                admin: '管理员拥有管理后台的大部分权限，可以管理用户、奖品、订单等。',
                super_admin: '超级管理员拥有系统最高权限，包括创建其他管理员、修改系统核心配置等。请妥善保管账户信息！'
            };
            
            warningText.textContent = warnings[type];
            warningDiv.style.display = 'block';
        }
        
        // 更新表单字段显示
        function updateFormFields(type) {
            const superAdminFields = document.getElementById('superAdminFields');
            const passwordReq = document.getElementById('passwordReq');
            const createBtn = document.getElementById('createBtn');
            
            if (type === 'super_admin') {
                superAdminFields.style.display = 'block';
                passwordReq.textContent = '密码要求：至少6位字符';
                createBtn.textContent = '创建超级管理员';
                document.getElementById('secretKey').required = true;
            } else {
                superAdminFields.style.display = 'none';
                passwordReq.textContent = '密码要求：至少6位字符';
                createBtn.textContent = '创建' + getUserTypeName(type);
                document.getElementById('secretKey').required = false;
            }
        }
        
        // 获取用户类型中文名
        function getUserTypeName(type) {
            const names = {
                user: '普通用户',
                service: '客服用户', 
                super_admin: '超级管理员'
            };
            return names[type] || '用户';
        }
        
        // 处理表单提交
        async function handleFormSubmit(e) {
            e.preventDefault();
            
            if (!selectedUserType) {
                showMessage('请先选择用户类型！', 'error');
                return;
            }
            
            const formData = new FormData(e.target);
            const userData = {
                userType: selectedUserType,
                username: formData.get('username'),
                nickname: formData.get('nickname'),
                password: formData.get('password'),
                confirmPassword: formData.get('confirmPassword'),
                email: formData.get('email') || null
            };
            
            // 验证密码
            if (userData.password !== userData.confirmPassword) {
                showMessage('两次输入的密码不一致！', 'error');
                return;
            }
            
            // 验证密码强度
            if (!validatePassword(userData.password, selectedUserType)) {
                return;
            }
            
            // 超级管理员需要额外验证
            if (selectedUserType === 'super_admin') {
                const secretKey = formData.get('secretKey');
                
                if (!secretKey) {
                    showMessage('创建超级管理员需要输入当前超级管理员身份码！', 'error');
                    return;
                }
                
                userData.secretKey = secretKey;
            }
            
            // 提交创建请求
            await createUser(userData);
        }
        
        // 验证密码强度
        function validatePassword(password, userType) {
            if (password.length < 6) {
                showMessage('密码至少需要6位字符！', 'error');
                return false;
            }
            
            return true;
        }
        
        // 创建用户
        async function createUser(userData) {
            try {
                const createBtn = document.getElementById('createBtn');
                const originalText = createBtn.textContent;
                
                // 显示加载状态
                createBtn.textContent = '创建中...';
                createBtn.disabled = true;
                
                // 调用API创建用户
                const formData = new FormData();
                formData.append('userType', userData.userType);
                formData.append('username', userData.username);
                formData.append('nickname', userData.nickname);
                formData.append('password', userData.password);
                formData.append('email', userData.email || '');
                
                if (userData.secretKey) {
                    formData.append('secretKey', userData.secretKey);
                }
                
                const response = await fetch('server/api/super-admin.php?action=createUser', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(`${getUserTypeName(userData.userType)}创建成功！`, 'success');
                    
                    // 清空表单
                    document.getElementById('createUserForm').reset();
                    document.getElementById('createUserForm').style.display = 'none';
                    document.getElementById('userTypeWarning').style.display = 'none';
                    
                    // 清除选择状态
                    document.querySelectorAll('.user-type-card').forEach(card => {
                        card.classList.remove('selected');
                    });
                    selectedUserType = null;
                } else {
                    showMessage('创建失败：' + result.error, 'error');
                }
                
            } catch (error) {
                console.error('创建用户失败:', error);
                showMessage('创建用户失败：' + error.message, 'error');
            } finally {
                // 恢复按钮状态
                const createBtn = document.getElementById('createBtn');
                createBtn.textContent = originalText;
                createBtn.disabled = false;
            }
        }
        
        // 显示消息
        function showMessage(text, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
            
            // 3秒后隐藏消息
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
        
        // 获取当前IP
        async function getCurrentIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('currentIP').textContent = data.ip;
            } catch (error) {
                document.getElementById('currentIP').textContent = '无法获取';
            }
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            getCurrentIP();
            
            // 绑定表单提交事件
            document.getElementById('createUserForm').addEventListener('submit', handleFormSubmit);
        });
    </script>
</body>
</html>
