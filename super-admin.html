<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无敌俱乐部</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .auth-header p {
            opacity: 0.8;
            font-size: 14px;
            color: #ff6b6b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* 用户类型选择样式 */
        .user-type-selection {
            margin-bottom: 30px;
        }

        .user-type-selection h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #00ffff;
            font-size: 1.2em;
            text-shadow: 0 0 10px #00ffff;
        }

        .login-type-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .login-type-card {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .login-type-card:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .login-type-card.selected {
            background: rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        }

        .type-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .type-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 5px;
        }

        .type-desc {
            font-size: 0.9em;
            color: #fff;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ffd700;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .btn-verify {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-verify:hover {
            background: linear-gradient(45deg, #ffed4e, #ffd700);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .security-info {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
            opacity: 0.9;
        }

        .security-info h4 {
            color: #ff6b6b;
            margin-bottom: 8px;
        }

        .security-info ul {
            list-style: none;
            padding-left: 0;
        }

        .security-info li {
            margin-bottom: 5px;
        }

        .security-info li:before {
            content: "⚠️ ";
            margin-right: 5px;
        }

        .btn-verify {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid #4ade80;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #ffd700;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.8;
        }

        .back-link a:hover {
            opacity: 1;
        }

        .ip-info {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1 id="title">🔐 管理员登录</h1>
            <p>选择登录方式进入管理后台</p>
        </div>

        <div class="security-info">
            <h4>安全要求</h4>
            <ul>
                <li>需要超级管理员账户</li>
                <li>需要身份码验证</li>
                <li>仅限授权访问</li>
                <li>所有操作记录在案</li>
            </ul>
        </div>

        <div id="message"></div>

        <!-- 用户类型选择 -->
        <div class="user-type-selection">
            <h3>选择登录方式</h3>
            <div class="login-type-cards">
                <div class="login-type-card" onclick="selectLoginType('super_admin')">
                    <div class="type-icon">🔐</div>
                    <div class="type-title">超级管理员</div>
                    <div class="type-desc">完整管理权限</div>
                </div>
                <div class="login-type-card" onclick="selectLoginType('service')">
                    <div class="type-icon">👨‍💼</div>
                    <div class="type-title">客服用户</div>
                    <div class="type-desc">客服管理权限</div>
                </div>
            </div>
        </div>

        <form id="superAdminForm" style="display: none;">
        </form>

        <div class="ip-info">
            当前IP: <span id="currentIP">检测中...</span>
        </div>

        <div class="back-link">
            <a href="index.html">← 返回首页</a>
        </div>
    </div>

    <script>
        let selectedLoginType = null;

        function selectLoginType(type) {
            selectedLoginType = type;
            
            // 更新选中状态
            document.querySelectorAll('.login-type-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            event.target.closest('.login-type-card').classList.add('selected');
            
            // 显示登录表单并更新标题
            const form = document.getElementById('superAdminForm');
            const titleElement = document.getElementById('title');
            
            form.style.display = 'block';
            
            if (type === 'super_admin') {
                titleElement.textContent = '🔐 超级管理员登录';
                showSuperAdminForm();
            } else if (type === 'service') {
                titleElement.textContent = '👨‍💼 客服用户登录';
                showServiceForm();
            }
        }

        function showSuperAdminForm() {
            const form = document.getElementById('superAdminForm');
            form.innerHTML = `
                <div class="form-group">
                    <label for="account">账户名</label>
                    <input type="text" id="account" name="account" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="identity_code">身份验证码</label>
                    <input type="text" id="identity_code" name="identity_code" required>
                </div>
                <button type="submit" class="btn-verify">登录</button>
            `;
        }

        function showServiceForm() {
            const form = document.getElementById('superAdminForm');
            form.innerHTML = `
                <div class="form-group">
                    <label for="account">账户名</label>
                    <input type="text" id="account" name="account" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-verify">登录</button>
            `;
        }

        document.getElementById('superAdminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!selectedLoginType) {
                showMessage('请先选择登录方式', 'error');
                return;
            }
            
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '登录中...';
            
            const formData = new FormData();
            const account = document.getElementById('account').value;
            const password = document.getElementById('password').value;
            
            if (selectedLoginType === 'super_admin') {
                const identityCode = document.getElementById('identity_code').value;
                
                formData.append('action', 'verifySuperAdmin');
                formData.append('account', account);
                formData.append('password', password);
                formData.append('identity_code', identityCode);
            } else if (selectedLoginType === 'service') {
                formData.append('action', 'verifyService');
                formData.append('account', account);
                formData.append('password', password);
            }

            try {
                const response = await fetch('server/api/super-admin.php', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 保存 CSRF Token
                    if (result.csrf_token) {
                        sessionStorage.setItem('csrf_token', result.csrf_token);
                    }
                    
                    showMessage('登录成功！正在跳转...', 'success');
                    
                    // 根据用户类型跳转到不同页面
                    setTimeout(() => {
                        if (selectedLoginType === 'super_admin') {
                            window.location.href = 'pages/admin/admin.html';
                        } else if (selectedLoginType === 'service') {
                            // 客服用户跳转到用户管理页面
                            window.location.href = 'pages/admin/users.html';
                        }
                    }, 1500);
                } else {
                    showMessage(result.message || '登录失败', 'error');
                }
            } catch (error) {
                console.error('登录错误:', error);
                showMessage('登录过程中发生错误', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = type;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // 获取当前IP
        async function getCurrentIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('currentIP').textContent = data.ip;
            } catch (error) {
                document.getElementById('currentIP').textContent = '无法获取';
            }
        }

        // 页面加载时获取IP
        document.addEventListener('DOMContentLoaded', function() {
            getCurrentIP();
            
            // 清除任何可能存在的本地认证状态
            sessionStorage.clear();
            localStorage.clear();
            
            // 清除服务器端会话（静默处理，不显示错误）
            fetch('server/api/super-admin.php?action=logout', {
                method: 'POST'
            }).catch(() => {
                // 静默处理错误，因为可能还没有会话存在
            });
        });
    </script>
</body>
</html>
