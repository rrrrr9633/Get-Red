<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无敌俱乐部</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/neon.css">
    <link rel="stylesheet" href="../css/lucky-page.css">
<style>
.showcase-icon img {
    animation: float 3s ease-in-out infinite;
}
/* 完全移除所有黑色背景，让背景图片完全可见 */
body {
    background: url('../images/shop/lucky5.png') no-repeat center center fixed !important;
    background-size: cover !important;
    background-color: transparent !important;
}
body::before,
body::after {
    display: none !important;
}
.particles {
    display: none !important;
}
.game-container {
    background: transparent !important;
}
.showcase-area {
    background: transparent !important;
}
.showcase-item {
    background: transparent !important;
    border: 2px solid rgba(239, 68, 68, 0.8) !important;
}
.slot-row {
    background: rgba(0, 0, 0, 0.3) !important;
}
.prize-info {
    background: rgba(26, 27, 46, 0.6) !important;
}
.navbar {
    background: rgba(26, 27, 46, 0.85) !important;
}
.limited-drop-window {
    background: rgba(26, 27, 46, 0.85) !important;
}
.horizontal-slot-container {
    background: transparent !important;
}
.slot-rows {
    background: transparent !important;
}
</style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <h1 class="neon-text gold" onclick="goToHome()" style="cursor: pointer;" title="返回主页">无敌俱乐部</h1>
        </div>
        
        <div class="nav-user">
            <!-- 仓库功能 -->
            <div class="nav-item warehouse-btn" onclick="window.location.href='modules/container.html'" title="宝箱寻宝">
                <i class="icon">📦</i>
                <span>仓库</span>
            </div>
            
            <!-- 每日签到 -->
            <div class="nav-item checkin-btn" onclick="window.location.href='modules/checkin.html'" title="每日签到">
                <i class="icon">📅</i>
                <span>签到</span>
            </div>
            
            <div class="user-info" id="userInfo">
                <img id="userAvatar" src="" alt="头像" class="user-avatar">
                <span id="userNickname" class="neon-text"></span>
                <span id="userBalance" class="neon-text gold" style="display: flex; flex-direction: column; align-items: flex-end; font-size: 0.85em; line-height: 1.3;">
                    <span class="total-balance" style="font-size: 1.1em;">总额: 0.00</span>
                    <span class="coin-details" style="font-size: 0.9em; opacity: 0.8;">绑定: 0.00 | 非绑定: 0.00</span>
                </span>
                <a href="user/recharge.html" class="recharge-btn" title="充值">💰</a>
                <div class="user-dropdown">
                    <a href="user/profile.html" class="neon-text">个人中心</a>
                    <a href="main.html" class="neon-text">返回主页</a>
                    <a href="#" onclick="logout()" class="neon-text">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 页面选项卡（仅在合并页面时显示） -->
    <div id="pageTabs" class="page-tabs" style="display:none;">
        <div class="tabs-container">
            <!-- 动态生成选项卡 -->
        </div>
    </div>

    <!-- 限时掉落窗口 -->
    <div id="limitedDropWindow" class="limited-drop-window">
        <div class="limited-drop-header">
            <h3 id="limitedDropTitle" class="neon-text gold">限时掉落，爆率提升</h3>
            <span class="limited-drop-hint">💡 真实数量更新有延迟，刷新后查看</span>
        </div>
        <div class="limited-drop-content">
            <div id="limitedDropPrizes" class="limited-drop-prizes">
                <!-- 限时掉落奖品将通过JS动态生成 -->
            </div>
        </div>
    </div>

    <div class="game-container">
        <div class="game-header">
            <h2 class="neon-text rainbow">长弓溪谷(机密)</h2>
            <p class="neon-text">有一架飞机在长弓溪谷区域坠落！</p>
        </div>

        <!-- 3D展示区域 - CS2风格 -->
        <div class="showcase-area">
            <div class="showcase-glow"></div>
            <div class="showcase-item" id="showcaseItem">
                <div class="showcase-icon"><img src="../images/lucky5_1772975772.png" alt="长弓溪谷(机密)" style="max-width: 180px; max-height: 180px; object-fit: contain; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));"></div>
                <div class="showcase-name">准备开始</div>
                <div class="showcase-price">0.00</div>
            </div>
            <div class="showcase-arrows">
                <div class="arrow-left">
                    <span class="arrow-layer">‹</span>
                    <span class="arrow-layer">‹</span>
                    <span class="arrow-layer">‹</span>
                </div>
                <div class="arrow-right">
                    <span class="arrow-layer">›</span>
                    <span class="arrow-layer">›</span>
                    <span class="arrow-layer">›</span>
                </div>
            </div>
        </div>

        <!-- 抽奖设置 -->
        <div class="draw-settings">
            <div class="draw-mode-selector">
                <button class="mode-btn active" data-mode="1">单抽</button>
                <button class="mode-btn" data-mode="3">三连抽</button>
                <button class="mode-btn" data-mode="5">五连抽</button>
            </div>
            
            <div class="animation-settings">
                <label class="setting-item">
                    <input type="checkbox" id="skipAnimation" class="skip-checkbox">
                    <span class="neon-text">跳过动画</span>
                </label>
            </div>
        </div>

        <!-- 抽奖按钮 -->
        <div class="slot-controls">
            <button id="spinBtn" class="btn-spin">
                <span class="btn-text">开始摸金</span>
                <span class="btn-cost" id="btnCost">(消耗: 10)</span>
            </button>
        </div>

        <!-- 横向滚动老虎机 -->
        <div class="horizontal-slot-container">
            <div class="slot-rows" id="slotRows">
                <!-- 抽奖行将动态生成 -->
            </div>
        </div>

        <!-- 奖品说明 - 卡片式展示 -->
        <div class="prize-info">
            <h3 class="neon-text gold">🎯 奖励列表</h3>
            <div class="prize-grid" id="prizeGrid">
                <!-- 奖品说明将通过JS动态生成 -->
            </div>
        </div>
    </div>

    <!-- 每日签到弹窗 -->
    <div id="checkinModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="neon-text gold">每日签到</h3>
                <span class="close" onclick="closeCheckinModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="checkinContent">
                    <div class="checkin-calendar">
                        <div class="calendar-header">
                            <h4 class="neon-text">本月签到记录</h4>
                        </div>
                        <div class="calendar-grid" id="calendarGrid">
                            <!-- 日历网格将通过JS生成 -->
                        </div>
                    </div>
                    <div class="checkin-rewards">
                        <h4 class="neon-text gold">签到奖励</h4>
                        <div class="reward-item">
                            <span>连续签到1天：金币 +10</span>
                        </div>
                        <div class="reward-item">
                            <span>连续签到7天：金币 +100</span>
                        </div>
                        <div class="reward-item">
                            <span>连续签到30天：神秘礼品</span>
                        </div>
                    </div>
                    <button id="checkinBtn" class="btn-checkin" onclick="performCheckin()">
                        立即签到
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 仓库弹窗 -->
    <div id="warehouseModal" class="modal">
        <div class="modal-content warehouse-modal">
            <div class="modal-header">
                <h3 class="neon-text gold">我的仓库</h3>
                <span class="close" onclick="closeWarehouseModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="warehouse-tabs">
                    <button class="tab-btn active" data-tab="items">物品</button>
                    <button class="tab-btn" data-tab="rewards">奖励</button>
                    <button class="tab-btn" data-tab="gifts">礼品</button>
                </div>
                <div class="warehouse-content">
                    <div id="warehouseItems" class="warehouse-grid">
                        <!-- 仓库物品将通过JS生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 中奖提示 -->
    <div id="winModal" class="modal">
        <div class="modal-content">
            <h3 class="neon-text gold">恭喜中奖！</h3>
            <div id="winResult" class="win-result"></div>
            <button onclick="closeWinModal()" class="btn-neon">确定</button>
        </div>
    </div>

    <style>
        /* 页面选项卡样式 - 垂直堆叠设计 */
        .page-tabs {
            position: fixed;
            top: 90px;
            left: 20px;
            z-index: 999;
            display: none; /* 默认隐藏，不占用空间 */
        }

        .page-tabs.show {
            display: block; /* 显示时才出现 */
        }

        .tabs-container {
            display: flex;
            flex-direction: column;
            gap: 0;
            align-items: flex-start;
        }

        .tab-item {
            padding: 12px 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 0 12px 12px 0;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            position: relative;
        }

        /* 右对齐缩进 - 红绿蓝三色交替 */
        .tab-item:nth-child(1) {
            margin-right: 0;
            z-index: 10;
            background: rgba(239, 68, 68, 0.9); /* 红色 */
        }

        .tab-item:nth-child(2) {
            margin-right: 15px;
            z-index: 9;
            background: rgba(74, 222, 128, 0.9); /* 绿色 */
        }

        .tab-item:nth-child(3) {
            margin-right: 30px;
            z-index: 8;
            background: rgba(59, 130, 246, 0.9); /* 蓝色 */
        }

        .tab-item:nth-child(4) {
            margin-right: 45px;
            z-index: 7;
            background: rgba(239, 68, 68, 0.9); /* 红色 */
        }

        .tab-item:nth-child(5) {
            margin-right: 60px;
            z-index: 6;
            background: rgba(74, 222, 128, 0.9); /* 绿色 */
        }

        .tab-item:nth-child(6) {
            margin-right: 75px;
            z-index: 5;
            background: rgba(59, 130, 246, 0.9); /* 蓝色 */
        }

        .tab-item:hover {
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateX(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            filter: brightness(1.2);
        }

        .tab-item.active {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateX(15px);
            z-index: 15 !important;
            filter: brightness(1.3);
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .page-tabs {
                top: 70px;
                left: 10px;
            }
            
            .tab-item {
                padding: 10px 18px;
                font-size: 12px;
            }

            .tab-item:nth-child(2) {
                margin-right: 10px;
            }

            .tab-item:nth-child(3) {
                margin-right: 20px;
            }

            .tab-item:nth-child(4) {
                margin-right: 30px;
            }

            .tab-item:nth-child(5) {
                margin-right: 40px;
            }

            .tab-item:nth-child(6) {
                margin-right: 50px;
            }
        }

        /* 防止页面被挤压 */
        html, body {
            overflow-x: hidden;
            width: 100%;
            position: relative;
        }
        
        /* 弹窗显示时防止body滚动 */
        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        
        /* 移动端性能优化 - 减少动画 */
        @media (max-width: 768px) {
            /* 禁用部分耗性能的动画 */
            .limited-drop-window::before,
            .game-container::before,
            .showcase-glow {
                animation: none !important;
            }
            
            /* 简化彩虹文字动画 */
            .limited-drop-header h3 {
                animation: none !important;
                background: linear-gradient(90deg, #ff0080, #ff8c00);
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            
            /* 禁用粒子特效 */
            .particles {
                display: none !important;
            }
        }
        
        /* 使用红色主题的自定义样式覆盖 */
        
        /* 限时掉落窗口样式 - 彩虹霓虹特效 */
        .limited-drop-window {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            width: 100%;
            background: linear-gradient(135deg, rgba(15, 15, 25, 0.98), rgba(20, 20, 35, 0.98));
            backdrop-filter: blur(10px);
            border-bottom: 3px solid transparent;
            background-image: 
                linear-gradient(135deg, rgba(15, 15, 25, 0.98), rgba(20, 20, 35, 0.98)),
                linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0, #9370db, #ff0080);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            z-index: 998;
            transform: translateY(-100%);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .limited-drop-window.show {
            transform: translateY(0);
        }
        
        .limited-drop-window.collapsed {
            transform: translateY(calc(-100% + 8px));
        }
        
        .limited-drop-window.collapsed:hover {
            transform: translateY(0);
        }
        
        /* 添加一个顶部触发条 */
        .limited-drop-window::after {
            content: '▼ 限时掉落 ▼';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ff0080, #ff8c00, #40e0d0, #9370db);
            color: #fff;
            padding: 2px 20px;
            border-radius: 0 0 8px 8px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        
        .limited-drop-window.collapsed::after {
            opacity: 1;
        }
        
        /* 彩虹边框动画 */
        @keyframes rainbow-border {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .limited-drop-window::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                rgba(255, 0, 128, 0.1), 
                rgba(255, 140, 0, 0.1), 
                rgba(64, 224, 208, 0.1), 
                rgba(147, 112, 219, 0.1));
            background-size: 200% 200%;
            animation: rainbow-border 3s ease infinite;
            pointer-events: none;
        }
        
        .limited-drop-header {
            background: linear-gradient(90deg, 
                rgba(255, 0, 128, 0.15), 
                rgba(255, 140, 0, 0.15), 
                rgba(64, 224, 208, 0.15));
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding: 15px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .limited-drop-header h3 {
            margin: 0;
            font-size: 24px;
            background: linear-gradient(90deg, 
                #ff0080, 
                #ff8c00, 
                #40e0d0, 
                #9370db, 
                #ff0080);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-text 3s linear infinite;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }
        
        .limited-drop-hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            white-space: nowrap;
        }
        
        @keyframes rainbow-text {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        
        .close-btn {
            color: #fff;
            opacity: 0.7;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        
        .limited-drop-prize .prize-name {
            background: linear-gradient(135deg, #40e0d0, #9370db);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }
        
        /* 游戏容器 - CS2风格深色背景 */
        .game-container {
            margin-top: 70px;
            padding: 20px 20px 40px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            position: relative;
            background: linear-gradient(180deg, 
                rgba(15, 15, 20, 0.95) 0%, 
                rgba(20, 20, 25, 0.98) 50%,
                rgba(15, 15, 20, 0.95) 100%);
        }
        
        /* 添加背景装饰 - 红色渐变光效 */
        .game-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, 
                rgba(239, 68, 68, 0.12) 0%, 
                rgba(220, 38, 38, 0.08) 30%,
                transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulse-glow 8s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.8; transform: translateX(-50%) scale(1.1); }
        }
        
        /* 3D展示区域 - CS2风格 红色主题 */
        .showcase-area {
            position: relative;
            margin: 30px auto;
            padding: 60px 40px;
            max-width: 600px;
            z-index: 1;
            transition: all 0.5s ease;
        }
        
        .showcase-area.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
        }
        
        .showcase-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, 
                rgba(239, 68, 68, 0.25) 0%, 
                rgba(220, 38, 38, 0.15) 30%,
                transparent 70%);
            filter: blur(40px);
            animation: showcase-pulse 3s ease-in-out infinite;
        }
        
        @keyframes showcase-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }
        
        .showcase-item {
            position: relative;
            z-index: 2;
            padding: 50px 40px;
            background: linear-gradient(135deg, 
                rgba(30, 20, 20, 0.6), 
                rgba(20, 15, 15, 0.8));
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 40px rgba(239, 68, 68, 0.2);
            transition: all 0.4s ease;
        }
        
        .showcase-item:hover {
            transform: translateY(-10px);
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 0 60px rgba(239, 68, 68, 0.4);
        }
        
        .showcase-icon {
            font-size: 100px;
            margin-bottom: 15px;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .showcase-name {
            font-size: 22px;
            font-weight: bold;
            color: #4ade80;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }
        
        .showcase-price {
            font-size: 28px;
            font-weight: bold;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }
        
        .showcase-arrows {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 3;
        }
        
        /* 装饰性箭头容器 */
        .arrow-left, .arrow-right {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        
        /* 箭头层 - 扩散效果 */
        .arrow-layer {
            font-size: 40px;
            font-weight: bold;
            color: rgba(239, 68, 68, 0.6);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
            animation: arrow-pulse 2s ease-in-out infinite;
            display: inline-block;
        }
        
        /* 为每个箭头层设置不同的延迟，创建扩散效果 */

    <script src="../js/api-client.js"></script>
    <script src="../js/effects.js"></script>
    <script>
        // ========== 页面选项卡功能 ==========

        // 在页面加载时检查是否属于合并组
        async function checkAndLoadTabs() {
            try {
                // 获取当前页面文件名
                const currentPage = window.location.pathname.split('/').pop();
                
                // 查询该页面是否属于合并组
                const response = await fetch(`../server/api/admin.php?action=get_page_merge_info&page=${currentPage}`);
                const data = await response.json();
                
                if (data.success) {
                    // 如果有thumbs图片，设置中心展示图片
                    if (data.thumbImage) {
                        setShowcaseImage(data.thumbImage);
                    }
                    
                    // 如果属于合并组，加载选项卡
                    if (data.mergeGroupId) {
                        await loadPageTabs(data.mergeGroupId, currentPage);
                    }
                }
            } catch (error) {
                console.error('检查页面合并状态失败:', error);
            }
        }
        
        // 设置中心展示区域的图片
        function setShowcaseImage(imagePath) {
            const showcaseIcon = document.querySelector('.showcase-icon');
            if (showcaseIcon && imagePath) {
                // 将emoji替换为图片
                showcaseIcon.innerHTML = `<img src="../${imagePath}" alt="展示图片" style="max-width: 100%; max-height: 100%; object-fit: contain;">`;
            }
        }

        // 加载选项卡
        async function loadPageTabs(groupId, currentPage) {
            try {
                const response = await fetch(`../server/api/admin.php?action=get_group_pages&groupId=${groupId}`);
                const data = await response.json();
                
                if (data.success && data.pages && data.pages.length > 1) {
                    const tabsContainer = document.querySelector('.tabs-container');
                    const pageTabs = document.getElementById('pageTabs');
                    
                    // 生成选项卡
                    tabsContainer.innerHTML = data.pages.map(page => `
                        <div class="tab-item ${page.file_name === currentPage ? 'active' : ''}" 
                             onclick="switchToPage('${page.file_name}')">
                            ${page.display_name}
                        </div>
                    `).join('');
                    
                    // 显示选项卡
                    pageTabs.style.display = 'block';
                    pageTabs.classList.add('show');
                }
            } catch (error) {
                console.error('加载选项卡失败:', error);
            }
        }

        // 切换到其他页面
        function switchToPage(fileName) {
            if (fileName !== window.location.pathname.split('/').pop()) {
                window.location.href = fileName;
            }
        }

        // ========== 原有代码 ==========

        let currentUser = null;
        let prizeData = [];
        let currentMode = 1; // 当前抽奖模式：1单抽，3三连抽，5五连抽
        let drawPrices = { single: 10, triple: 30, quintuple: 50 }; // 动态价格
        let isDrawing = false; // 是否正在抽奖
        let showcaseRestoreTimer = null; // 准备窗口恢复定时器

        // 检查登录状态并加载数据
        async function initPage() {
            // 检查并加载选项卡
            await checkAndLoadTabs();
            
            // 直接检查localStorage中的登录状态
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const currentUserData = localStorage.getItem('currentUser');
            
            if (isLoggedIn !== 'true' || !currentUserData) {
                alert('请先登录！');
                window.location.href = 'auth/login.html';
                return;
            }
            
            try {
                currentUser = JSON.parse(currentUserData);
                console.log('当前用户:', currentUser);
            } catch (e) {
                alert('用户信息异常，请重新登录！');
                window.location.href = 'auth/login.html';
                return;
            }
            
            await loadUserInfo();
            await loadPrizes();
            await loadDrawPrices(); // 加载抽奖价格
            await initLimitedDrop(); // 初始化限时掉落
            initSlotMachine();
            bindEvents();
        }

        // 加载用户信息
        async function loadUserInfo() {
            try {
                const result = await api.getUserProfile();
                if (result.success) {
                    const user = result.user;
                    
                    // 处理头像路径
                    let avatarSrc = user.avatar || '../images/default-avatar.gif';
                    // 如果不是data:或http开头，添加../前缀
                    if (avatarSrc && !avatarSrc.startsWith('data:') && !avatarSrc.startsWith('http') && !avatarSrc.startsWith('../')) {
                        avatarSrc = '../' + avatarSrc;
                    }
                    document.getElementById('userAvatar').src = avatarSrc;
                    
                    document.getElementById('userNickname').textContent = user.nickname;
                    
                    const boundCoins = parseFloat(user.bound_coins || 0).toFixed(2);
                    const unboundCoins = parseFloat(user.unbound_coins || 0).toFixed(2);
                    const totalBalance = parseFloat(user.balance || 0).toFixed(2);
                    
                    document.getElementById('userBalance').innerHTML = `
                        <span class="total-balance" style="font-size: 1.1em;">总额: ${totalBalance}</span>
                        <span class="coin-details" style="font-size: 0.9em; opacity: 0.8;">绑定: ${boundCoins} | 非绑定: ${unboundCoins}</span>
                    `;
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
        }

        // 加载奖品数据
        async function loadPrizes() {
            try {
                // 从URL中获取当前页面参数，或者根据文件名确定页面
                const urlParams = new URLSearchParams(window.location.search);
                let currentPage = urlParams.get('page');
                
                // 如果URL中没有page参数，尝试从文件名推断
                if (!currentPage) {
                    const path = window.location.pathname;
                    const filename = path.substring(path.lastIndexOf('/') + 1);
                    currentPage = filename;
                }
                
                // 如果还是没有，默认使用lucky1.html
                if (!currentPage || currentPage === 'luckytemp.html') {
                    currentPage = 'lucky1.html';
                }
                
                console.log('当前页面:', currentPage);
                
                // 使用修改后的API调用，传入页面参数
                const result = await api.getPrizes('lucky_drop', currentPage);
                if (result.success) {
                    prizeData = result.prizes;
                    console.log('加载的奖品数据:', prizeData);
                }
            } catch (error) {
                console.error('加载奖品数据失败:', error);
                // 使用默认数据
                prizeData = [
                    { id: 1, name: 'iPhone 15 Pro', icon: '📱', image_url: '/uploads/prizes/iphone15.jpg', value: 8000, rarity: 'legendary', probability: 1 },
                    { id: 2, name: 'MacBook Air', icon: '💻', image_url: '/uploads/prizes/macbook.jpg', value: 7000, rarity: 'legendary', probability: 1 },
                    { id: 3, name: 'AirPods Pro', icon: '🎧', image_url: '/uploads/prizes/airpods.jpg', value: 1500, rarity: 'epic', probability: 5 },
                    { id: 4, name: 'iPad', icon: '📱', image_url: '/uploads/prizes/ipad.jpg', value: 3000, rarity: 'epic', probability: 3 },
                    { id: 5, name: 'Apple Watch', icon: '⌚', image_url: '/uploads/prizes/watch.jpg', value: 2500, rarity: 'rare', probability: 8 },
                    { id: 6, name: '蓝牙音响', icon: '🔊', image_url: '/uploads/prizes/speaker.jpg', value: 500, rarity: 'rare', probability: 15 },
                    { id: 7, name: '充电宝', icon: '🔋', image_url: '/uploads/prizes/powerbank.jpg', value: 100, rarity: 'common', probability: 30 },
                    { id: 8, name: '数据线', icon: '🔌', image_url: '/uploads/prizes/cable.jpg', value: 50, rarity: 'common', probability: 37 }
                ];
            }
            
            generatePrizeGrid();
        }

        // 加载抽奖价格
        async function loadDrawPrices() {
            try {
                // 获取当前页面参数
                const urlParams = new URLSearchParams(window.location.search);
                let currentPage = urlParams.get('page');
                
                if (!currentPage) {
                    const path = window.location.pathname;
                    const filename = path.substring(path.lastIndexOf('/') + 1);
                    currentPage = filename;
                }
                
                if (!currentPage || currentPage === 'luckytemp.html') {
                    currentPage = 'lucky1.html';
                }
                
                const response = await fetch(`../../server/api/admin.php?action=get_draw_prices&page=${encodeURIComponent(currentPage)}`);
                const data = await response.json();
                
                if (data.success) {
                    drawPrices = data.prices;
                    console.log('加载的抽奖价格:', drawPrices);
                    
                    // 更新按钮名称
                    if (data.names) {
                        const singleBtn = document.querySelector('.mode-btn[data-mode="1"]');
                        const tripleBtn = document.querySelector('.mode-btn[data-mode="3"]');
                        const quintupleBtn = document.querySelector('.mode-btn[data-mode="5"]');
                        
                        if (singleBtn && data.names.single) {
                            singleBtn.textContent = data.names.single;
                        }
                        if (tripleBtn && data.names.triple) {
                            tripleBtn.textContent = data.names.triple;
                        }
                        if (quintupleBtn && data.names.quintuple) {
                            quintupleBtn.textContent = data.names.quintuple;
                        }
                    }
                } else {
                    console.warn('加载价格失败，使用默认价格:', data.error);
                }
            } catch (error) {
                console.error('加载抽奖价格失败:', error);
            }
        }

        // 初始化横向滚动老虎机
        function initSlotMachine() {
            updateSlotRows();
        }

        // 更新老虎机行数
        function updateSlotRows() {
            const slotRows = document.getElementById('slotRows');
            slotRows.innerHTML = '';
            
            for (let i = 0; i < currentMode; i++) {
                const row = createSlotRow();
                slotRows.appendChild(row);
            }
            
            // 更新按钮显示的消耗 - 使用动态价格
            let cost;
            if (currentMode === 1) {
                cost = drawPrices.single;
            } else if (currentMode === 3) {
                cost = drawPrices.triple;
            } else if (currentMode === 5) {
                cost = drawPrices.quintuple;
            } else {
                cost = currentMode * drawPrices.single; // 备用计算方式
            }
            
            document.getElementById('btnCost').textContent = `(消耗: ${cost})`;
        }

        // 创建一行老虎机
        function createSlotRow() {
            const row = document.createElement('div');
            row.className = 'slot-row';
            
            // 创建滚动条
            const strip = document.createElement('div');
            strip.className = 'slot-strip';
            
            // 创建中心指针
            const pointer = document.createElement('div');
            pointer.className = 'slot-pointer';
            
            // 🚀 智能DOM优化：最小化初始DOM（只创建2-3轮），动画时按需补充
            // 初始只创建最少的DOM：2-3轮奖品列表
            // 这样不管奖品数量多少，初始DOM都很少
            const initialRepeats = 3; // 固定只创建3轮
            
            for (let repeat = 0; repeat < initialRepeats; repeat++) {
                for (let i = 0; i < prizeData.length; i++) {
                    const prize = prizeData[i];
                    const item = createSlotItem(prize);
                    strip.appendChild(item);
                }
            }
            
            console.log(`🚀 智能DOM: 初始DOM=${strip.children.length}个 (${prizeData.length}个奖品×${initialRepeats}轮) - 动画时按需补充`);
            
            row.appendChild(strip);
            row.appendChild(pointer);
            
            return row;
        }

        // 创建老虎机项目
        function createSlotItem(prize) {
            const item = document.createElement('div');
            item.className = 'slot-item';
            item.dataset.prizeId = prize.id;
            
            // 根据屏幕尺寸设置item宽度
            const isMobile = window.innerWidth <= 768;
            const isSmallMobile = window.innerWidth <= 480;
            const itemWidth = isSmallMobile ? 40 : (isMobile ? 50 : 100);
            item.style.flex = `0 0 ${itemWidth}px`;
            item.style.minWidth = `${itemWidth}px`;
            item.style.maxWidth = `${itemWidth}px`;
            
            const icon = document.createElement('div');
            icon.className = 'icon';
            
            if (prize.image_url) {
                const img = document.createElement('img');
                // 修正图片路径：如果是相对路径，添加../前缀
                const imagePath = prize.image_url.startsWith('http') || prize.image_url.startsWith('/') 
                    ? prize.image_url 
                    : '../' + prize.image_url;
                img.src = imagePath;
                img.alt = prize.name;
                
                // 根据屏幕尺寸调整图片大小
                const imgSize = isSmallMobile ? '14px' : (isMobile ? '16px' : '32px');
                img.style.width = imgSize;
                img.style.height = imgSize;
                img.style.objectFit = 'cover';
                img.style.borderRadius = '4px';
                img.onerror = () => {
                    img.style.display = 'none';
                    icon.textContent = prize.icon;
                };
                icon.appendChild(img);
            } else {
                icon.textContent = prize.icon;
            }
            
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = prize.name;
            
            item.appendChild(icon);
            item.appendChild(name);
            
            return item;
        }

        // 绑定事件
        function bindEvents() {
            // 模式选择按钮
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // 移除所有活动状态
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    // 添加活动状态
                    e.target.classList.add('active');
                    // 设置当前模式
                    currentMode = parseInt(e.target.dataset.mode);
                    updateSlotRows();
                });
            });

            // 抽奖按钮
            document.getElementById('spinBtn').addEventListener('click', startSpin);
            
            // 跳过动画复选框 - 保存用户偏好
            const skipCheckbox = document.getElementById('skipAnimation');
            const savedSkipSetting = localStorage.getItem('skipAnimation');
            if (savedSkipSetting === 'true') {
                skipCheckbox.checked = true;
            }
            
            skipCheckbox.addEventListener('change', (e) => {
                localStorage.setItem('skipAnimation', e.target.checked);
            });
        }

        // 开始摸金
        async function startSpin() {
            const spinBtn = document.getElementById('spinBtn');
            const skipAnimation = document.getElementById('skipAnimation').checked;
            const showcaseArea = document.querySelector('.showcase-area');
            const slotContainer = document.querySelector('.horizontal-slot-container');
            
            // 检查仓库物品数量
            try {
                const itemsResult = await api.getUserItems();
                if (itemsResult.success) {
                    const activeItems = (itemsResult.items || []).filter(item => !(item.decomposed == 1 || item.decomposed === true));
                    if (activeItems.length >= 200) {
                        alert('⚠️ 仓库已满！\n\n您的仓库中已有 ' + activeItems.length + ' 件物品，已达到上限（200件）。\n\n请先前往仓库分解一些物品后再继续抽奖。');
                        return; // 阻止抽奖
                    }
                }
            } catch (error) {
                console.error('检查仓库失败:', error);
                // 如果检查失败，允许继续抽奖（避免因网络问题阻止用户）
            }
            
            // 清除之前的恢复定时器（如果用户连续抽奖）
            if (showcaseRestoreTimer) {
                clearTimeout(showcaseRestoreTimer);
                showcaseRestoreTimer = null;
            }
            
            // 标记正在抽奖
            isDrawing = true;
            
            spinBtn.disabled = true;
            spinBtn.querySelector('.btn-text').textContent = '抽奖中...';
            
            // 先滚动到页面顶部（仅移动端，在锁定滚动之前）
            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                // 移动端：滚动到页面顶部
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
                
                // 等待滚动完成
                await new Promise(resolve => setTimeout(resolve, 400));
            }
            
            // 仅移动端锁定页面滚动
            let scrollY = 0;
            let preventScroll = null;
            
            if (isMobile) {
                // 抽奖时强制锁定页面滚动 - 保存当前滚动位置
                scrollY = window.scrollY;
                document.body.style.overflow = 'hidden';
                document.body.style.position = 'fixed';
                document.body.style.top = `-${scrollY}px`;
                document.body.style.width = '100%';
                document.body.style.left = '0';
                document.body.style.right = '0';
                
                // 阻止触摸滚动事件
                preventScroll = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                };
                
                document.addEventListener('touchmove', preventScroll, { passive: false });
                document.addEventListener('wheel', preventScroll, { passive: false });
            }
            
            // 隐藏展示区，显示抽奖动画
            showcaseArea.classList.add('hidden');
            slotContainer.classList.add('active');

            try {
                // 检查用户信息
                if (!currentUser || !currentUser.id) {
                    throw new Error('用户信息无效，请刷新页面重试');
                }
                
                // 获取当前页面参数
                const urlParams = new URLSearchParams(window.location.search);
                let currentPage = urlParams.get('page');
                
                // 如果URL中没有page参数，尝试从文件名推断
                if (!currentPage) {
                    const path = window.location.pathname;
                    const filename = path.substring(path.lastIndexOf('/') + 1);
                    currentPage = filename;
                }
                
                // 如果还是没有，默认使用lucky1.html
                if (!currentPage || currentPage === 'luckytemp.html') {
                    currentPage = 'lucky1.html';
                }
                
                // 调用后端抽奖API，传递页面参数
                const drawResult = await api.drawPrizes('lucky_drop', currentMode, currentPage);
                
                if (!drawResult.success) {
                    throw new Error(drawResult.message || drawResult.error || '抽奖失败');
                }
                
                // 执行动画或跳过
                if (skipAnimation) {
                    // 直接显示结果，跳过动画
                    showWinResult(drawResult.prizes || drawResult.results, drawResult.total_value);
                    finishSpin(spinBtn, showcaseArea, slotContainer, scrollY, preventScroll);
                } else {
                    // 播放滚动动画，使用后端返回的结果
                    await performSpinWithResults(drawResult.prizes || drawResult.results);
                    
                    // 根据设备类型设置不同的延迟时间
                    const isMobileDevice = window.innerWidth <= 768;
                    const resultDelay = isMobileDevice ? 4000 : 8000; // 手机3秒动画+1秒，PC 6秒动画+2秒
                    
                    // 显示结果
                    setTimeout(() => {
                        showWinResult(drawResult.prizes || drawResult.results, drawResult.total_value);
                        finishSpin(spinBtn, showcaseArea, slotContainer, scrollY, preventScroll);
                    }, resultDelay);
                }
                
            } catch (error) {
                console.error('抽奖失败:', error);
                alert(error.message || '抽奖失败，请稍后再试！');
                
                finishSpin(spinBtn, showcaseArea, slotContainer, scrollY, preventScroll);
            }
        }
        
        // 完成抽奖的清理工作
        function finishSpin(spinBtn, showcaseArea, slotContainer, scrollY, preventScroll) {
            const isMobile = window.innerWidth <= 768;
            
            // 仅移动端需要恢复滚动
            if (isMobile) {
                // 移除滚动阻止事件
                if (preventScroll) {
                    document.removeEventListener('touchmove', preventScroll);
                    document.removeEventListener('wheel', preventScroll);
                }
                
                // 恢复页面滚动
                document.body.style.overflow = '';
                document.body.style.position = '';
                document.body.style.top = '';
                document.body.style.width = '';
                document.body.style.left = '';
                document.body.style.right = '';
                
                // 恢复滚动位置
                if (typeof scrollY !== 'undefined') {
                    window.scrollTo(0, scrollY);
                }
            }
            
            // 标记抽奖结束
            isDrawing = false;
            
            // 重置按钮
            spinBtn.disabled = false;
            spinBtn.querySelector('.btn-text').textContent = '开始摸金';
            
            // 设置3秒后恢复准备窗口的定时器
            // 如果用户在3秒内再次抽奖，这个定时器会被清除
            showcaseRestoreTimer = setTimeout(() => {
                // 只有在没有进行抽奖时才显示准备窗口
                if (!isDrawing) {
                    showcaseArea.classList.remove('hidden');
                    slotContainer.classList.remove('active');
                }
            }, 3000);
            
            // 更新用户信息
            loadUserInfo();
            
            // 重置所有strip到初始位置，为下次抽奖做准备
            setTimeout(() => {
                const allStrips = document.querySelectorAll('.slot-strip');
                allStrips.forEach(strip => {
                    strip.style.transition = 'none';
                    strip.style.transform = 'translate3d(0, 0, 0)';
                });
            }, 1000);
        }

        // 使用后端结果执行抽奖动画
        async function performSpinWithResults(prizes) {
            const rows = document.querySelectorAll('.slot-row');
            
            // 正常动画流程
            for (let i = 0; i < rows.length && i < prizes.length; i++) {
                const row = rows[i];
                const strip = row.querySelector('.slot-strip');
                const items = strip.querySelectorAll('.slot-item');
                const winningPrize = prizes[i];
                
                // 强制重置到初始位置
                strip.style.transition = 'none';
                strip.style.transform = 'translate3d(0, 0, 0)';
                
                // 强制重绘
                strip.offsetHeight;
                
                // 找到目标奖品的索引 - 在prizeData中查找（而不是在DOM中）
                let targetIndex = -1;
                for (let j = 0; j < prizeData.length; j++) {
                    if (prizeData[j].name === winningPrize.name) {
                        targetIndex = j;
                        break;
                    }
                }
                
                // 如果找不到完全匹配的，寻找相同稀有度的奖品
                if (targetIndex === -1) {
                    for (let j = 0; j < prizeData.length; j++) {
                        if (prizeData[j].rarity === winningPrize.rarity) {
                            targetIndex = j;
                            break;
                        }
                    }
                }
                
                // 最后备用方案：使用第一个奖品
                if (targetIndex === -1) {
                    targetIndex = 0;
                }
                
                // 🚀 关键优化：确保有足够的DOM来完成动画
                // 检查当前DOM数量是否足够
                const isMobile = window.innerWidth <= 768;
                const isSmallMobile = window.innerWidth <= 480;
                const itemWidth = isSmallMobile ? 40 : (isMobile ? 50 : 100);
                const containerWidth = row.offsetWidth;
                const visibleItems = Math.ceil(containerWidth / itemWidth);
                const animationDistance = isSmallMobile ? 10 : (isMobile ? 15 : 20);
                
                // 需要的最小DOM数量：可视区域 + 动画距离 + 目标位置在中间
                const currentRepeats = Math.floor(items.length / prizeData.length);
                const neededRepeats = Math.ceil((visibleItems + animationDistance + prizeData.length) / prizeData.length);
                
                // 如果DOM不够，动态添加
                if (currentRepeats < neededRepeats) {
                    const addRepeats = neededRepeats - currentRepeats;
                    console.log(`🔧 动态补充DOM: 当前${currentRepeats}轮, 需要${neededRepeats}轮, 补充${addRepeats}轮`);
                    
                    for (let repeat = 0; repeat < addRepeats; repeat++) {
                        for (let j = 0; j < prizeData.length; j++) {
                            const prize = prizeData[j];
                            const item = createSlotItem(prize);
                            strip.appendChild(item);
                        }
                    }
                }
                
                // 重新获取items（可能已经添加了新的）
                const updatedItems = strip.querySelectorAll('.slot-item');
                const totalItems = updatedItems.length;
                
                // 计算滚动参数
                const centerPosition = containerWidth / 2;
                
                // 使用中间位置的目标奖品
                const middleIndex = Math.floor(totalItems / 2);
                const adjustedTargetIndex = middleIndex - (middleIndex % prizeData.length) + targetIndex;
                
                // 安全检查
                const safeAdjustedIndex = Math.min(adjustedTargetIndex, totalItems - 1);
                
                // 计算目标物品的中心位置
                const targetItemLeftEdge = safeAdjustedIndex * itemWidth;
                const targetItemCenter = targetItemLeftEdge + itemWidth / 2;
                
                // 计算最终位置：让目标物品中心对齐容器中心
                const finalTranslate = centerPosition - targetItemCenter;
                
                // 安全检查：确保finalTranslate不会过大
                const maxTranslate = containerWidth;
                const minTranslate = -(totalItems * itemWidth - containerWidth);
                const safeFinalTranslate = Math.max(minTranslate, Math.min(maxTranslate, finalTranslate));
                
                // 计算起始位置：从右边开始（更大的正值），向左滚动
                const extraDistance = itemWidth * animationDistance;
                const startTranslate = safeFinalTranslate + extraDistance;
                
                console.log(`Row ${i}: 目标="${winningPrize.name}", targetIndex=${targetIndex}, safeAdjustedIndex=${safeAdjustedIndex}, totalItems=${totalItems}, safeFinalTranslate=${safeFinalTranslate}`);
                
                // 使用requestAnimationFrame确保动画在下一帧执行
                setTimeout(() => {
                    requestAnimationFrame(() => {
                        // 先瞬间移动到起始位置（右边）
                        strip.style.transition = 'none';
                        strip.style.transform = `translate3d(${startTranslate}px, 0, 0)`;
                        strip.offsetHeight; // 强制重绘
                        
                        // 然后动画滚动到目标位置（向左滚动）
                        requestAnimationFrame(() => {
                            // 设置6秒动画（2倍原始时间）
                            const animationDuration = '6s';
                            strip.style.transition = `transform ${animationDuration} cubic-bezier(0.25, 0.1, 0.25, 1)`;
                            strip.style.webkitTransition = `transform ${animationDuration} cubic-bezier(0.25, 0.1, 0.25, 1)`;
                            strip.style.transform = `translate3d(${safeFinalTranslate}px, 0, 0)`;
                            console.log(`🎬 Row ${i} 动画时间: ${animationDuration}`);
                            strip.offsetHeight; // 强制触发重绘
                        });
                    });
                }, 400 + i * 400);
            }
        }

        // 🔒 安全说明：抽奖逻辑完全在后端执行
        // 前端只负责：
        // 1. 展示奖品列表（不含概率）
        // 2. 调用后端API抽奖

                return `

                            <div style="color: #fbbf24; font-size: 13px;">+${parseFloat(prize.value || 0).toFixed(2)}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            result.innerHTML = `
                <div style="max-height: 300px; overflow-y: auto; margin: 15px 0;">
                    ${prizeCards}
                </div>
                <div style="margin-top: 20px; padding-top: 15px; border-top: 2px solid rgba(239, 68, 68, 0.3);">
                    <div style="color: #4ade80; font-size: 16px; margin-bottom: 5px;">恭喜获得总价值</div>
                    <div style="color: #fbbf24; font-size: 24px; font-weight: bold;">${parseFloat(calculatedValue).toFixed(2)}</div>
                    <div style="color: #4ade80; font-size: 14px; margin-top: 5px;">的奖品！</div>
                </div>
            `;
            
            modal.classList.add('show');
            document.body.classList.add('modal-open');
        }

        function generatePrizeGrid() {

        // 生成签到日历
        function generateCalendar() {
            const calendarGrid = document.getElementById('calendarGrid');
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            
            // 获取本月第一天和最后一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            
            // 清空日历
            calendarGrid.innerHTML = '';
            
            // 添加星期标题
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            weekdays.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-day-header';
                dayHeader.textContent = day;
                dayHeader.style.fontWeight = 'bold';
                dayHeader.style.color = '#ffd700';
                calendarGrid.appendChild(dayHeader);
            });
            
            // 添加空白天数（月初）
            const startDay = firstDay.getDay();
            for (let i = 0; i < startDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day empty';
                calendarGrid.appendChild(emptyDay);
            }
            
            // 添加本月天数
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                dayElement.textContent = day;
                
                // 标记今天
                if (day === now.getDate()) {
                    dayElement.classList.add('today');
                }
                
                // 模拟签到状态（实际应该从服务器获取）
                if (Math.random() > 0.7) {
                    dayElement.classList.add('checked');
                    dayElement.title = '已签到';
                }
                
                calendarGrid.appendChild(dayElement);
            }
        }

            const container = document.querySelector('.limited-drop-prizes');
            if (!container) return;

            container.innerHTML = '';

            // 检查是否所有传说物品数量都为0
            const allLegendaryEmpty = limitedDropPrizes.every(prize => {
                return prize.rarity !== 'legendary' || prize.quantity <= 0;
            });
            
            // 如果所有传说物品都没了，自动关闭限时掉落
            if (allLegendaryEmpty && limitedDropPrizes.some(p => p.rarity === 'legendary')) {
                console.log('所有传说物品已被抽完，自动关闭限时掉落');
                closeLimitedDropAutomatically();
                return;
            }

            limitedDropPrizes.forEach(prize => {
                const prizeElement = createLimitedDropPrizeElement(prize);
                container.appendChild(prizeElement);
            });
        }
        
        // 自动关闭限时掉落
        async function closeLimitedDropAutomatically() {
            try {
                // 调用后端API关闭限时掉落
                const response = await fetch('/server/api/limited-drop.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        action: 'toggle_limited_drop',
                        page: currentPageName,
                        is_active: false
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    console.log('限时掉落已自动关闭');
                    hideLimitedDropWindow();
                    
                    // 清除定时器
                    if (limitedDropInterval) {
                        clearInterval(limitedDropInterval);
                        limitedDropInterval = null;
                    }
                }
            } catch (error) {
                console.error('自动关闭限时掉落失败:', error);
            }
        }

        // 创建限时掉落奖品元素
        function createLimitedDropPrizeElement(prize) {
            const div = document.createElement('div');
            div.className = 'limited-drop-prize';
            
            // 使用从服务器获取的爆率数据
            const originalRate = prize.original_rate || '0.001';
            const boostedRate = prize.boosted_rate || '0.005';
            
            // 数量警告样式
            const quantityClass = prize.quantity <= 5 ? 'quantity-warning' : '';
            
            // 修正图片路径：如果是相对路径，添加../前缀
            const imagePath = prize.image_url && (prize.image_url.startsWith('http') || prize.image_url.startsWith('/'))
                ? prize.image_url 
                : (prize.image_url ? '../' + prize.image_url : '');
            
            // 优先使用图片URL，如果没有则使用emoji图标
            const prizeImageHtml = imagePath 
                ? `<img src="${imagePath}" alt="${prize.name}" class="prize-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                   <div class="prize-icon" style="display:none;">${prize.icon || '🎁'}</div>`
                : `<div class="prize-icon">${prize.icon || '🎁'}</div>`;
            
            div.innerHTML = `
                ${prizeImageHtml}
                <div class="prize-name">${prize.name}</div>
                <div class="prize-price">💰 ${prize.value || prize.price || '0'}</div>
                <div class="prize-quantity ${quantityClass}">
                    剩余: ${prize.quantity}
                </div>
                <div class="prize-boost">
                    爆率: ${originalRate}% → ${boostedRate}%
                </div>
            `;
            
            // 添加点击效果
            div.addEventListener('click', () => {
                console.log('点击了奖品:', prize.name);
                showPrizeDetailEffect(div);
            });
            
            return div;
        }

        // 奖品点击特效
        function showPrizeDetailEffect(element) {
            element.style.transform = 'translateY(-8px) scale(1.05)';
            element.style.boxShadow = '0 20px 40px rgba(255, 215, 0, 0.6)';
            
            setTimeout(() => {
                element.style.transform = '';
                element.style.boxShadow = '';
            }, 300);
        }

        // 关闭限时掉落窗口（保留函数但不执行关闭操作）
        function closeLimitedDropWindow() {
            console.log('限时掉落窗口不可关闭');
        }

        // 手动切换限时掉落窗口（仅用于调试）
        function toggleLimitedDropWindow() {
            const window = document.querySelector('.limited-drop-window');
            if (window) {
                if (window.classList.contains('show')) {
                    hideLimitedDropWindow();
                } else {
                    if (limitedDropConfig?.is_active && limitedDropPrizes.length > 0) {
                        showLimitedDropWindow();
                    } else {
                        console.log('限时掉落功能未启用或无奖品数据');
                    }
                }
            }
        }

        // 清理定时器
        window.addEventListener('beforeunload', () => {
            if (limitedDropInterval) {
                clearInterval(limitedDropInterval);
            }
        });

        // 添加键盘快捷键控制（F2切换限时掉落窗口）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F2') {
                e.preventDefault();
                toggleLimitedDropWindow();
            }
        });
    </script>
</body>
</html>
