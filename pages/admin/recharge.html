<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无敌俱乐部</title>
    <script>
        // 超级管理员权限验证 - 简化版本
        async function checkAdminAccess() {
            try {
                // 直接检查超级管理员session状态
                const response = await fetch('../../server/api/super-admin.php?action=check');
                const data = await response.json();
                
                if (!data.authenticated) {
                    alert('需要超级管理员权限！请先登录。');
                    window.location.href = '../../super-admin.html';
                    return false;
                }
                
                return true;
            } catch (error) {
                console.error('权限验证失败:', error);
                alert('系统错误，请重新登录！');
                window.location.href = '../../super-admin.html';
                return false;
            }
        }
        
        // 页面加载时立即验证
        checkAdminAccess();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .header {
            text-align: center;
            margin: 60px 0 40px 0;
        }

        .header h1 {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            font-size: 48px;
            margin-bottom: 10px;
        }

        .section {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section h2 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff4444, #cc3333);
            color: #fff;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.4);
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .option-card {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .option-amount {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .option-coins {
            font-size: 18px;
            color: #4ade80;
            margin-bottom: 15px;
        }

        .table-container {
            overflow-x: auto;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.5);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
        }

        th {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            font-weight: bold;
        }

        .status-pending {
            color: #fbbf24;
        }

        .status-completed {
            color: #4ade80;
        }

        .status-failed {
            color: #ef4444;
        }

        .payment-settings {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .payment-method {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
        }

        .add-option-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            align-items: end;
        }

        @media (max-width: 768px) {
            .payment-settings {
                grid-template-columns: 1fr;
            }
            
            .add-option-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="admin.html" class="back-btn">← 返回管理后台</a>

    <div class="container">
        <div class="header">
            <h1>充值管理系统</h1>
            <p>管理充值比例设置、查看用户充值记录和配置支付方式</p>
        </div>

        <!-- 充值比例设置 -->
        <div class="section">
            <h2>💰 充值比例设置</h2>
            <div class="form-group">
                <label for="coinRatio">1元人民币 = ? 金币</label>
                <input type="number" id="coinRatio" value="10" min="1" placeholder="请输入金币比例">
            </div>
            <button class="btn btn-primary" onclick="saveCoinRatio()">保存比例设置</button>
        </div>

        <!-- 充值选项管理 -->
        <div class="section">
            <h2>🎯 充值选项管理</h2>
            
            <!-- 添加新选项 -->
            <div class="add-option-form">
                <input type="number" id="newAmount" placeholder="充值金额(元)" min="1">
                <input type="number" id="newBonus" placeholder="赠送金币" min="0">
                <button class="btn btn-primary" onclick="addRechargeOption()">添加选项</button>
            </div>

            <!-- 现有选项展示 -->
            <div class="options-container" id="rechargeOptions">
                <!-- 充值选项将在这里动态生成 -->
            </div>
        </div>

        <!-- 支付方式配置 -->
        <div class="section">
            <h2>💳 支付方式配置</h2>
            <div style="text-align: center; padding: 40px;">
                <p style="margin-bottom: 20px; font-size: 16px; color: #ccc;">
                    支付方式配置已迁移到新的管理系统
                </p>
                <a href="recharge-v2.html" class="btn btn-primary" style="display: inline-block; text-decoration: none; padding: 15px 40px; font-size: 18px;">
                    前往支付方式配置 →
                </a>
            </div>
        </div>

        <!-- 充值统计概览 -->
        <div class="section">
            <h2>💰 充值统计概览</h2>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px;">
                <div style="background: rgba(255, 215, 0, 0.1); border: 2px solid #ffd700; border-radius: 15px; padding: 20px; text-align: center;">
                    <div style="font-size: 24px; color: #ffd700; font-weight: bold;" id="totalRevenue">¥0.00</div>
                    <div style="margin-top: 5px; color: #ccc;">总盈利</div>
                </div>
                <div style="background: rgba(74, 222, 128, 0.1); border: 2px solid #4ade80; border-radius: 15px; padding: 20px; text-align: center;">
                    <div style="font-size: 24px; color: #4ade80; font-weight: bold;" id="totalOrders">0</div>
                    <div style="margin-top: 5px; color: #ccc;">总订单数</div>
                </div>
                <div style="background: rgba(139, 92, 246, 0.1); border: 2px solid #8b5cf6; border-radius: 15px; padding: 20px; text-align: center;">
                    <div style="font-size: 24px; color: #8b5cf6; font-weight: bold;" id="todayRevenue">¥0.00</div>
                    <div style="margin-top: 5px; color: #ccc;">今日收入</div>
                </div>
                <div style="background: rgba(239, 68, 68, 0.1); border: 2px solid #ef4444; border-radius: 15px; padding: 20px; text-align: center;">
                    <div style="font-size: 24px; color: #ef4444; font-weight: bold;" id="monthRevenue">¥0.00</div>
                    <div style="margin-top: 5px; color: #ccc;">本月收入</div>
                </div>
            </div>
            
            <button class="btn btn-secondary" onclick="loadRevenueStats()" style="width: 100%;">🔄 刷新统计数据</button>
        </div>

        <!-- 用户充值记录 -->
        <div class="section">
            <h2>📊 用户充值记录</h2>
            
            <!-- 搜索框 -->
            <div style="margin-bottom: 20px;">
                <div class="form-group" style="max-width: 300px; margin-bottom: 0;">
                    <label for="searchInput">按用户名搜索</label>
                    <input type="text" id="searchInput" placeholder="输入用户名进行搜索..." onkeyup="handleSearchKeyup(event)">
                </div>
                <button class="btn btn-primary" onclick="searchRechargeHistory()" style="margin-top: 10px;">搜索</button>
                <button class="btn" onclick="clearSearch()" style="margin-top: 10px; margin-left: 10px; background: #666; color: #fff;">清空</button>
            </div>
            
            <div class="table-container">
                <table id="rechargeHistoryTable">
                    <thead>
                        <tr>
                            <th>订单ID</th>
                            <th>用户ID</th>
                            <th>用户名</th>
                            <th>充值金额</th>
                            <th>获得金币</th>
                            <th>支付方式</th>
                            <th>状态</th>
                            <th>创建时间</th>
                        </tr>
                    </thead>
                    <tbody id="rechargeHistoryBody">
                        <!-- 充值记录将在这里动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时初始化数据
        document.addEventListener('DOMContentLoaded', function() {
            loadCoinRatio();
            loadRechargeOptions();
            loadPaymentSettings();
            loadRechargeHistory();
            loadRevenueStats(); // 加载统计数据
        });

        // API请求函数
        async function apiRequest(action, method = 'GET', data = null) {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            
            if (data) {
                options.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(`../../server/api/recharge.php?action=${action}`, options);
                return await response.json();
            } catch (error) {
                console.error('API请求失败:', error);
                return { success: false, error: error.message };
            }
        }

        // 加载金币比例
        async function loadCoinRatio() {
            const result = await apiRequest('get_coin_ratio');
            if (result.success) {
                document.getElementById('coinRatio').value = result.ratio || 10;
            }
        }

        // 保存金币比例
        async function saveCoinRatio() {
            const ratio = document.getElementById('coinRatio').value;
            if (!ratio || ratio < 1) {
                alert('请输入有效的金币比例！');
                return;
            }

            const result = await apiRequest('save_coin_ratio', 'POST', { ratio: ratio });
            if (result.success) {
                alert('金币比例设置成功！');
            } else {
                alert('设置失败: ' + (result.error || '未知错误'));
            }
        }

        // 加载充值选项
        async function loadRechargeOptions() {
            const result = await apiRequest('get_recharge_options');
            const container = document.getElementById('rechargeOptions');
            
            if (result.success && result.options) {
                const coinRatio = parseInt(document.getElementById('coinRatio').value) || 10;
                
                container.innerHTML = result.options.map(option => `
                    <div class="option-card">
                        <div class="option-amount">${option.amount}元</div>
                        <div class="option-coins">获得 ${(option.amount * coinRatio) + (option.bonus_coins || 0)} 金币</div>
                        ${option.bonus_coins > 0 ? `<div style="color: #4ade80; font-size: 14px;">含赠送 ${option.bonus_coins} 金币</div>` : ''}
                        <button class="btn btn-danger" onclick="deleteRechargeOption(${option.id})" style="margin-top: 10px;">删除</button>
                    </div>
                `).join('');
            } else {
                // 显示默认选项
                container.innerHTML = `
                    <div class="option-card">
                        <div class="option-amount">6元</div>
                        <div class="option-coins">获得 60 金币</div>
                    </div>
                    <div class="option-card">
                        <div class="option-amount">30元</div>
                        <div class="option-coins">获得 300 金币</div>
                    </div>
                    <div class="option-card">
                        <div class="option-amount">68元</div>
                        <div class="option-coins">获得 680 金币</div>
                    </div>
                    <div class="option-card">
                        <div class="option-amount">128元</div>
                        <div class="option-coins">获得 1280 金币</div>
                    </div>
                    <div class="option-card">
                        <div class="option-amount">324元</div>
                        <div class="option-coins">获得 3240 金币</div>
                    </div>
                    <div class="option-card">
                        <div class="option-amount">648元</div>
                        <div class="option-coins">获得 6480 金币</div>
                    </div>
                `;
            }
        }

        // 添加充值选项
        async function addRechargeOption() {
            const amount = document.getElementById('newAmount').value;
            const bonus = document.getElementById('newBonus').value || 0;

            if (!amount || amount < 1) {
                alert('请输入有效的充值金额！');
                return;
            }

            const result = await apiRequest('add_recharge_option', 'POST', {
                amount: amount,
                bonus_coins: bonus
            });

            if (result.success) {
                alert('充值选项添加成功！');
                document.getElementById('newAmount').value = '';
                document.getElementById('newBonus').value = '';
                loadRechargeOptions();
            } else {
                alert('添加失败: ' + (result.error || '未知错误'));
            }
        }

        // 删除充值选项
        async function deleteRechargeOption(id) {
            if (!confirm('确定要删除这个充值选项吗？')) {
                return;
            }

            const result = await apiRequest('delete_recharge_option', 'POST', { id: id });
            if (result.success) {
                alert('充值选项删除成功！');
                loadRechargeOptions();
            } else {
                alert('删除失败: ' + (result.error || '未知错误'));
            }
        }

        // 加载支付设置
        async function loadPaymentSettings() {
            const result = await apiRequest('get_payment_settings');
            if (result.success && result.settings) {
                const settings = result.settings;
                document.getElementById('alipayAppId').value = settings.alipay_app_id || '';
                document.getElementById('alipayPrivateKey').value = settings.alipay_private_key || '';
                document.getElementById('alipayPublicKey').value = settings.alipay_public_key || '';
                document.getElementById('wechatAppId').value = settings.wechat_app_id || '';
                document.getElementById('wechatMchId').value = settings.wechat_mch_id || '';
                document.getElementById('wechatApiKey').value = settings.wechat_api_key || '';
            }
        }

        // 保存支付设置
        async function savePaymentSettings() {
            const settings = {
                alipay_app_id: document.getElementById('alipayAppId').value,
                alipay_private_key: document.getElementById('alipayPrivateKey').value,
                alipay_public_key: document.getElementById('alipayPublicKey').value,
                wechat_app_id: document.getElementById('wechatAppId').value,
                wechat_mch_id: document.getElementById('wechatMchId').value,
                wechat_api_key: document.getElementById('wechatApiKey').value
            };

            const result = await apiRequest('save_payment_settings', 'POST', { settings: settings });
            if (result.success) {
                alert('支付配置保存成功！');
            } else {
                alert('保存失败: ' + (result.error || '未知错误'));
            }
        }

        // 加载充值记录
        async function loadRechargeHistory(search = '') {
            const data = search ? { search: search } : null;
            const result = await apiRequest('get_recharge_history', 'POST', data);
            const tbody = document.getElementById('rechargeHistoryBody');
            
            if (result.success && result.history) {
                tbody.innerHTML = result.history.map(record => `
                    <tr>
                        <td>${record.id}</td>
                        <td>${record.user_id}</td>
                        <td>${record.username || '未知'}</td>
                        <td>¥${record.amount}</td>
                        <td>${record.coins_gained}</td>
                        <td>${record.payment_method === 'alipay' ? '支付宝' : record.payment_method === 'wechat' ? '微信支付' : record.payment_method}</td>
                        <td><span class="status-${record.status}">${getStatusText(record.status)}</span></td>
                        <td>${new Date(record.created_at).toLocaleString()}</td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">暂无充值记录</td></tr>';
            }
        }

        // 搜索充值记录
        async function searchRechargeHistory() {
            const searchValue = document.getElementById('searchInput').value.trim();
            await loadRechargeHistory(searchValue);
        }

        // 清空搜索
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            loadRechargeHistory();
        }

        // 处理搜索框回车事件
        function handleSearchKeyup(event) {
            if (event.key === 'Enter') {
                searchRechargeHistory();
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'pending': '待支付',
                'completed': '已完成',
                'failed': '失败',
                'cancelled': '已取消'
            };
            return statusMap[status] || status;
        }

        // 加载收入统计数据
        async function loadRevenueStats() {
            try {
                const result = await apiRequest('get_revenue_stats', 'GET');
                if (result.success && result.stats) {
                    const stats = result.stats;
                    
                    document.getElementById('totalRevenue').textContent = `¥${parseFloat(stats.total_revenue || 0).toFixed(2)}`;
                    document.getElementById('totalOrders').textContent = stats.total_orders || 0;
                    document.getElementById('todayRevenue').textContent = `¥${parseFloat(stats.today_revenue || 0).toFixed(2)}`;
                    document.getElementById('monthRevenue').textContent = `¥${parseFloat(stats.month_revenue || 0).toFixed(2)}`;
                } else {
                    console.error('加载统计数据失败:', result.error);
                }
            } catch (error) {
                console.error('加载统计数据错误:', error);
            }
        }

        // 定期刷新充值记录和统计数据
        setInterval(() => {
            loadRechargeHistory();
            loadRevenueStats();
        }, 30000); // 每30秒刷新一次
    </script>
</body>
</html>
