<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛皮俱乐部</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            height: 100vh;
        }

        /* 左侧会话列表 */
        .sessions-panel {
            width: 300px;
            background: rgba(0, 0, 0, 0.9);
            border-right: 2px solid #ffd700;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-bottom: 2px solid #ffd700;
        }

        .panel-header h2 {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .session-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #ccc;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-number {
            color: #ffd700;
            font-weight: bold;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .session-item:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .session-item.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .session-item.unread::before {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .session-user {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .session-preview {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-time {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        /* 右侧聊天区域 */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.8);
        }

        .chat-header {
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-bottom: 2px solid #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; /* 防止头部被压缩 */
        }

        .chat-user-info h3 {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .chat-user-status {
            font-size: 12px;
            color: #4ade80;
        }

        .chat-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 0; /* 重要：允许flex子元素正确收缩 */
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        .message.user {
            justify-content: flex-start;
        }

        .message.service {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
        }

        .message.user .message-content {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid #4ade80;
        }

        .message.service .message-content {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
        }

        .message-text {
            color: #fff;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
        }

        .message-sender {
            font-size: 11px;
            color: #ffd700;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .chat-input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #ffd700;
            flex-shrink: 0; /* 防止输入区域被压缩 */
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffd700;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            resize: none;
            min-height: 60px;
            max-height: 120px;
        }

        .chat-input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .send-btn {
            padding: 12px 30px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        
        .back-admin-btn {
            position: fixed;
            top: 20px;
            left: 200px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1000;
            transition: all 0.3s ease;
            display: none;
        }

        .back-admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>
    <a href="users.html" class="back-btn">← 返回用户管理</a>
    <a href="admin.html" class="back-admin-btn" id="backToAdminBtn">← 返回管理后台</a>

    <div class="chat-container">
        <!-- 左侧会话列表 -->
        <div class="sessions-panel">
            <div class="panel-header">
                <h2>💬 客服会话</h2>
                <div class="session-stats">
                    <div class="stat-item">
                        <span>待处理:</span>
                        <span class="stat-number" id="waitingCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>进行中:</span>
                        <span class="stat-number" id="activeCount">0</span>
                    </div>
                </div>
            </div>
            <div class="sessions-list" id="sessionsList">
                <div class="empty-state">
                    <div class="empty-icon">💬</div>
                    <p>暂无会话</p>
                </div>
            </div>
        </div>

        <!-- 右侧聊天区域 -->
        <div class="chat-panel" id="chatArea">
            <div class="empty-state" style="height: 100%;">
                <div class="empty-icon">👋</div>
                <p>选择一个会话开始聊天</p>
            </div>
        </div>
    </div>

    <script>
        let currentSession = null;
        let sessions = [];
        let messagePolling = null;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查用户类型并显示/隐藏返回管理后台按钮
            try {
                const response = await fetch('../../server/api/admin.php?action=check_auth');
                const data = await response.json();
                
                if (data.success && data.user_type === 'super_admin') {
                    document.getElementById('backToAdminBtn').style.display = 'inline-block';
                }
            } catch (error) {
                console.error('权限检查失败:', error);
            }
            
            loadSessions();
            // 每5秒刷新会话列表
            setInterval(loadSessions, 5000);
        });

        // 加载会话列表
        async function loadSessions() {
            try {
                const response = await fetch('../../server/api/customer-service.php?action=sessions', {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    sessions = data.sessions;
                    renderSessions(sessions);
                    updateStats(sessions);
                }
            } catch (error) {
                console.error('加载会话列表失败:', error);
            }
        }

        // 渲染会话列表
        function renderSessions(sessions) {
            const container = document.getElementById('sessionsList');
            
            if (sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <p>暂无会话</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sessions.map(session => {
                const isActive = currentSession && currentSession.session_id === session.session_id;
                const statusClass = session.status === 'waiting' ? 'unread' : '';
                const lastUpdate = new Date(session.updated_at || session.created_at).toLocaleString();
                
                return `
                    <div class="session-item ${isActive ? 'active' : ''} ${statusClass}" 
                         onclick="selectSession('${session.session_id}')">
                        <div class="session-user">${session.user_nickname || session.user_username}</div>
                        <div class="session-preview">
                            ${session.status === 'waiting' ? '等待接入...' : '会话进行中'}
                        </div>
                        <div class="session-time">${lastUpdate}</div>
                    </div>
                `;
            }).join('');
        }

        // 更新统计
        function updateStats(sessions) {
            const waiting = sessions.filter(s => s.status === 'waiting').length;
            const active = sessions.filter(s => s.status === 'active').length;
            
            document.getElementById('waitingCount').textContent = waiting;
            document.getElementById('activeCount').textContent = active;
        }

        // 选择会话
        async function selectSession(sessionId) {
            const session = sessions.find(s => s.session_id === sessionId);
            if (!session) return;
            
            currentSession = session;
            renderChatArea(session);
            await loadMessages(sessionId);
            
            // 开始轮询消息
            if (messagePolling) {
                clearInterval(messagePolling);
            }
            messagePolling = setInterval(() => loadMessages(sessionId), 3000);
        }

        // 渲染聊天区域
        function renderChatArea(session) {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = `
                <div class="chat-header">
                    <div class="chat-user-info">
                        <h3>${session.user_nickname || session.user_username}</h3>
                        <div class="chat-user-status">
                            ${session.status === 'waiting' ? '⏳ 等待接入' : '✅ 会话中'}
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="action-btn" onclick="closeSession('${session.session_id}')">
                            结束会话
                        </button>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea class="chat-input" id="messageInput" 
                                  placeholder="输入消息..." 
                                  onkeypress="handleKeyPress(event)"></textarea>
                        <button class="send-btn" onclick="sendMessage()">发送</button>
                    </div>
                </div>
            `;
        }

        // 加载消息
        async function loadMessages(sessionId) {
            try {
                const response = await fetch(`../../server/api/customer-service.php?action=messages&session_id=${sessionId}`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    renderMessages(data.messages);
                }
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }

        // 渲染消息
        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            
            // 记录滚动位置，判断用户是否在底部
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
            
            container.innerHTML = messages.map(msg => {
                const time = new Date(msg.created_at).toLocaleTimeString('zh-CN', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                return `
                    <div class="message ${msg.sender_type}">
                        <div class="message-content">
                            <div class="message-sender">
                                ${msg.sender_type === 'user' ? '用户' : '客服'}: ${msg.sender_nickname || msg.sender_username}
                            </div>
                            <div class="message-text">${escapeHtml(msg.message)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // 如果用户之前在底部，或者是新消息，自动滚动到底部
            if (isAtBottom || messages.length > 0) {
                // 使用 setTimeout 确保 DOM 更新后再滚动
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 0);
            }
        }

        // 发送消息
        async function sendMessage() {
            if (!currentSession) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            try {
                const response = await fetch('../../server/api/customer-service.php?action=send_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        session_id: currentSession.session_id,
                        message: message,
                        message_type: 'text'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    input.value = '';
                    await loadMessages(currentSession.session_id);
                } else {
                    alert('发送失败: ' + data.error);
                }
            } catch (error) {
                console.error('发送消息失败:', error);
                alert('发送消息失败，请稍后重试');
            }
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 结束会话
        async function closeSession(sessionId) {
            if (!confirm('确定要结束此会话吗？')) return;
            
            try {
                const response = await fetch('../../server/api/customer-service.php?action=close_session', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('会话已结束');
                    currentSession = null;
                    if (messagePolling) {
                        clearInterval(messagePolling);
                    }
                    document.getElementById('chatArea').innerHTML = `
                        <div class="empty-state" style="height: 100%;">
                            <div class="empty-icon">👋</div>
                            <p>选择一个会话开始聊天</p>
                        </div>
                    `;
                    loadSessions();
                } else {
                    alert('结束会话失败: ' + data.error);
                }
            } catch (error) {
                console.error('结束会话失败:', error);
                alert('结束会话失败，请稍后重试');
            }
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
