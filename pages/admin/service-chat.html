<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无敌俱乐部</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            height: 100vh;
        }

        /* 左侧会话列表 */
        .sessions-panel {
            width: 300px;
            background: rgba(0, 0, 0, 0.9);
            border-right: 2px solid #ffd700;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 20px;
            padding-top: 80px;
            background: rgba(255, 215, 0, 0.1);
            border-bottom: 2px solid #ffd700;
        }

        .panel-header h2 {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .session-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #ccc;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-number {
            color: #ffd700;
            font-weight: bold;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .session-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .session-item:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .session-item.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .session-item.unread::before {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .session-user {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .session-preview {
            font-size: 12px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-time {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        /* 右侧聊天区域 */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.8);
        }

        .chat-header {
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-bottom: 2px solid #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; /* 防止头部被压缩 */
        }

        .chat-user-info h3 {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .chat-user-status {
            font-size: 12px;
            color: #4ade80;
        }

        .chat-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 0; /* 重要：允许flex子元素正确收缩 */
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }

        .message.user {
            justify-content: flex-start;
        }

        .message.service {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
        }

        .message.user .message-content {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid #4ade80;
        }

        .message.service .message-content {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
        }

        .message-text {
            color: #fff;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
        }

        .message-sender {
            font-size: 11px;
            color: #ffd700;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .chat-input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #ffd700;
            flex-shrink: 0; /* 防止输入区域被压缩 */
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffd700;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            resize: none;
            min-height: 60px;
            max-height: 120px;
        }

        .chat-input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .send-btn {
            padding: 12px 30px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        
        .back-admin-btn {
            position: fixed;
            top: 20px;
            left: 200px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1000;
            transition: all 0.3s ease;
            display: none;
        }

        .back-admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        /* 公告管理样式 */
        .panel-tabs {
            display: flex;
            gap: 10px;
        }

        .panel-tab {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 8px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .panel-tab:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .panel-tab.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            color: #ffd700;
        }

        .panel-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .announcement-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px 15px;
            background: linear-gradient(45deg, #4ade80, #22c55e);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4);
        }

        .announcements-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .announcement-admin-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .announcement-admin-item:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        .announcement-admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .announcement-admin-title {
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
        }

        .announcement-admin-time {
            color: #999;
            font-size: 12px;
        }

        .announcement-admin-content {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .announcement-admin-actions {
            display: flex;
            gap: 10px;
        }

        .delete-btn {
            padding: 5px 15px;
            background: linear-gradient(45deg, #ef4444, #dc2626);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
        }

        /* 添加公告弹窗 */
        .add-announcement-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .add-announcement-content {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(26, 26, 26, 0.95));
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
        }

        .modal-title {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #ffd700;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn-primary {
            background: linear-gradient(45deg, #4ade80, #22c55e);
            color: white;
        }

        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <a href="users.html" class="back-btn">← 返回用户管理</a>
    <a href="admin.html" class="back-admin-btn" id="backToAdminBtn">← 返回管理后台</a>

    <div class="chat-container">
        <!-- 左侧会话列表 -->
        <div class="sessions-panel">
            <div class="panel-header">
                <div class="panel-tabs">
                    <button class="panel-tab active" onclick="switchPanel('chat')">💬 客服会话</button>
                    <button class="panel-tab" onclick="switchPanel('announcement')">📢 公告管理</button>
                </div>
            </div>
            
            <!-- 客服会话面板 -->
            <div id="chatSessionPanel" class="panel-content">
                <div class="session-stats" style="padding: 10px 20px; border-bottom: 1px solid #444;">
                    <div class="stat-item">
                        <span>待处理:</span>
                        <span class="stat-number" id="waitingCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>进行中:</span>
                        <span class="stat-number" id="activeCount">0</span>
                    </div>
                </div>
                <div class="sessions-list" id="sessionsList">
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <p>暂无会话</p>
                    </div>
                </div>
            </div>
            
            <!-- 公告管理面板 -->
            <div id="announcementPanel" class="panel-content" style="display: none;">
                <div class="announcement-actions" style="padding: 15px; border-bottom: 1px solid #444;">
                    <button class="action-btn" onclick="showAddAnnouncementModal()">
                        <span>➕</span> 发布新公告
                    </button>
                </div>
                <div class="announcements-list" id="announcementsList">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 右侧聊天区域 -->
        <div class="chat-panel" id="chatArea">
            <div class="empty-state" style="height: 100%;">
                <div class="empty-icon">👋</div>
                <p>选择一个会话开始聊天</p>
            </div>
        </div>
    </div>

    <script>
        let currentSession = null;
        let sessions = [];
        let messagePolling = null;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 检查用户类型并显示/隐藏返回管理后台按钮
            try {
                const response = await fetch('../../server/api/admin.php?action=check_auth');
                const data = await response.json();
                
                if (data.success && data.user_type === 'super_admin') {
                    document.getElementById('backToAdminBtn').style.display = 'inline-block';
                }
            } catch (error) {
                console.error('权限检查失败:', error);
            }
            
            loadSessions();
            // 每5秒刷新会话列表
            setInterval(loadSessions, 5000);
        });

        // 加载会话列表
        async function loadSessions() {
            try {
                const response = await fetch('../../server/api/customer-service.php?action=sessions', {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    sessions = data.sessions;
                    renderSessions(sessions);
                    updateStats(sessions);
                }
            } catch (error) {
                console.error('加载会话列表失败:', error);
            }
        }

        // 渲染会话列表
        function renderSessions(sessions) {
            const container = document.getElementById('sessionsList');
            
            if (sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💬</div>
                        <p>暂无会话</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sessions.map(session => {
                const isActive = currentSession && currentSession.session_id === session.session_id;
                const statusClass = session.status === 'waiting' ? 'unread' : '';
                const lastUpdate = new Date(session.updated_at || session.created_at).toLocaleString();
                
                return `
                    <div class="session-item ${isActive ? 'active' : ''} ${statusClass}" 
                         onclick="selectSession('${session.session_id}')">
                        <div class="session-user">${session.user_nickname || session.user_username}</div>
                        <div class="session-preview">
                            ${session.status === 'waiting' ? '等待接入...' : '会话进行中'}
                        </div>
                        <div class="session-time">${lastUpdate}</div>
                    </div>
                `;
            }).join('');
        }

        // 更新统计
        function updateStats(sessions) {
            const waiting = sessions.filter(s => s.status === 'waiting').length;
            const active = sessions.filter(s => s.status === 'active').length;
            
            document.getElementById('waitingCount').textContent = waiting;
            document.getElementById('activeCount').textContent = active;
        }

        // 选择会话
        async function selectSession(sessionId) {
            const session = sessions.find(s => s.session_id === sessionId);
            if (!session) return;
            
            currentSession = session;
            renderChatArea(session);
            await loadMessages(sessionId);
            
            // 开始轮询消息
            if (messagePolling) {
                clearInterval(messagePolling);
            }
            messagePolling = setInterval(() => loadMessages(sessionId), 3000);
        }

        // 渲染聊天区域
        function renderChatArea(session) {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = `
                <div class="chat-header">
                    <div class="chat-user-info">
                        <h3>${session.user_nickname || session.user_username}</h3>
                        <div class="chat-user-status">
                            ${session.status === 'waiting' ? '⏳ 等待接入' : '✅ 会话中'}
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="action-btn" onclick="closeSession('${session.session_id}')">
                            结束会话
                        </button>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea class="chat-input" id="messageInput" 
                                  placeholder="输入消息..." 
                                  onkeypress="handleKeyPress(event)"></textarea>
                        <button class="send-btn" onclick="sendMessage()">发送</button>
                    </div>
                </div>
            `;
        }

        // 加载消息
        async function loadMessages(sessionId) {
            try {
                const response = await fetch(`../../server/api/customer-service.php?action=messages&session_id=${sessionId}`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    renderMessages(data.messages);
                }
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }

        // 渲染消息
        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            
            // 记录滚动位置，判断用户是否在底部
            const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;
            
            container.innerHTML = messages.map(msg => {
                const time = new Date(msg.created_at).toLocaleTimeString('zh-CN', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                return `
                    <div class="message ${msg.sender_type}">
                        <div class="message-content">
                            <div class="message-sender">
                                ${msg.sender_type === 'user' ? '用户' : '客服'}: ${msg.sender_nickname || msg.sender_username}
                            </div>
                            <div class="message-text">${escapeHtml(msg.message)}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // 如果用户之前在底部，或者是新消息，自动滚动到底部
            if (isAtBottom || messages.length > 0) {
                // 使用 setTimeout 确保 DOM 更新后再滚动
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 0);
            }
        }

        // 发送消息
        async function sendMessage() {
            if (!currentSession) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            try {
                const response = await fetch('../../server/api/customer-service.php?action=send_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        session_id: currentSession.session_id,
                        message: message,
                        message_type: 'text'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    input.value = '';
                    await loadMessages(currentSession.session_id);
                } else {
                    alert('发送失败: ' + data.error);
                }
            } catch (error) {
                console.error('发送消息失败:', error);
                alert('发送消息失败，请稍后重试');
            }
        }

        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 结束会话
        async function closeSession(sessionId) {
            if (!confirm('确定要结束此会话吗？')) return;
            
            try {
                const response = await fetch('../../server/api/customer-service.php?action=close_session', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('会话已结束');
                    currentSession = null;
                    if (messagePolling) {
                        clearInterval(messagePolling);
                    }
                    document.getElementById('chatArea').innerHTML = `
                        <div class="empty-state" style="height: 100%;">
                            <div class="empty-icon">👋</div>
                            <p>选择一个会话开始聊天</p>
                        </div>
                    `;
                    loadSessions();
                } else {
                    alert('结束会话失败: ' + data.error);
                }
            } catch (error) {
                console.error('结束会话失败:', error);
                alert('结束会话失败，请稍后重试');
            }
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 公告管理功能 ====================

        /**
         * 切换面板
         */
        function switchPanel(panel) {
            // 更新标签状态
            document.querySelectorAll('.panel-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 切换面板显示
            if (panel === 'chat') {
                document.getElementById('chatSessionPanel').style.display = 'flex';
                document.getElementById('announcementPanel').style.display = 'none';
            } else if (panel === 'announcement') {
                document.getElementById('chatSessionPanel').style.display = 'none';
                document.getElementById('announcementPanel').style.display = 'flex';
                loadAnnouncementsAdmin();
            }
        }

        /**
         * 加载公告列表（管理端）
         */
        async function loadAnnouncementsAdmin() {
            const listContainer = document.getElementById('announcementsList');
            listContainer.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const response = await fetch('../../server/api/announcement.php?action=get_announcements');
                const result = await response.json();
                
                if (result.success) {
                    const announcements = result.announcements;
                    
                    if (announcements.length === 0) {
                        listContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">📢</div><p>暂无公告</p></div>';
                        return;
                    }
                    
                    listContainer.innerHTML = announcements.map(announcement => `
                        <div class="announcement-admin-item">
                            <div class="announcement-admin-header">
                                <div class="announcement-admin-title">${escapeHtml(announcement.title)}</div>
                                <div class="announcement-admin-time">${formatTime(announcement.created_at)}</div>
                            </div>
                            <div class="announcement-admin-content">${escapeHtml(announcement.content).replace(/\n/g, '<br>')}</div>
                            <div class="announcement-admin-actions">
                                <button class="delete-btn" onclick="deleteAnnouncement(${announcement.id})">删除</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listContainer.innerHTML = '<div class="error">加载失败，请稍后再试</div>';
                }
            } catch (error) {
                console.error('加载公告失败:', error);
                listContainer.innerHTML = '<div class="error">加载失败，请稍后再试</div>';
            }
        }

        /**
         * 显示添加公告弹窗
         */
        function showAddAnnouncementModal() {
            document.getElementById('addAnnouncementModal').style.display = 'flex';
        }

        /**
         * 关闭添加公告弹窗
         */
        function closeAddAnnouncementModal() {
            document.getElementById('addAnnouncementModal').style.display = 'none';
            document.getElementById('announcementTitle').value = '';
            document.getElementById('announcementContent').value = '';
        }

        /**
         * 提交公告
         */
        async function submitAnnouncement() {
            const title = document.getElementById('announcementTitle').value.trim();
            const content = document.getElementById('announcementContent').value.trim();
            
            if (!title || !content) {
                alert('请填写标题和内容');
                return;
            }
            
            try {
                const response = await fetch('../../server/api/announcement.php?action=add_announcement', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        content: content
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('公告发布成功！');
                    closeAddAnnouncementModal();
                    loadAnnouncementsAdmin();
                } else {
                    alert('发布失败: ' + (result.error || '未知错误'));
                }
            } catch (error) {
                console.error('发布公告失败:', error);
                alert('发布失败，请稍后再试');
            }
        }

        /**
         * 删除公告
         */
        async function deleteAnnouncement(announcementId) {
            if (!confirm('确定要删除这条公告吗？')) {
                return;
            }
            
            try {
                const response = await fetch('../../server/api/announcement.php?action=delete_announcement', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        announcement_id: announcementId
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('公告删除成功！');
                    loadAnnouncementsAdmin();
                } else {
                    alert('删除失败: ' + (result.error || '未知错误'));
                }
            } catch (error) {
                console.error('删除公告失败:', error);
                alert('删除失败，请稍后再试');
            }
        }

        /**
         * 格式化时间
         */
        function formatTime(timeString) {
            const date = new Date(timeString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return date.toLocaleDateString('zh-CN');
        }
    </script>

    <!-- 添加公告弹窗 -->
    <div class="add-announcement-modal" id="addAnnouncementModal">
        <div class="add-announcement-content">
            <h2 class="modal-title">📢 发布新公告</h2>
            <div class="form-group">
                <label class="form-label">公告标题</label>
                <input type="text" class="form-input" id="announcementTitle" placeholder="请输入公告标题" maxlength="200">
            </div>
            <div class="form-group">
                <label class="form-label">公告内容</label>
                <textarea class="form-textarea" id="announcementContent" placeholder="请输入公告内容"></textarea>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeAddAnnouncementModal()">取消</button>
                <button class="modal-btn modal-btn-primary" onclick="submitAnnouncement()">发布</button>
            </div>
        </div>
    </div>
</body>
</html>
