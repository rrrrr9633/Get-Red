<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无敌俱乐部</title>
    <script src="../../js/api-client.js"></script>
    <script>
        // 超级管理员权限验证 - 简化版本
        async function checkAdminAccess() {
            try {
                // 直接检查超级管理员session状态
                const response = await fetch('../../server/api/super-admin.php?action=check');
                const data = await response.json();
                
                if (!data.authenticated) {
                    alert('需要超级管理员权限！请先登录。');
                    window.location.href = '../../super-admin.html';
                    return false;
                }
                
                return true;
            } catch (error) {
                console.error('权限验证失败:', error);
                alert('系统错误，请重新登录！');
                window.location.href = '../../super-admin.html';
                return false;
            }
        }
        
        // 页面加载时立即验证
        checkAdminAccess();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
            color: #fff;
            min-height: 100vh;
        }

        .admin-header {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 0;
            border-bottom: 2px solid #ffd700;
            text-align: center;
        }

        .admin-header h1 {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            font-size: 32px;
            cursor: pointer;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .nav-btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .nav-btn.active {
            background: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .probability-summary {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .probability-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .probability-label {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .probability-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .probability-status {
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .probability-status.perfect {
            background: #22c55e;
            color: #000;
        }

        .probability-status.low {
            background: #f59e0b;
            color: #000;
        }

        .probability-status.high {
            background: #ef4444;
            color: #fff;
        }

        .prizes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .prize-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .prize-card:hover {
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            transform: translateY(-5px);
        }

        .prize-image-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .prize-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #ffd700;
            margin-bottom: 10px;
        }

        .prize-icon {
            font-size: 60px;
            margin-bottom: 10px;
            display: block;
        }

        .prize-info h3 {
            color: #ffd700;
            margin-bottom: 10px;
            text-align: center;
        }

        .prize-details {
            display: grid;
            gap: 8px;
            margin-bottom: 15px;
        }

        .prize-detail {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .prize-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .btn-toggle {
            background: #10b981;
            color: white;
        }

        .btn-toggle:hover {
            background: #059669;
        }

        .btn-toggle.inactive {
            background: #6b7280;
        }

        .add-prize-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 50%;
            color: #000;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
        }

        .add-prize-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .modal-header h2 {
            color: #ffd700;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ffd700;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffd700;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .image-preview {
            text-align: center;
            margin: 10px 0;
        }

        .preview-image {
            max-width: 100px;
            max-height: 100px;
            border-radius: 5px;
            border: 2px solid #ffd700;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .loading {
            text-align: center;
            color: #ffd700;
            font-size: 18px;
            padding: 40px;
        }

        .error {
            color: #ef4444;
            text-align: center;
            margin: 20px 0;
        }

        .success {
            color: #10b981;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .prizes-grid {
                grid-template-columns: 1fr;
            }

            .admin-nav {
                flex-direction: column;
                align-items: center;
            }

            .modal-content {
                margin: 20px;
                width: calc(100% - 40px);
            }
        }

        /* 抽奖价格控制区域样式 */
        .price-control-section {
            background: linear-gradient(135deg, rgba(0,0,0,0.95), rgba(20,20,20,0.95));
            border-top: 2px solid #ffd700;
            padding: 30px 0;
            margin-top: 40px;
        }

        .price-control-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .price-control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 20px;
        }

        .price-control-header h3 {
            color: #ffd700;
            font-size: 24px;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .current-page-indicator {
            color: #fff;
            font-size: 16px;
        }

        .current-page-indicator span:last-child {
            color: #ffd700;
            font-weight: bold;
        }

        .price-control-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .price-item {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .price-item:hover {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .price-item label {
            display: block;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .price-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .price-input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .price-input-group input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            outline: none;
        }

        .btn-update {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-update:hover {
            background: linear-gradient(45deg, #ffed4e, #ffd700);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .price-control-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn-warning {
            background: linear-gradient(45deg, #f59e0b, #fbbf24);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-warning:hover {
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .price-history {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
        }

        .price-history h4 {
            color: #ffd700;
            margin: 0 0 15px 0;
            font-size: 18px;
        }

        .price-history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            color: #ccc;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-time {
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .price-control-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .price-control-grid {
                grid-template-columns: 1fr;
            }

            .price-control-actions {
                flex-direction: column;
                align-items: center;
            }

            .price-input-group {
                flex-direction: column;
            }

            .btn-update {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1 onclick="goToHome()">奖品管理系统</h1>
        <div id="currentLuckyPage" style="margin-top:10px;color:#ffd700;font-size:18px;"></div>
    </div>

    <div class="admin-container">
        <div class="admin-nav">
            <a href="admin.html" class="nav-btn">返回管理中心</a>
            <button class="nav-btn active">奖品管理</button>
            <button class="nav-btn" onclick="showLimitedDropConfig()">限时掉落配置</button>
            <a href="../main.html" class="nav-btn">返回游戏</a>
        </div>

        <!-- 概率统计显示 -->
        <div class="probability-summary">
            <div class="probability-info">
                <span class="probability-label">总概率:</span>
                <span id="totalProbability" class="probability-value">0%</span>
                <span id="probabilityStatus" class="probability-status"></span>
            </div>
            <div class="probability-actions">
                <button id="autoBalanceBtn" class="nav-btn" onclick="autoBalanceProbabilities()" style="display:none;">自动平衡概率</button>
            </div>
        </div>

        <div id="prizesContainer" class="prizes-grid">
            <div class="loading">加载中...</div>
        </div>

        <button class="add-prize-btn" onclick="showAddPrizeModal()" title="添加新奖品">+</button>
    </div>

    <!-- 添加/编辑奖品模态框 -->
    <div id="prizeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加奖品</h2>
                <a href="../../luckytemp.html" target="_blank" style="position: absolute; top: 15px; right: 15px; font-size: 11px; color: #666; text-decoration: none; padding: 4px 8px; border: 1px solid #444; border-radius: 4px; background: rgba(0,0,0,0.3); transition: all 0.2s;" onmouseover="this.style.color='#4ade80'; this.style.borderColor='#4ade80';" onmouseout="this.style.color='#666'; this.style.borderColor='#444';" title="开发人员预览模板页面">
                    🔧 预览模板
                </a>
            </div>
            
            <form id="prizeForm">
                <input type="hidden" id="prizeId">
                
                <div class="form-group">
                    <label for="prizeName">奖品名称</label>
                    <input type="text" id="prizeName" required>
                </div>

                <div class="form-group">
                    <label for="prizeIcon">奖品图标 (Emoji)</label>
                    <input type="text" id="prizeIcon" placeholder="📱">
                </div>

                <div class="form-group">
                    <label for="prizeImageUrl">奖品图片</label>
                    <div style="margin-bottom: 10px;">
                        <label style="display: inline-flex; align-items: center; margin-right: 20px; cursor: pointer;">
                            <input type="radio" name="imageInputType" value="url" checked style="margin-right: 5px;">
                            <span>URL地址</span>
                        </label>
                        <label style="display: inline-flex; align-items: center; cursor: pointer;">
                            <input type="radio" name="imageInputType" value="file" style="margin-right: 5px;">
                            <span>本地上传</span>
                        </label>
                    </div>
                    <div id="urlInputGroup">
                        <input type="url" id="prizeImageUrl" placeholder="https://example.com/image.jpg">
                    </div>
                    <div id="fileInputGroup" style="display: none;">
                        <input type="file" id="prizeImageFile" accept="image/*" style="margin-bottom: 10px;">
                    </div>
                    <div class="image-preview" id="imagePreview"></div>
                </div>

                <div class="form-group">
                    <label for="prizeValue">奖品价值</label>
                    <input type="number" id="prizeValue" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="prizeProbability">默认中奖概率 (%)</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="number" id="prizeProbability" min="0" max="100" step="0.01" required style="flex: 1;">
                        <button type="button" id="restoreProbabilityBtn" onclick="restoreOriginalProbability()" 
                                style="display: none; padding: 8px 12px; background: #ffd700; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap;">
                            恢复上次概率
                        </button>
                    </div>
                    <small style="color: #888; display: block; margin-top: 5px;">此为奖品的默认概率，适用于所有未设置页面特定概率的页面</small>
                    <small id="probabilityHint" style="color: #888; display: none; margin-top: 5px;"></small>
                </div>

                <div class="form-group">
                    <label for="prizePageProbability">
                        当前页面特定概率 (%)
                        <small style="color: #888; font-weight: normal;">（可选，留空则使用默认概率）</small>
                    </label>
                    <input type="number" id="prizePageProbability" min="0" max="100" step="0.01" 
                           placeholder="留空使用默认概率">
                    <small style="color: #4ade80; font-size: 12px; display: block; margin-top: 5px;">
                        💡 设置后，该奖品在当前页面(<span id="currentPageInForm" style="color: #ffd700;"></span>)将使用此概率
                    </small>
                </div>

                <div class="form-group">
                    <label for="prizeRarity">稀有度</label>
                    <select id="prizeRarity" required onchange="handleRarityChange()">
                        <option value="common">普通</option>
                        <option value="rare">稀有</option>
                        <option value="epic">史诗</option>
                        <option value="legendary">传说</option>
                    </select>
                </div>

                <div class="form-group" id="quantityGroup" style="display: none;">
                    <label for="prizeQuantity">数量限制</label>
                    <input type="number" id="prizeQuantity" min="1" placeholder="输入传说物品数量">
                    <small style="color: #ccc; font-size: 12px;">仅传说物品需要设置数量限制</small>
                </div>

                <div class="form-group">
                    <label for="prizeActive">状态</label>
                    <select id="prizeActive" required>
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn-primary">保存</button>
                    <button type="button" class="btn-secondary" onclick="closePrizeModal()">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 抽奖价格控制区域 -->
    <div class="price-control-section">
        <div class="price-control-container">
            <div class="price-control-header">
                <h3>抽奖价格设置</h3>
                <div class="current-page-indicator">
                    <span>当前页面: </span>
                    <span id="priceControlCurrentPage"></span>
                </div>
            </div>
            
            <div class="price-control-content">
                <div class="price-control-grid">
                    <div class="price-item">
                        <label for="singleDrawPrice">单抽价格 (金币)</label>
                        <div class="price-input-group">
                            <input type="number" id="singleDrawPrice" min="1" value="10">
                            <button type="button" onclick="updateDrawPrice('single')" class="btn-update">更新</button>
                        </div>
                        <label for="singleDrawName" style="margin-top:10px;">按钮名称</label>
                        <input type="text" id="singleDrawName" placeholder="单抽" maxlength="20" style="width:100%;padding:8px;border-radius:5px;border:1px solid #444;background:rgba(0,0,0,0.8);color:#fff;margin-top:5px;">
                    </div>
                    
                    <div class="price-item">
                        <label for="tripleDrawPrice">三连抽价格 (金币)</label>
                        <div class="price-input-group">
                            <input type="number" id="tripleDrawPrice" min="1" value="30">
                            <button type="button" onclick="updateDrawPrice('triple')" class="btn-update">更新</button>
                        </div>
                        <label for="tripleDrawName" style="margin-top:10px;">按钮名称</label>
                        <input type="text" id="tripleDrawName" placeholder="三连抽" maxlength="20" style="width:100%;padding:8px;border-radius:5px;border:1px solid #444;background:rgba(0,0,0,0.8);color:#fff;margin-top:5px;">
                    </div>
                    
                    <div class="price-item">
                        <label for="quintupleDrawPrice">五连抽价格 (金币)</label>
                        <div class="price-input-group">
                            <input type="number" id="quintupleDrawPrice" min="1" value="50">
                            <button type="button" onclick="updateDrawPrice('quintuple')" class="btn-update">更新</button>
                        </div>
                        <label for="quintupleDrawName" style="margin-top:10px;">按钮名称</label>
                        <input type="text" id="quintupleDrawName" placeholder="五连抽" maxlength="20" style="width:100%;padding:8px;border-radius:5px;border:1px solid #444;background:rgba(0,0,0,0.8);color:#fff;margin-top:5px;">
                    </div>
                </div>
                
                <div class="price-control-actions">
                    <button type="button" onclick="loadCurrentPrices()" class="btn-secondary">刷新价格</button>
                    <button type="button" onclick="resetToDefaultPrices()" class="btn-warning">恢复默认价格</button>
                    <button type="button" onclick="batchUpdatePrices()" class="btn-primary">批量更新</button>
                </div>
                
                <div class="price-history">
                    <h4>价格更新历史</h4>
                    <div id="priceHistory" class="price-history-list">
                        <div class="loading">加载历史记录中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let prizes = [];
        let editingPrizeId = null;

        // 获取URL参数
        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            const luckyPage = getQueryParam('page') || 'lucky1.html';
            document.getElementById('currentLuckyPage').textContent = '当前管理页面: ' + luckyPage;
            document.getElementById('priceControlCurrentPage').textContent = luckyPage;
            window.currentLuckyPage = luckyPage;
            loadPrizes();
            setupEventListeners();
            loadCurrentPrices(); // 加载当前价格设置
            loadPriceHistory(); // 加载价格历史
        });

        // 设置事件监听器
        function setupEventListeners() {
            // 图片输入方式切换
            document.querySelectorAll('input[name="imageInputType"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const urlGroup = document.getElementById('urlInputGroup');
                    const fileGroup = document.getElementById('fileInputGroup');
                    const urlInput = document.getElementById('prizeImageUrl');
                    const fileInput = document.getElementById('prizeImageFile');
                    
                    if (this.value === 'url') {
                        urlGroup.style.display = 'block';
                        fileGroup.style.display = 'none';
                        fileInput.value = '';
                        // 启用URL输入框
                        urlInput.disabled = false;
                        // 不清空预览，保持当前显示的图片
                    } else {
                        urlGroup.style.display = 'none';
                        fileGroup.style.display = 'block';
                        // 禁用URL输入框，避免HTML5验证
                        urlInput.disabled = true;
                        // 切换到文件上传时，不清空URL和预览，让用户可以看到当前图片
                    }
                });
            });
            
            // 图片URL预览
            document.getElementById('prizeImageUrl').addEventListener('input', function() {
                const url = this.value;
                const preview = document.getElementById('imagePreview');
                
                if (url) {
                    preview.innerHTML = `<img src="${url}" alt="预览" class="preview-image" onerror="this.style.display='none'">`;
                } else {
                    preview.innerHTML = '';
                }
            });
            
            // 文件上传预览
            document.getElementById('prizeImageFile').addEventListener('change', function() {
                const file = this.files[0];
                const preview = document.getElementById('imagePreview');
                
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        preview.innerHTML = `<img src="${e.target.result}" alt="预览" class="preview-image">`;
                    };
                    reader.readAsDataURL(file);
                } else {
                    preview.innerHTML = '';
                }
            });

            // 表单提交
            document.getElementById('prizeForm').addEventListener('submit', function(e) {
                e.preventDefault();
                savePrize();
            });
        }

        // 加载奖品列表
        async function loadPrizes() {
            try {
                // 传递lucky页面参数，后端可据此区分不同页面奖品
                const response = await fetch(`../../server/api/admin.php?action=prizes&page=${encodeURIComponent(window.currentLuckyPage)}`);
                const data = await response.json();
                
                if (data.success) {
                    prizes = data.prizes;
                    renderPrizes();
                    updateProbabilitySummary();
                } else {
                    showError('加载奖品失败: ' + data.error);
                }
            } catch (error) {
                console.error('加载奖品失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 渲染奖品列表
        function renderPrizes() {
            const container = document.getElementById('prizesContainer');
            
            if (prizes.length === 0) {
                container.innerHTML = '<div class="loading">暂无奖品数据</div>';
                return;
            }

            // 排序：启用的在前，禁用的在后；同状态按概率降序
            const sortedPrizes = [...prizes].sort((a, b) => {
                // 首先按启用状态排序（启用=1在前，禁用=0在后）
                if (a.active !== b.active) {
                    return b.active - a.active;
                }
                
                // 同状态下，按概率降序排序
                const probA = a.page_probability !== null && a.page_probability !== undefined ? a.page_probability : a.probability;
                const probB = b.page_probability !== null && b.page_probability !== undefined ? b.page_probability : b.probability;
                return parseFloat(probB) - parseFloat(probA);
            });

            container.innerHTML = sortedPrizes.map(prize => {
                // 判断是否使用页面特定概率
                const usingPageProbability = prize.page_probability !== null && prize.page_probability !== undefined;
                const displayProbability = usingPageProbability ? prize.page_probability : prize.probability;
                
                return `
                <div class="prize-card">
                    <div class="prize-image-container">
                        ${prize.image_url ? 
                            `<img src="../../${prize.image_url}" alt="${prize.name}" class="prize-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                             <span class="prize-icon" style="display:none;">${prize.icon}</span>` :
                            `<span class="prize-icon">${prize.icon}</span>`
                        }
                    </div>
                    <div class="prize-info">
                        <h3>${prize.name}</h3>
                        <div class="prize-details">
                            <div class="prize-detail">
                                <span>价值:</span>
                                <span>¥${prize.value}</span>
                            </div>
                            <div class="prize-detail">
                                <span>当前概率:</span>
                                <span>
                                    ${displayProbability}%
                                    ${usingPageProbability ? 
                                        `<small style="color: #4ade80;"> (页面特定)</small>` : 
                                        `<small style="color: #888;"> (默认)</small>`
                                    }
                                    ${prize.rarity === 'legendary' && 
                                      parseFloat(displayProbability) === 0 && 
                                      prize.original_probability !== null && 
                                      parseFloat(prize.original_probability) > 0 
                                      ? ` <small style="color: #ffd700;">(可恢复至${prize.original_probability}%)</small>` 
                                      : ''
                                    }
                                </span>
                            </div>
                            ${usingPageProbability ? 
                                `<div class="prize-detail">
                                    <span>默认概率:</span>
                                    <span style="color: #888;">${prize.default_probability || prize.probability}%</span>
                                </div>` : ''
                            }
                            <div class="prize-detail">
                                <span>稀有度:</span>
                                <span>${getRarityText(prize.rarity)}</span>
                            </div>
                            ${prize.rarity === 'legendary' && prize.quantity !== null ? 
                                `<div class="prize-detail">
                                    <span>数量:</span>
                                    <span style="color: ${prize.quantity <= 0 ? '#ff4444' : '#44ff44'}">${prize.quantity}</span>
                                </div>` : ''
                            }
                            <div class="prize-detail">
                                <span>状态:</span>
                                <span>${prize.active ? '✅ 启用' : '❌ 禁用'}</span>
                            </div>
                            ${!prize.is_linked ? 
                                `<div class="prize-detail" style="color: #ff9800;">
                                    <span>⚠️ 未关联到当前页面</span>
                                </div>` : ''
                            }
                        </div>
                        <div class="prize-actions">
                            <button class="btn btn-edit" onclick="editPrize(${prize.id})">编辑</button>
                            <button class="btn btn-toggle ${prize.active ? '' : 'inactive'}" 
                                    onclick="togglePrize(${prize.id}, ${prize.active})">
                                ${prize.active ? '禁用' : '启用'}
                            </button>
                            <button class="btn btn-delete" onclick="deletePrize(${prize.id})">删除</button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        // 获取稀有度文本
        function getRarityText(rarity) {
            const rarityMap = {
                'common': '普通',
                'rare': '稀有',
                'epic': '史诗',
                'legendary': '传说'
            };
            return rarityMap[rarity] || '普通';
        }

        // 更新概率统计
        function updateProbabilitySummary() {
            const activePrizes = prizes.filter(prize => prize.active);
            
            // 使用实际概率（页面特定或默认）
            const totalProbability = activePrizes.reduce((sum, prize) => {
                const actualProb = prize.page_probability !== null && prize.page_probability !== undefined 
                    ? prize.page_probability 
                    : prize.probability;
                return sum + parseFloat(actualProb);
            }, 0);
            
            const totalElement = document.getElementById('totalProbability');
            const statusElement = document.getElementById('probabilityStatus');
            const autoBalanceBtn = document.getElementById('autoBalanceBtn');
            
            totalElement.textContent = totalProbability.toFixed(2) + '%';
            
            if (Math.abs(totalProbability - 100) < 0.01) {
                statusElement.textContent = '完美';
                statusElement.className = 'probability-status perfect';
                autoBalanceBtn.style.display = 'none';
            } else if (totalProbability < 100) {
                statusElement.textContent = `缺少 ${(100 - totalProbability).toFixed(2)}%`;
                statusElement.className = 'probability-status low';
                autoBalanceBtn.style.display = 'inline-block';
            } else {
                statusElement.textContent = `超出 ${(totalProbability - 100).toFixed(2)}%`;
                statusElement.className = 'probability-status high';
                autoBalanceBtn.style.display = 'none';
            }
        }

        // 自动平衡概率
        async function autoBalanceProbabilities() {
            const activePrizes = prizes.filter(prize => prize.active);
            if (activePrizes.length === 0) {
                showError('没有启用的奖品需要平衡');
                return;
            }

            const totalProbability = activePrizes.reduce((sum, prize) => sum + parseFloat(prize.probability), 0);
            if (totalProbability >= 100) {
                showError('总概率已达到或超过100%，无需自动平衡');
                return;
            }

            const remainingProbability = 100 - totalProbability;
            const averageProbability = remainingProbability / activePrizes.length;

            // 更新每个活跃奖品的概率
            const updatePromises = activePrizes.map(async (prize) => {
                const newProbability = parseFloat(prize.probability) + averageProbability;
                
                const response = await fetch(`../../server/api/admin.php?action=update_prize&page=${currentLuckyPage}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: prize.id,
                        name: prize.name,
                        icon: prize.icon,
                        image_url: prize.image_url,
                        value: prize.value,
                        probability: newProbability,
                        rarity: prize.rarity,
                        active: prize.active
                    })
                });

                return response.json();
            });

            try {
                const results = await Promise.all(updatePromises);
                const allSuccess = results.every(result => result.success);
                
                if (allSuccess) {
                    showSuccess('概率平衡完成！');
                    loadPrizes();
                } else {
                    showError('部分奖品概率更新失败');
                    loadPrizes();
                }
            } catch (error) {
                console.error('自动平衡概率失败:', error);
                showError('自动平衡失败，请稍后重试');
            }
        }

        // 处理稀有度变化
        function handleRarityChange() {
            const rarity = document.getElementById('prizeRarity').value;
            const quantityGroup = document.getElementById('quantityGroup');
            const restoreBtn = document.getElementById('restoreProbabilityBtn');
            const probabilityHint = document.getElementById('probabilityHint');
            
            if (rarity === 'legendary') {
                quantityGroup.style.display = 'block';
                document.getElementById('prizeQuantity').required = true;
                
                // 如果是编辑模式且有原始概率，显示恢复选项
                if (editingPrizeId) {
                    const prize = prizes.find(p => p.id == editingPrizeId);
                    if (prize && prize.original_probability !== null && prize.original_probability !== undefined) {
                        const originalProb = parseFloat(prize.original_probability);
                        if (originalProb > 0) {
                            restoreBtn.style.display = 'block';
                            restoreBtn.dataset.originalProbability = originalProb;
                            probabilityHint.style.display = 'block';
                            probabilityHint.textContent = `提示：该传说物品的原始概率为 ${originalProb}%`;
                        }
                    }
                }
            } else {
                quantityGroup.style.display = 'none';
                document.getElementById('prizeQuantity').required = false;
                document.getElementById('prizeQuantity').value = '';
                
                // 非传说物品隐藏概率恢复功能
                restoreBtn.style.display = 'none';
                probabilityHint.style.display = 'none';
            }
        }

        // 显示添加奖品模态框
        function showAddPrizeModal() {
            editingPrizeId = null;
            document.getElementById('modalTitle').textContent = '添加奖品';
            document.getElementById('prizeForm').reset();
            document.getElementById('prizeId').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            
            // 显示当前页面
            document.getElementById('currentPageInForm').textContent = window.currentLuckyPage;
            
            // 隐藏概率恢复相关元素
            document.getElementById('restoreProbabilityBtn').style.display = 'none';
            document.getElementById('probabilityHint').style.display = 'none';
            
            document.getElementById('prizeModal').classList.add('show');
        }

        // 显示编辑奖品模态框
        function editPrize(id) {
            const prize = prizes.find(p => p.id == id);
            if (!prize) return;

            editingPrizeId = id;
            document.getElementById('modalTitle').textContent = '编辑奖品';
            document.getElementById('prizeId').value = prize.id;
            document.getElementById('prizeName').value = prize.name;
            document.getElementById('prizeIcon').value = prize.icon;
            document.getElementById('prizeImageUrl').value = prize.image_url || '';
            document.getElementById('prizeValue').value = prize.value;
            
            // 设置默认概率
            document.getElementById('prizeProbability').value = prize.default_probability || prize.probability;
            
            // 设置页面特定概率（如果有）
            const pageProbInput = document.getElementById('prizePageProbability');
            if (prize.page_probability !== null && prize.page_probability !== undefined) {
                pageProbInput.value = prize.page_probability;
            } else {
                pageProbInput.value = '';
            }
            
            // 显示当前页面
            document.getElementById('currentPageInForm').textContent = window.currentLuckyPage;
            
            document.getElementById('prizeRarity').value = prize.rarity;
            document.getElementById('prizeActive').value = prize.active;
            
            // 处理传说物品的概率恢复功能
            const restoreBtn = document.getElementById('restoreProbabilityBtn');
            const probabilityHint = document.getElementById('probabilityHint');
            
            if (prize.rarity === 'legendary' && prize.original_probability !== null && prize.original_probability !== undefined) {
                const originalProb = parseFloat(prize.original_probability);
                const currentProb = parseFloat(prize.page_probability !== null && prize.page_probability !== undefined ? prize.page_probability : prize.probability);
                
                // 如果当前概率为0且有原始概率，显示恢复按钮
                if (currentProb === 0 && originalProb > 0) {
                    restoreBtn.style.display = 'block';
                    restoreBtn.dataset.originalProbability = originalProb;
                    probabilityHint.style.display = 'block';
                    probabilityHint.textContent = `提示：该传说物品的上次概率为 ${originalProb}%，可点击按钮快速恢复`;
                } else if (originalProb > 0 && originalProb !== currentProb) {
                    // 如果有原始概率且与当前概率不同，也显示恢复选项
                    restoreBtn.style.display = 'block';
                    restoreBtn.dataset.originalProbability = originalProb;
                    probabilityHint.style.display = 'block';
                    probabilityHint.textContent = `提示：该传说物品的原始概率为 ${originalProb}%`;
                } else {
                    restoreBtn.style.display = 'none';
                    probabilityHint.style.display = 'none';
                }
            } else {
                restoreBtn.style.display = 'none';
                probabilityHint.style.display = 'none';
            }
            
            // 处理数量字段
            if (prize.rarity === 'legendary') {
                document.getElementById('quantityGroup').style.display = 'block';
                document.getElementById('prizeQuantity').value = prize.quantity || '';
                document.getElementById('prizeQuantity').required = true;
            } else {
                document.getElementById('quantityGroup').style.display = 'none';
                document.getElementById('prizeQuantity').value = '';
                document.getElementById('prizeQuantity').required = false;
            }

            // 显示图片预览
            if (prize.image_url) {
                document.getElementById('imagePreview').innerHTML = 
                    `<img src="../../${prize.image_url}" alt="预览" class="preview-image">`;
            }
            
            // 重置图片输入方式为URL模式
            document.querySelector('input[name="imageInputType"][value="url"]').checked = true;
            document.getElementById('urlInputGroup').style.display = 'block';
            document.getElementById('fileInputGroup').style.display = 'none';

            document.getElementById('prizeModal').classList.add('show');
        }

        // 恢复原始概率
        function restoreOriginalProbability() {
            const restoreBtn = document.getElementById('restoreProbabilityBtn');
            const originalProbability = restoreBtn.dataset.originalProbability;
            
            if (originalProbability) {
                document.getElementById('prizeProbability').value = originalProbability;
                // 隐藏提示，因为已经恢复了
                document.getElementById('probabilityHint').textContent = `已恢复到原始概率 ${originalProbability}%，您也可以手动修改`;
            }
        }

        // 关闭奖品模态框
        function closePrizeModal() {
            document.getElementById('prizeModal').classList.remove('show');
            
            // 重置表单
            document.getElementById('prizeForm').reset();
            document.getElementById('imagePreview').innerHTML = '';
            
            // 重置图片输入方式为URL
            document.querySelector('input[name="imageInputType"][value="url"]').checked = true;
            document.getElementById('urlInputGroup').style.display = 'block';
            document.getElementById('fileInputGroup').style.display = 'none';
            
            // 重置概率恢复相关元素
            document.getElementById('restoreProbabilityBtn').style.display = 'none';
            document.getElementById('probabilityHint').style.display = 'none';
            document.getElementById('probabilityHint').textContent = '';
        }

        // 保存奖品
        async function savePrize() {
            const imageInputType = document.querySelector('input[name="imageInputType"]:checked').value;
            const imageFile = document.getElementById('prizeImageFile').files[0];
            const imageUrl = document.getElementById('prizeImageUrl').value;
            
            // 如果选择了文件上传且有文件，使用FormData
            if (imageInputType === 'file' && imageFile) {
                const formData = new FormData();
                formData.append('id', document.getElementById('prizeId').value);
                formData.append('name', document.getElementById('prizeName').value);
                formData.append('icon', document.getElementById('prizeIcon').value);
                formData.append('image_file', imageFile);
                formData.append('value', document.getElementById('prizeValue').value);
                formData.append('probability', document.getElementById('prizeProbability').value);
                formData.append('rarity', document.getElementById('prizeRarity').value);
                formData.append('active', document.getElementById('prizeActive').value);
                
                // 添加页面特定概率（如果设置了）
                const pageProbability = document.getElementById('prizePageProbability').value;
                if (pageProbability !== '' && pageProbability !== null) {
                    formData.append('page_probability', pageProbability);
                }
                
                // 如果是传说物品，添加数量字段
                if (document.getElementById('prizeRarity').value === 'legendary') {
                    const quantity = document.getElementById('prizeQuantity').value;
                    if (!quantity || quantity < 1) {
                        showError('传说物品必须设置数量，且数量必须大于0');
                        return;
                    }
                    formData.append('quantity', quantity);
                }
                
                // 验证概率 - 使用实际概率（页面特定或默认）
                const probability = parseFloat(document.getElementById('prizeProbability').value);
                const pageProbValue = pageProbability !== '' ? parseFloat(pageProbability) : null;
                const actualProbability = pageProbValue !== null ? pageProbValue : probability;
                const active = parseInt(document.getElementById('prizeActive').value);
                
                if (active) {
                    const otherActivePrizes = prizes.filter(prize => 
                        prize.active && prize.id != document.getElementById('prizeId').value
                    );
                    
                    // 计算其他奖品的实际概率总和（考虑页面特定概率）
                    const otherProbabilitySum = otherActivePrizes.reduce((sum, prize) => {
                        const actualProb = prize.page_probability !== null && prize.page_probability !== undefined 
                            ? prize.page_probability 
                            : prize.probability;
                        return sum + parseFloat(actualProb);
                    }, 0);
                    
                    const totalProbability = otherProbabilitySum + actualProbability;

                    if (totalProbability > 100) {
                        showError(`概率超过100%！当前其他奖品概率总和为${otherProbabilitySum.toFixed(2)}%，最多只能设置${(100 - otherProbabilitySum).toFixed(2)}%`);
                        return;
                    }
                }
                
                try {
                    const action = editingPrizeId ? 'update_prize' : 'add_prize';
                    const response = await fetch(`../../server/api/admin.php?action=${action}&page=${encodeURIComponent(window.currentLuckyPage)}`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        showSuccess(editingPrizeId ? '奖品更新成功！' : '奖品添加成功！');
                        closePrizeModal();
                        loadPrizes();
                    } else {
                        showError('保存失败: ' + data.error);
                    }
                } catch (error) {
                    console.error('保存奖品失败:', error);
                    showError('网络错误，请稍后重试');
                }
            } else {
                // 使用URL方式或编辑时不更换图片，保持原有的JSON格式
                const formData = {
                    id: document.getElementById('prizeId').value,
                    name: document.getElementById('prizeName').value,
                    icon: document.getElementById('prizeIcon').value,
                    image_url: imageUrl,
                    value: parseFloat(document.getElementById('prizeValue').value),
                    probability: parseFloat(document.getElementById('prizeProbability').value),
                    rarity: document.getElementById('prizeRarity').value,
                    active: parseInt(document.getElementById('prizeActive').value)
                };
                
                // 添加页面特定概率（如果设置了）
                const pageProbability = document.getElementById('prizePageProbability').value;
                if (pageProbability !== '' && pageProbability !== null) {
                    formData.page_probability = parseFloat(pageProbability);
                }
                
                // 如果是传说物品，添加数量字段
                if (formData.rarity === 'legendary') {
                    const quantity = document.getElementById('prizeQuantity').value;
                    if (!quantity || quantity < 1) {
                        showError('传说物品必须设置数量，且数量必须大于0');
                        return;
                    }
                    formData.quantity = parseInt(quantity);
                }

                // 验证概率 - 使用实际概率（页面特定或默认）
                if (formData.active) {
                    const otherActivePrizes = prizes.filter(prize => 
                        prize.active && prize.id != formData.id
                    );
                    
                    // 计算其他奖品的实际概率总和（考虑页面特定概率）
                    const otherProbabilitySum = otherActivePrizes.reduce((sum, prize) => {
                        const actualProb = prize.page_probability !== null && prize.page_probability !== undefined 
                            ? prize.page_probability 
                            : prize.probability;
                        return sum + parseFloat(actualProb);
                    }, 0);
                    
                    // 当前奖品使用的概率
                    const currentProbability = formData.page_probability !== undefined 
                        ? formData.page_probability 
                        : formData.probability;
                    
                    const totalProbability = otherProbabilitySum + currentProbability;

                    if (totalProbability > 100) {
                        showError(`概率超过100%！当前其他奖品概率总和为${otherProbabilitySum.toFixed(2)}%，最多只能设置${(100 - otherProbabilitySum).toFixed(2)}%`);
                        return;
                    }
                }

                try {
                    const action = editingPrizeId ? 'update_prize' : 'add_prize';
                    const response = await fetch(`../../server/api/admin.php?action=${action}&page=${encodeURIComponent(window.currentLuckyPage)}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        showSuccess(editingPrizeId ? '奖品更新成功！' : '奖品添加成功！');
                        closePrizeModal();
                        loadPrizes();
                    } else {
                        showError('保存失败: ' + data.error);
                    }
                } catch (error) {
                    console.error('保存奖品失败:', error);
                    showError('网络错误，请稍后重试');
                }
            }
        }

        // ======== 抽奖价格控制功能 ========

        // 加载当前价格设置
        async function loadCurrentPrices() {
            try {
                const response = await fetch(`../../server/api/admin.php?action=get_draw_prices&page=${encodeURIComponent(window.currentLuckyPage)}`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('singleDrawPrice').value = data.prices.single || 10;
                    document.getElementById('tripleDrawPrice').value = data.prices.triple || 30;
                    document.getElementById('quintupleDrawPrice').value = data.prices.quintuple || 50;
                    
                    // 加载按钮名称
                    document.getElementById('singleDrawName').value = data.names.single || '';
                    document.getElementById('tripleDrawName').value = data.names.triple || '';
                    document.getElementById('quintupleDrawName').value = data.names.quintuple || '';
                } else {
                    console.warn('加载价格失败，使用默认值:', data.error);
                }
            } catch (error) {
                console.error('加载价格失败:', error);
            }
        }

        // 更新单个抽奖价格
        async function updateDrawPrice(type) {
            let price, name, element, nameElement, typeName;
            
            switch(type) {
                case 'single':
                    element = document.getElementById('singleDrawPrice');
                    nameElement = document.getElementById('singleDrawName');
                    price = element.value;
                    name = nameElement.value;
                    typeName = '单抽';
                    break;
                case 'triple':
                    element = document.getElementById('tripleDrawPrice');
                    nameElement = document.getElementById('tripleDrawName');
                    price = element.value;
                    name = nameElement.value;
                    typeName = '三连抽';
                    break;
                case 'quintuple':
                    element = document.getElementById('quintupleDrawPrice');
                    nameElement = document.getElementById('quintupleDrawName');
                    price = element.value;
                    name = nameElement.value;
                    typeName = '五连抽';
                    break;
                default:
                    showError('未知的抽奖类型');
                    return;
            }

            if (!price || price < 1) {
                showError('价格必须大于0');
                return;
            }

            try {
                const response = await fetch('../../server/api/admin.php?action=update_draw_price', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        page: window.currentLuckyPage,
                        type: type,
                        price: parseInt(price),
                        button_name: name || null
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showSuccess(`${typeName}${name ? '（' + name + '）' : ''}价格已更新为 ${price} 金币`);
                    loadPriceHistory(); // 刷新历史记录
                } else {
                    showError('更新失败: ' + data.error);
                }
            } catch (error) {
                console.error('更新价格失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 批量更新价格
        async function batchUpdatePrices() {
            const singlePrice = document.getElementById('singleDrawPrice').value;
            const triplePrice = document.getElementById('tripleDrawPrice').value;
            const quintuplePrice = document.getElementById('quintupleDrawPrice').value;

            if (!singlePrice || !triplePrice || !quintuplePrice || 
                singlePrice < 1 || triplePrice < 1 || quintuplePrice < 1) {
                showError('所有价格必须大于0');
                return;
            }

            if (!confirm('确定要批量更新所有抽奖价格吗？')) {
                return;
            }

            try {
                const response = await fetch('../../server/api/admin.php?action=batch_update_draw_prices', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        page: window.currentLuckyPage,
                        prices: {
                            single: parseInt(singlePrice),
                            triple: parseInt(triplePrice),
                            quintuple: parseInt(quintuplePrice)
                        }
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showSuccess('所有价格已成功更新！');
                    loadPriceHistory(); // 刷新历史记录
                } else {
                    showError('批量更新失败: ' + data.error);
                }
            } catch (error) {
                console.error('批量更新价格失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 恢复默认价格
        async function resetToDefaultPrices() {
            if (!confirm('确定要恢复到默认价格吗？\n单抽: 10金币\n三连抽: 30金币\n五连抽: 50金币')) {
                return;
            }

            try {
                const response = await fetch('../../server/api/admin.php?action=reset_draw_prices', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        page: window.currentLuckyPage
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showSuccess('价格已恢复为默认值！');
                    loadCurrentPrices(); // 刷新当前价格显示
                    loadPriceHistory(); // 刷新历史记录
                } else {
                    showError('恢复默认价格失败: ' + data.error);
                }
            } catch (error) {
                console.error('恢复默认价格失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 加载价格历史
        async function loadPriceHistory() {
            try {
                const response = await fetch(`../../server/api/admin.php?action=get_price_history&page=${encodeURIComponent(window.currentLuckyPage)}`);
                const data = await response.json();
                
                const historyContainer = document.getElementById('priceHistory');
                
                if (data.success && data.history && data.history.length > 0) {
                    const historyHtml = data.history.map(item => `
                        <div class="history-item">
                            <div>
                                <strong>${getTypeDisplayName(item.type)}</strong>: 
                                ${item.old_price} → ${item.new_price} 金币
                            </div>
                            <div class="history-time">${formatTime(item.created_at)}</div>
                        </div>
                    `).join('');
                    historyContainer.innerHTML = historyHtml;
                } else {
                    historyContainer.innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">暂无价格更新历史</div>';
                }
            } catch (error) {
                console.error('加载价格历史失败:', error);
                document.getElementById('priceHistory').innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">加载历史记录失败</div>';
            }
        }

        // 获取类型显示名称
        function getTypeDisplayName(type) {
            const typeMap = {
                'single': '单抽',
                'triple': '三连抽',
                'quintuple': '五连抽',
                'batch': '批量更新',
                'reset': '恢复默认'
            };
            return typeMap[type] || type;
        }

        // 格式化时间
        function formatTime(timeString) {
            const date = new Date(timeString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>

    <script>
        let limitedDropConfig = null;
        let legendaryPrizes = [];
        let currentPage = 'luckytemp'; // 当前选择的页面

        // 从URL参数获取当前管理的页面名称
        function getCurrentPageFromUrl() {
            const pageParam = getQueryParam('page') || 'luckytemp.html';
            // 提取页面名称，去掉.html后缀
            return pageParam.replace(/\.html$/, '');
        }

        // 显示限时掉落配置模态框
        async function showLimitedDropConfig() {
            try {
                // 从URL参数获取当前页面
                currentPage = getCurrentPageFromUrl();
                console.log('当前管理页面:', currentPage);
                
                // 获取当前配置
                await loadLimitedDropConfig();
                // 获取传说级奖品
                await loadLegendaryPrizes();
                // 加载中奖用户列表
                await loadWinnersList();
                
                document.getElementById('limitedDropModal').style.display = 'block';
            } catch (error) {
                console.error('打开限时掉落配置失败:', error);
                alert('打开配置失败，请重试');
            }
        }
        
        // 加载中奖用户列表
        async function loadWinnersList() {
            try {
                const response = await fetch(`../../server/api/limited-drop.php?action=get_winners&page=${currentPage}`);
                const data = await response.json();
                
                const container = document.getElementById('winnersList');
                
                if (data.success && data.winners && data.winners.length > 0) {
                    container.innerHTML = data.winners.map((winner, index) => `
                        <div style="background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <span style="color: #ffd700; font-weight: bold;">#${index + 1}</span>
                                <span style="color: #fff; margin-left: 10px;">${winner.username}</span>
                                <span style="color: #4ade80; margin-left: 10px;">获得: ${winner.prize_name}</span>
                            </div>
                            <div style="text-align: right;">
                                <div style="color: #ffd700; font-weight: bold;">${winner.prize_value}</div>
                                <div style="color: #999; font-size: 12px;">${winner.win_time}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">暂无中奖记录</div>';
                }
            } catch (error) {
                console.error('加载中奖记录失败:', error);
                document.getElementById('winnersList').innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px;">加载失败</div>';
            }
        }

        // 加载限时掉落配置
        async function loadLimitedDropConfig() {
            try {
                const response = await fetch(`../../server/api/limited-drop.php?action=get_config&page=${currentPage}`);
                const data = await response.json();
                
                if (data.success) {
                    limitedDropConfig = data.config;
                    
                    // 更新界面
                    const enabledCheckbox = document.getElementById('limitedDropEnabled');
                    const statusText = document.getElementById('enabledStatus');
                    const windowTitleInput = document.getElementById('windowTitle');
                    const currentPageDisplay = document.getElementById('currentPageDisplay');
                    const rateBoostFromInput = document.getElementById('rateBoostFrom');
                    const rateBoostToInput = document.getElementById('rateBoostTo');
                    
                    enabledCheckbox.checked = limitedDropConfig.is_active == 1;
                    statusText.textContent = enabledCheckbox.checked ? '开启' : '关闭';
                    windowTitleInput.value = limitedDropConfig.window_title || '限时掉落，爆率提升';
                    currentPageDisplay.textContent = `${currentPage} 页面`;
                    rateBoostFromInput.value = limitedDropConfig.rate_boost_from || '0.1';
                    rateBoostToInput.value = limitedDropConfig.rate_boost_to || '2.5';
                    
                    // 监听开关变化
                    enabledCheckbox.onchange = function() {
                        statusText.textContent = this.checked ? '开启' : '关闭';
                    };
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('加载配置失败:', error);
                throw error;
            }
        }

        // 加载传说级奖品
        async function loadLegendaryPrizes() {
            try {
                const response = await fetch(`../../server/api/limited-drop.php?action=get_legendary_prizes&page=${currentPage}`);
                const data = await response.json();
                
                if (data.success) {
                    legendaryPrizes = data.prizes;
                    renderLegendaryPrizes();
                    
                    // 显示表名信息
                    const infoText = data.table_name ? `(使用表: ${data.table_name})` : '';
                    const currentPageDisplay = document.getElementById('currentPageDisplay');
                    if (currentPageDisplay) {
                        currentPageDisplay.innerHTML = `${currentPage} 页面 <small style="color: #aaa;">${infoText}</small>`;
                    }
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('加载传说级奖品失败:', error);
                document.getElementById('legendaryPrizesList').innerHTML = '<div style="color: red;">加载失败: ' + error.message + '</div>';
                throw error;
            }
        }

        // 渲染传说级奖品选择列表
        function renderLegendaryPrizes() {
            const container = document.getElementById('legendaryPrizesList');
            
            if (legendaryPrizes.length === 0) {
                container.innerHTML = '<div style="color: #aaa; text-align: center; padding: 20px;">暂无传说级奖品</div>';
                return;
            }
            
            const selectedIds = limitedDropConfig.selected_prize_ids || [];
            
            container.innerHTML = legendaryPrizes.map(prize => `
                <div class="selectable-prize ${selectedIds.includes(prize.id.toString()) ? 'selected' : ''}" 
                     onclick="togglePrizeSelection(${prize.id})">
                    <span class="prize-icon">${prize.icon || '🎁'}</span>
                    <div class="prize-name">${prize.name}</div>
                    <div class="prize-value">价值: ¥${prize.value}</div>
                    <div class="prize-quantity">剩余: ${prize.quantity || '∞'}</div>
                </div>
            `).join('');
        }

        // 切换奖品选择状态
        function togglePrizeSelection(prizeId) {
            const element = event.currentTarget;
            const selectedIds = limitedDropConfig.selected_prize_ids || [];
            const prizeIdStr = prizeId.toString();
            
            if (selectedIds.includes(prizeIdStr)) {
                // 取消选择
                limitedDropConfig.selected_prize_ids = selectedIds.filter(id => id !== prizeIdStr);
                element.classList.remove('selected');
            } else {
                // 选择
                limitedDropConfig.selected_prize_ids = [...selectedIds, prizeIdStr];
                element.classList.add('selected');
            }
        }

        // 保存限时掉落配置
        async function saveLimitedDropConfig() {
            try {
                const configData = {
                    action: 'update_config', // 添加 action 字段
                    page: currentPage, // 添加页面参数
                    is_active: document.getElementById('limitedDropEnabled').checked ? 1 : 0,
                    window_title: document.getElementById('windowTitle').value || '限时掉落，爆率提升',
                    rate_boost_from: parseFloat(document.getElementById('rateBoostFrom').value) || 0.1,
                    rate_boost_to: parseFloat(document.getElementById('rateBoostTo').value) || 2.5,
                    selected_prize_ids: limitedDropConfig.selected_prize_ids || []
                };
                
                const response = await fetch('../../server/api/limited-drop.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(configData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(`${currentPage} 页面配置保存成功！`);
                    closeLimitedDropModal();
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                console.error('保存配置失败:', error);
                alert('保存失败: ' + error.message);
            }
        }

        // 关闭限时掉落配置模态框
        function closeLimitedDropModal() {
            document.getElementById('limitedDropModal').style.display = 'none';
        }

        // 格式化时间
        function formatTime(timeString) {
            const date = new Date(timeString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    </script>
</body>
</html>
