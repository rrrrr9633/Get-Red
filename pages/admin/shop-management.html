    <script>
        // 超级管理员权限验证
        async function checkAdminAccess() {
            try {
                const response = await fetch('../../server/api/super-admin.php?action=check');
                const data = await response.json();
                
                if (!data.authenticated) {
                    alert('需要超级管理员权限！请先登录。');
                    window.location.href = '../../super-admin.html';
                    return false;
                }
                
                // 权限验证成功后，立即加载数据
                loadItems('skin');
                
                return true;
            } catch (error) {
                console.error('权限验证失败:', error);
                alert('系统错误，请重新登录！');
                window.location.href = '../../super-admin.html';
                return false;
            }
        }
        
        // 页面加载时立即验证并加载数据
        checkAdminAccess();
    </script>

    <script>
        let currentTab = 'skin';
        let editingItemId = null;

        // 切换选项卡
        function switchTab(tab) {
            currentTab = tab;
            
            // 更新按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新内容显示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tab + 'Tab').classList.add('active');
            
            // 加载对应数据
            if (tab === 'skin' || tab === 'escort') {
                loadItems(tab);
            } else if (tab === 'orders') {
                loadOrders();
            } else if (tab === 'icons') {
                loadIcons();
            }
        }

        // 加载商城物品
        async function loadItems(type) {
            const listId = type + 'ItemsList';
            const listElement = document.getElementById(listId);
            
            try {
                const response = await fetch('../../server/api/shop.php?action=admin_items');
                const data = await response.json();
                
                if (data.success) {
                    const items = data.items.filter(item => item.item_type === type);
                    
                    if (items.length === 0) {
                        listElement.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">📦</div>
                                <p>暂无${type === 'skin' ? '皮肤' : '护航'}奖品</p>
                            </div>
                        `;
                        return;
                    }
                    
                    listElement.innerHTML = items.map(item => `
                        <div class="item-card">
                            ${item.image_url ? 
                                `<img src="${item.image_url}" class="item-image" alt="${item.name}" onerror="this.src='../../images/placeholder.png'">` :
                                `<div class="item-image" style="display:flex;align-items:center;justify-content:center;font-size:60px;">${item.icon || '🎁'}</div>`
                            }
                            <div class="item-name">${item.icon || '🎁'} ${item.name}</div>
                            <div style="color:#ccc;font-size:14px;margin-bottom:10px;">${item.description || ''}</div>
                            <div class="item-details">

        // 加载订单（支持分页）
        let currentOrdersPage = 1;
        let ordersTotalPages = 1;
        const ordersPerPage = 10; // 每页显示10条订单

        async function loadOrders(page = 1) {
            const listElement = document.getElementById('ordersList');
            const status = document.getElementById('orderStatusFilter').value;
            
            currentOrdersPage = page;
            
            try {
                let url = `../../server/api/shop.php?action=admin_purchases&page=${page}&per_page=${ordersPerPage}`;
                if (status) {
                    url += `&status=${status}`;
                }
                    
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    const purchases = data.purchases || [];
                    const total = data.total || 0;
                    ordersTotalPages = data.total_pages || 1;
                    
                    // 更新分页信息
                    document.getElementById('ordersTotal').textContent = total;
                    document.getElementById('ordersCurrentPage').textContent = currentOrdersPage;
                    document.getElementById('ordersTotalPages').textContent = ordersTotalPages;
                    document.getElementById('ordersJumpPage').max = ordersTotalPages;
                    
                    // 显示/隐藏分页控件
                    const paginationContainer = document.getElementById('ordersPagination');
                    if (total > ordersPerPage) {
                        paginationContainer.style.display = 'block';
                        updateOrdersPaginationButtons();
                    } else {
                        paginationContainer.style.display = 'none';
                    }
                    
                    if (purchases.length === 0) {
                        listElement.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">📦</div>
                                <p>暂无订单</p>
                            </div>
                        `;
                        return;
                    }
                    
                    listElement.innerHTML = purchases.map(order => {
                        const statusColors = {
                            'pending': '#f59e0b',
                            'processing': '#3b82f6',
                            'completed': '#10b981',
                            'cancelled': '#ef4444'
                        };
                        const statusTexts = {
                            'pending': '待处理',
                            'processing': '处理中',
                            'completed': '已完成',
                            'cancelled': '已取消'
                        };
                        
                        return `
                            <div class="order-card" style="border-color: ${statusColors[order.status]};">
                                <div class="order-header">
                                    <div class="order-id">订单 #${order.id}</div>
                                    <div class="order-status status-${order.status}">${statusTexts[order.status]}</div>
                                </div>
                                <div class="item-details">
                                    <div class="item-detail">用户: <span>${order.username} (${order.nickname || ''})</span></div>
                                    <div class="item-detail">商品: <span>${order.item_name}</span></div>
                                    <div class="item-detail">类型: <span>${order.item_type === 'skin' ? '皮肤' : '护航'}</span></div>
                                    <div class="item-detail">价格: <span>${parseFloat(order.price).toFixed(0)} 金币</span></div>
                                    <div class="item-detail">购买方式: <span>${order.purchase_type === 'legendary' ? '传说级兑换' : '金币购买'}</span></div>
                                    ${order.player_id ? `<div class="item-detail">玩家ID: <span>${order.player_id}</span></div>` : ''}
                                    <div class="item-detail">时间: <span>${order.created_at}</span></div>
                                    ${order.processed_at ? `<div class="item-detail">处理时间: <span>${order.processed_at}</span></div>` : ''}
                                </div>
                                ${order.notes ? `<div style="color:#ccc;font-size:12px;margin-top:10px;padding:8px;background:rgba(0,0,0,0.3);border-radius:5px;">备注: ${order.notes}</div>` : ''}
                                ${order.status === 'pending' || order.status === 'processing' ? `
                                    <div class="item-actions" style="margin-top:15px;">
                                        <button class="btn btn-edit" onclick="processOrder(${order.id}, 'completed')">完成订单</button>
                                        <button class="btn btn-delete" onclick="processOrder(${order.id}, 'cancelled')">取消订单</button>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('');
                } else {
                    listElement.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">❌</div>
                            <p>加载失败: ${data.error}</p>
                        </div>

                listElement.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>网络错误，请稍后重试</p>
                    </div>
                `;
            }
        }

        // 更新分页按钮状态
        function updateOrdersPaginationButtons() {
            const firstBtn = document.getElementById('ordersFirstBtn');
            const prevBtn = document.getElementById('ordersPrevBtn');
            const nextBtn = document.getElementById('ordersNextBtn');
            const lastBtn = document.getElementById('ordersLastBtn');
            
            // 禁用/启用按钮
            firstBtn.disabled = currentOrdersPage === 1;
            prevBtn.disabled = currentOrdersPage === 1;
            nextBtn.disabled = currentOrdersPage === ordersTotalPages;
            lastBtn.disabled = currentOrdersPage === ordersTotalPages;
            
            // 生成页码按钮
            const pageNumbersContainer = document.getElementById('ordersPageNumbers');
            const pageNumbers = [];
            
            // 显示当前页附近的页码
            const range = 2; // 当前页前后各显示2页
            let start = Math.max(1, currentOrdersPage - range);
            let end = Math.min(ordersTotalPages, currentOrdersPage + range);
            
            // 确保至少显示5个页码（如果总页数>=5）
            if (end - start < 4) {
                if (start === 1) {
                    end = Math.min(5, ordersTotalPages);
                } else if (end === ordersTotalPages) {
                    start = Math.max(1, ordersTotalPages - 4);
                }
            }
            
            for (let i = start; i <= end; i++) {
                pageNumbers.push(`
                    <span class="page-number ${i === currentOrdersPage ? 'active' : ''}" 
                          onclick="loadOrders(${i})">${i}</span>
                `);
            }
            
            pageNumbersContainer.innerHTML = pageNumbers.join('');
        }

        function jumpToOrdersPage() {
            const input = document.getElementById('ordersJumpPage');
            const page = parseInt(input.value);
            
            if (page >= 1 && page <= ordersTotalPages) {
                loadOrders(page);
            } else {
                alert(`请输入 1 到 ${ordersTotalPages} 之间的页码`);
            }
        }

                'processing': '处理中',
                'completed': '已完成',

        async function editItem(id) {
            try {
                const response = await fetch('../../server/api/shop.php?action=admin_items');
                const data = await response.json();
                
                if (data.success) {
                    const item = data.items.find(i => i.id == id);
                    if (!item) {
                        alert('商品不存在');
                        return;
                    }
                    
                    editingItemId = id;
                    document.getElementById('itemModalTitle').textContent = '编辑商品';
                    document.getElementById('itemId').value = item.id;
                    document.getElementById('itemType').value = item.item_type;
                    document.getElementById('itemName').value = item.name;
                    document.getElementById('itemIcon').value = item.icon || '';
                    document.getElementById('itemImageUrl').value = item.image_url || '';
                    document.getElementById('itemDescription').value = item.description || '';
                    document.getElementById('itemPrice').value = item.price;
                    document.getElementById('itemRarity').value = item.rarity;
                    document.getElementById('itemStock').value = item.stock;
                    document.getElementById('itemSortOrder').value = item.sort_order;
                    document.getElementById('itemActive').value = item.is_active;
                    
                    // 显示图片预览
                    const preview = document.getElementById('itemImagePreview');
                    if (preview && item.image_url) {
                        preview.innerHTML = `<img src="../../${item.image_url}" alt="预览" style="max-width: 150px; max-height: 150px; border-radius: 8px; border: 2px solid #ffd700;">`;
                    }
                    
                    // 重置图片输入方式为URL模式
                    const urlRadio = document.querySelector('input[name="itemImageInputType"][value="url"]');
                    if (urlRadio) {

                        const urlGroup = document.getElementById('itemUrlInputGroup');
                        const fileGroup = document.getElementById('itemFileInputGroup');
                        if (urlGroup) urlGroup.style.display = 'block';
                        if (fileGroup) fileGroup.style.display = 'none';

                    // 切换到基本信息标签页

                    document.getElementById('itemModal').style.display = 'flex';

        // 切换商品编辑标签页
        function switchItemTab(tab) {
            document.querySelectorAll('.item-tab-btn').forEach(btn => {
                btn.style.background = 'transparent';
                btn.style.color = '#fff';
                btn.style.borderBottom = '3px solid transparent';
            });
            
            document.querySelectorAll('.item-tab-content').forEach(content => {
                content.style.display = 'none';
            });
            
            if (tab === 'basic') {
                document.getElementById('basicTabBtn').style.background = 'rgba(16,185,129,0.1)';
                document.getElementById('basicTabBtn').style.color = '#10b981';
                document.getElementById('basicTabBtn').style.borderBottom = '3px solid #10b981';
                document.getElementById('basicTabContent').style.display = 'block';
            } else if (tab === 'legendary') {
                document.getElementById('legendaryTabBtn').style.background = 'rgba(16,185,129,0.1)';
                document.getElementById('legendaryTabBtn').style.color = '#10b981';
                document.getElementById('legendaryTabBtn').style.borderBottom = '3px solid #10b981';
                document.getElementById('legendaryTabContent').style.display = 'block';
                
                // 如果还没有加载传说级物品，现在加载
                if (!document.getElementById('legendaryItemsSelection').dataset.loaded) {
                    loadLegendaryItemsForSelection();
                }
            }

        // 加载传说级物品供选择
        let allLegendaryPrizes = [];
        let selectedLegendaryItems = [];

        async function loadLegendaryItemsForSelection() {
            try {
                const response = await fetch('../../server/api/admin.php?action=prizes');
                const data = await response.json();
                
                if (data.success) {
                    allLegendaryPrizes = data.prizes.filter(p => p.rarity === 'legendary');
                    renderLegendaryItemsSelection();
                    document.getElementById('legendaryItemsSelection').dataset.loaded = 'true';
                } else {
                    document.getElementById('legendaryItemsSelection').innerHTML = '<div style="color:#ef4444;text-align:center;padding:20px;">加载失败</div>';
                }
            } catch (error) {
                console.error('加载传说级物品失败:', error);
                document.getElementById('legendaryItemsSelection').innerHTML = '<div style="color:#ef4444;text-align:center;padding:20px;">网络错误</div>';
            }
        }

        function renderLegendaryItemsSelection() {
            const container = document.getElementById('legendaryItemsSelection');
            
            if (allLegendaryPrizes.length === 0) {
                container.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">暂无传说级物品</div>';
                return;
            }

            container.innerHTML = allLegendaryPrizes.map(prize => {
                const selected = selectedLegendaryItems.find(item => item.prize_id == prize.id);
                const quantity = selected ? selected.quantity : 1;
                
                return `
                    <div style="background:${selected ? 'rgba(16,185,129,0.1)' : '#444'};border:2px solid ${selected ? '#10b981' : '#666'};border-radius:10px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:15px;">
                        <input type="checkbox" 
                               id="legendary_${prize.id}" 
                               ${selected ? 'checked' : ''} 
                               onchange="toggleLegendaryItem(${prize.id})"
                               style="width:20px;height:20px;cursor:pointer;">
                        <div style="flex:1;">
                            <div style="color:#10b981;font-weight:bold;margin-bottom:5px;">
                                ${prize.icon || '👑'} ${prize.name}
                            </div>
                            <div style="color:#ccc;font-size:12px;">价值: ${parseFloat(prize.value).toFixed(0)} | 剩余: ${prize.quantity || '∞'}</div>
                        </div>
                        <div style="display:${selected ? 'flex' : 'none'};align-items:center;gap:5px;" id="quantity_control_${prize.id}">
                            <label style="color:#fff;font-size:12px;">数量:</label>
                            <input type="number" 
                                   id="quantity_${prize.id}" 
                                   value="${quantity}" 
                                   min="1" 
                                   max="10"
                                   onchange="updateLegendaryItemQuantity(${prize.id}, this.value)"
                                   style="width:60px;padding:5px;border-radius:5px;border:1px solid #10b981;background:#333;color:#fff;text-align:center;">
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleLegendaryItem(prizeId) {
            const checkbox = document.getElementById(`legendary_${prizeId}`);
            const quantityControl = document.getElementById(`quantity_control_${prizeId}`);
            
            if (checkbox.checked) {
                const prize = allLegendaryPrizes.find(p => p.id == prizeId);
                selectedLegendaryItems.push({
                    prize_id: prizeId,
                    name: prize.name,
                    quantity: 1
                });
                quantityControl.style.display = 'flex';
            } else {
                selectedLegendaryItems = selectedLegendaryItems.filter(item => item.prize_id != prizeId);
                quantityControl.style.display = 'none';
            }
            
            renderLegendaryItemsSelection();
        }

        function updateLegendaryItemQuantity(prizeId, quantity) {
            const item = selectedLegendaryItems.find(item => item.prize_id == prizeId);
            if (item) {
                item.quantity = parseInt(quantity) || 1;
            }
        }

        // 加载传说级兑换配置
        async function loadLegendaryExchangeConfig(shopItemId) {
            try {
                const response = await fetch(`../../server/api/shop.php?action=legendary_exchange_config&shop_item_id=${shopItemId}`);
                const data = await response.json();
                
                if (data.success && data.config) {
                    const config = data.config;
                    selectedLegendaryItems = config.required_items || [];
                    document.getElementById('legendaryExchangeActive').value = config.is_active;
                    
                    // 如果传说级物品已加载，重新渲染
                    if (document.getElementById('legendaryItemsSelection').dataset.loaded) {
                        renderLegendaryItemsSelection();
                    }
                } else {
                    // 没有配置，重置为空
                    selectedLegendaryItems = [];
                    document.getElementById('legendaryExchangeActive').value = '0';
                }
            } catch (error) {
                console.error('加载传说级兑换配置失败:', error);
            }
        }

        // 保存传说级兑换配置
        async function saveLegendaryExchangeConfig() {
            const shopItemId = document.getElementById('itemId').value;
            
            if (!shopItemId) {
                alert('请先保存商品基本信息');
                return;
            }
            
            if (selectedLegendaryItems.length === 0) {
                if (!confirm('未选择任何传说级物品，这将禁用此商品的传说级兑换功能。是否继续？')) {
                    return;
                }
            }
            
            try {
                const response = await fetch('../../server/api/shop.php?action=save_legendary_exchange_config', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        shop_item_id: shopItemId,
                        required_items: selectedLegendaryItems,
                        is_active: parseInt(document.getElementById('legendaryExchangeActive').value),
                        sort_order: 0
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('传说级兑换配置保存成功！');
                } else {
                    alert('保存失败: ' + data.error);
                }
            } catch (error) {
                console.error('保存传说级兑换配置失败:', error);
                alert('网络错误');
            }
        }

                        },
                        credentials: 'include',
                        body: JSON.stringify(formData)
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        alert(editingItemId ? '商品更新成功' : '商品添加成功');
                        closeItemModal();
                        loadItems(formData.item_type);
                    } else {
                        alert('保存失败: ' + data.error);
                    }
                } catch (error) {
                    console.error('保存商品失败:', error);
                    alert('网络错误');
                }
            }
        });

        function deleteItem(id, type) {
            if (confirm('确定要删除这个商品吗？')) {
                fetch(`../../server/api/shop.php?action=delete_item&id=${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('商品已删除');
                        loadItems(type);
                    } else {
                        alert('删除失败: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('删除商品失败:', error);
                    alert('网络错误');
                });
            }
        }

        async function processOrder(id, status) {
            const action = status === 'completed' ? '完成' : '取消';
            const notes = action === '取消' ? 
                prompt('请输入取消原因（可选）:') : 
                prompt('请输入处理备注（可选）:');
            
            if (action === '取消' && notes === null) {
                return;
            }
            
            if (!confirm(`确定要${action}这个订单吗？`)) {
                return;
            }
            
            try {
                const response = await fetch(`../../server/api/shop.php?action=process_purchase`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        purchase_id: id,
                        action: status === 'completed' ? 'complete' : 'cancel',
                        notes: notes || ''
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(data.message || `订单已${action}`);
                    loadOrders();
                } else {
                    alert('处理失败: ' + data.error);
                }
            } catch (error) {
                console.error('处理订单失败:', error);
                alert('网络错误');
            }
        }

        async function changeIcon(id, name) {
            try {
                const response = await fetch('../../server/api/admin.php?action=get_shop_icons', {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    const icon = data.icons.find(i => i.id == id);
                    if (!icon) {
                        alert('图标不存在');
                        return;
                    }
                    
                    // 显示图标编辑模态框
                    showIconEditModal(icon);
                }
            } catch (error) {
                console.error('加载图标信息失败:', error);
                alert('加载失败');
            }
        }

        // 显示图标编辑模态框
        function showIconEditModal(icon) {
            console.log('打开图标编辑模态框:', icon);
            
            document.getElementById('iconEditModalTitle').textContent = '编辑图标 - ' + icon.icon_name;
            document.getElementById('iconEditId').value = icon.id;
            document.getElementById('iconEditKey').value = icon.icon_key || '';
            document.getElementById('iconEditName').value = icon.icon_name;
            document.getElementById('iconEditUrl').value = icon.icon_url || '';
            document.getElementById('iconEditFallback').value = icon.fallback_icon || '🎁';
            document.getElementById('iconEditDescription').value = icon.description || '';
            
            // 显示模态框
            document.getElementById('iconEditModal').style.display = 'flex';
            
            // 重置单选按钮和输入框显示
            document.querySelector('input[name="iconInputType"][value="url"]').checked = true;
            document.getElementById('iconUrlInput').style.display = 'block';
            document.getElementById('iconFileInput').style.display = 'none';
            document.getElementById('iconEditFile').value = '';
            
            // 初始化事件监听器
            setTimeout(() => {
                initIconEditListeners();
            }, 100);
            
            // 更新预览
            updateIconPreview();
        }

        // 关闭图标编辑模态框
        function closeIconEditModal() {
            document.getElementById('iconEditModal').style.display = 'none';
        }

        // 更新图标预览
        function updateIconPreview() {
            const url = document.getElementById('iconEditUrl').value.trim();
            const fallback = document.getElementById('iconEditFallback').value.trim();
            const previewImg = document.getElementById('iconPreviewImg');
            const previewEmoji = document.getElementById('iconPreviewEmoji');
            
            if (url) {
                // 如果是相对路径，添加../../前缀
                let imageSrc = url;
                if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('data:')) {
                    // 相对路径，需要根据当前页面位置调整
                    imageSrc = '../../' + url;
                }
                
                previewImg.src = imageSrc;
                previewImg.style.display = 'block';
                previewEmoji.style.display = 'none';
                
                // 如果图片加载失败，显示备用图标
                previewImg.onerror = function() {
                    previewImg.style.display = 'none';
                    previewEmoji.style.display = 'block';
                    previewEmoji.textContent = fallback || '🎁';
                };
            } else {
                previewImg.style.display = 'none';
                previewEmoji.style.display = 'block';
                previewEmoji.textContent = fallback || '🎁';
            }
        }

        // 保存图标配置 - 改进版本，添加调试和错误处理
        let formSubmitHandlerBound = false;
        
        function setupFormSubmitHandler() {
            if (formSubmitHandlerBound) {
                console.log('表单提交处理器已绑定，跳过');
                return;
            }
            
            const form = document.getElementById('iconEditForm');
            if (!form) {
                console.error('找不到iconEditForm表单');
                return;
            }
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                console.log('=== 表单提交开始 ===');
                
                const inputType = document.querySelector('input[name="iconInputType"]:checked')?.value;
                const fileInput = document.getElementById('iconEditFile');
                
                console.log('输入类型:', inputType);
                console.log('是否有文件:', fileInput?.files?.length > 0);
                
                // 如果选择了文件上传
                if (inputType === 'upload' && fileInput?.files && fileInput.files[0]) {
                    console.log('使用文件上传模式，文件名:', fileInput.files[0].name);
                    
                    const formData = new FormData();
                    formData.append('action', 'update_shop_icon');
                    formData.append('id', document.getElementById('iconEditId').value);
                    formData.append('icon_key', document.getElementById('iconEditKey').value);
                    formData.append('fallback_icon', document.getElementById('iconEditFallback').value);
                    formData.append('description', document.getElementById('iconEditDescription').value);
                    formData.append('icon_image', fileInput.files[0]);
                    
                    try {
                        console.log('发送文件上传请求...');
                        const response = await fetch('../../server/api/admin.php', {
                            method: 'POST',
                            credentials: 'include',
                            body: formData
                        });
                        
                        const responseText = await response.text();
                        console.log('服务器原始响应:', responseText);
                        
                        const data = JSON.parse(responseText);
                        console.log('解析后的响应:', data);
                        
                        if (data.success) {
                            alert('图标更新成功！');
                            closeIconEditModal();
                            loadIcons();
                        } else {
                            alert('保存失败: ' + (data.error || '未知错误'));
                        }
                    } catch (error) {
                        console.error('保存图标失败:', error);
                        alert('网络错误: ' + error.message);
                    }
                } else {
                    console.log('使用URL/相对路径模式');
                    
                    // 使用URL/相对路径
                    const formData = {
                        id: document.getElementById('iconEditId').value,
                        icon_key: document.getElementById('iconEditKey').value,
                        icon_url: document.getElementById('iconEditUrl').value,
                        fallback_icon: document.getElementById('iconEditFallback').value,
                        description: document.getElementById('iconEditDescription').value
                    };
                    
                    console.log('提交的数据:', formData);
                    
                    try {
                        console.log('发送URL更新请求...');
                        const response = await fetch('../../server/api/admin.php?action=update_shop_icon', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            credentials: 'include',
                            body: JSON.stringify(formData)
                        });
                        
                        const responseText = await response.text();
                        console.log('服务器原始响应:', responseText);
                        
                        const data = JSON.parse(responseText);
                        console.log('解析后的响应:', data);
                        
                        if (data.success) {
                            alert('图标更新成功！');
                            closeIconEditModal();
                            loadIcons();
                        } else {
                            alert('保存失败: ' + (data.error || '未知错误'));
                        }
                    } catch (error) {
                        console.error('保存图标失败:', error);
                        alert('网络错误: ' + error.message);
                    }
                }
            });
            
            formSubmitHandlerBound = true;
            console.log('表单提交处理器绑定成功');
        }
        
        // 页面加载时绑定
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，准备绑定表单');
            setTimeout(setupFormSubmitHandler, 500);
            
            // 初始化物品图片上传监听器
            initItemImageListeners();
        });
        
        // 初始化物品图片上传监听器
        function initItemImageListeners() {
            const radioButtons = document.querySelectorAll('input[name="itemImageInputType"]');
            const urlInput = document.getElementById('itemImageUrl');
            const fileInput = document.getElementById('itemImageFile');
            const preview = document.getElementById('itemImagePreview');
            
            // 检查元素是否存在
            if (!urlInput || !fileInput || !preview) {
                console.warn('物品图片上传元素未找到，跳过初始化');
                return;
            }
            
            // 监听单选按钮切换
            radioButtons.forEach(radio => {
                radio.addEventListener('change', function() {
                    const urlGroup = document.getElementById('itemUrlInputGroup');
                    const fileGroup = document.getElementById('itemFileInputGroup');
                    
                    if (this.value === 'url') {
                        urlGroup.style.display = 'block';
                        fileGroup.style.display = 'none';
                        fileInput.value = '';
                        urlInput.disabled = false;
                        // 不清空预览，保持当前显示的图片
                    } else {
                        urlGroup.style.display = 'none';
                        fileGroup.style.display = 'block';
                        urlInput.disabled = true;
                        // 切换到文件上传时，不清空URL和预览，让用户可以看到当前图片
                    }
                });
            });
            
            // URL输入预览
            if (urlInput) {
                urlInput.addEventListener('input', function() {
                    const url = this.value;
                    if (url) {
                        preview.innerHTML = `<img src="${url}" alt="预览" style="max-width: 150px; max-height: 150px; border-radius: 8px; border: 2px solid #ffd700;" onerror="this.style.display='none'">`;
                    } else {
                        preview.innerHTML = '';
                    }
                });
            }
            
            // 文件上传预览
            if (fileInput) {
                fileInput.addEventListener('change', function() {
                    const file = this.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            preview.innerHTML = `<img src="${e.target.result}" alt="预览" style="max-width: 150px; max-height: 150px; border-radius: 8px; border: 2px solid #ffd700;">`;
                        };
                        reader.readAsDataURL(file);
                    } else {
                        preview.innerHTML = '';
                    }
                });
            }
        }

        // 初始化输入监听
        function initIconEditListeners() {
            const urlInput = document.getElementById('iconEditUrl');
            const fallbackInput = document.getElementById('iconEditFallback');
            const fileInput = document.getElementById('iconEditFile');
            const radioButtons = document.querySelectorAll('input[name="iconInputType"]');
            
            // 添加空值检查
            if (!urlInput || !fallbackInput || !fileInput || radioButtons.length === 0) {
                console.warn('图标编辑元素未找到，跳过初始化');
                return;
            }
            
            // 监听单选按钮切换
            radioButtons.forEach(radio => {
                radio.addEventListener('change', function() {
                    const urlDiv = document.getElementById('iconUrlInput');
                    const fileDiv = document.getElementById('iconFileInput');
                    
                    if (this.value === 'url') {
                        urlDiv.style.display = 'block';
                        fileDiv.style.display = 'none';
                        fileInput.value = '';
                    } else {
                        urlDiv.style.display = 'none';
                        fileDiv.style.display = 'block';
                        urlInput.value = '';
                    }
                    updateIconPreview();
                });
            });
            
            if (urlInput) {
                urlInput.addEventListener('input', updateIconPreview);
            }
            if (fallbackInput) {
                fallbackInput.addEventListener('input', updateIconPreview);
            }
            if (fileInput) {
                fileInput.addEventListener('change', function() {
                    if (this.files && this.files[0]) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const previewImg = document.getElementById('iconPreviewImg');
                            const previewEmoji = document.getElementById('iconPreviewEmoji');
                            previewImg.src = e.target.result;
                            previewImg.style.display = 'block';
                            previewEmoji.style.display = 'none';
                        };
                        reader.readAsDataURL(this.files[0]);
                    }
                });
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            initIconEditListeners();
        });
    </script>

    <!-- 图标编辑模态框 -->
    <div id="iconEditModal" class="modal">
        <div class="modal-content">
            <h2 class="modal-header" id="iconEditModalTitle">编辑图标</h2>
            <form id="iconEditForm">
                <input type="hidden" id="iconEditId">
                <input type="hidden" id="iconEditKey">
                
                <div class="form-group">
                    <label class="form-label">图标名称:</label>
                    <input type="text" id="iconEditName" class="form-input" readonly style="background:#444;color:#aaa;">
                </div>
                
                <div class="form-group">
                    <label class="form-label">图标图片:</label>
                    <div style="margin-bottom:10px;">
                        <label style="display:inline-flex;align-items:center;margin-right:15px;">
                            <input type="radio" name="iconInputType" value="url" checked style="margin-right:5px;">
                            <span>输入URL/相对路径</span>
                        </label>
                        <label style="display:inline-flex;align-items:center;">
                            <input type="radio" name="iconInputType" value="upload" style="margin-right:5px;">
                            <span>上传图片</span>
                        </label>
                    </div>
                    
                    <div id="iconUrlInput" style="display:block;">
                        <input type="text" id="iconEditUrl" class="form-input" placeholder="https://example.com/image.png 或 images/shop/icon.png">
                        <small style="color:#888;font-size:12px;">支持完整URL或相对路径（如：images/shop/icon.png），留空则使用备用图标</small>
                    </div>
                    
                    <div id="iconFileInput" style="display:none;">
                        <input type="file" id="iconEditFile" class="form-input" accept="image/*">
                        <small style="color:#888;font-size:12px;">上传的图片将保存到 images/shop/ 目录</small>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">备用图标 (Emoji):</label>
                    <input type="text" id="iconEditFallback" class="form-input" placeholder="🎁" maxlength="5">
                </div>
                
                <div class="form-group">
                    <label class="form-label">描述:</label>
                    <textarea id="iconEditDescription" class="form-input" rows="2"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label" style="text-align:center;display:block;margin-bottom:10px;">预览:</label>
                    <div style="text-align:center;background:#333;border:2px solid #10b981;border-radius:10px;padding:20px;">
                        <img id="iconPreviewImg" src="" alt="预览" style="max-width:150px;max-height:150px;display:none;">
                        <div id="iconPreviewEmoji" style="font-size:80px;">🎁</div>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-submit">保存</button>
                    <button type="button" class="btn btn-cancel" onclick="closeIconEditModal()">取消</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
