<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛皮俱乐部</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a1a);
            color: #fff;
            min-height: 100vh;
        }

        .admin-header {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 0;
            border-bottom: 2px solid #ffd700;
            text-align: center;
        }

        .admin-header h1 {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            font-size: 32px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .nav-btn {
            padding: 12px 24px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .nav-btn.active {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 16px;
            opacity: 0.8;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .user-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #444;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .user-card:hover {
            border-color: #ffd700;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.2);
        }

        .user-card.online {
            border-left: 4px solid #4ade80;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .user-username {
            font-size: 14px;
            opacity: 0.7;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.online {
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .user-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .detail-item {
            font-size: 14px;
        }

        .detail-label {
            opacity: 0.7;
            margin-bottom: 2px;
        }

        .detail-value {
            color: #ffd700;
            font-weight: bold;
        }

        .user-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
            flex: 1;
            position: relative; /* 为小红点定位 */
        }

        /* 小红点样式 */
        .btn-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.6);
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 2px 8px rgba(239, 68, 68, 0.6);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 4px 12px rgba(239, 68, 68, 0.8);
            }
        }

        .btn-view {
            background: #3b82f6;
            color: white;
        }

        .btn-view:hover {
            background: #2563eb;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
        }

        .btn-edit:hover {
            background: #d97706;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            opacity: 0.7;
        }

        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 10px;
            margin: 20px 0;
        }

        .success {
            color: #4ade80;
            text-align: center;
            padding: 20px;
            background: rgba(74, 222, 128, 0.1);
            border-radius: 10px;
            margin: 20px 0;
        }

        /* 用户详情弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #ffd700;
            font-size: 24px;
        }

        .close {
            font-size: 30px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .close:hover {
            color: #ffd700;
        }

        .user-detail-grid {
            display: grid;
            gap: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .detail-row .label {
            opacity: 0.8;
        }

        .detail-row .value {
            color: #ffd700;
            font-weight: bold;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ffd700;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffd700;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        /* 仓库样式 */
        .warehouse-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .warehouse-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .warehouse-item:hover {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .warehouse-item-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .warehouse-item-name {
            font-size: 14px;
            color: #ffd700;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .warehouse-item-type {
            font-size: 12px;
            color: #4ade80;
            margin-bottom: 5px;
        }

        .warehouse-item-count {
            font-size: 12px;
            color: #fff;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .warehouse-item-date {
            font-size: 10px;
            opacity: 0.7;
            color: #999;
        }

        .warehouse-item-actions {
            margin-top: 10px;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1>XX俱乐部 - 用户管理</h1>
    </div>

    <div class="admin-container">
        <div class="admin-nav">
            <!-- 返回按钮（仅超级管理员可见） -->
            <a href="admin.html" class="nav-btn" id="backToAdminBtn" style="background: linear-gradient(45deg, #6366f1, #8b5cf6); display: none;">
                ← 返回管理后台
            </a>
            <a href="users.html" class="nav-btn active">用户管理</a>
            <a href="draws.html" class="nav-btn">抽奖记录</a>
            <a href="service-chat.html" class="nav-btn" style="background: linear-gradient(45deg, #4ade80, #22c55e);">💬 客服聊天</a>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">总用户数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="onlineUsers">-</div>
                <div class="stat-label">在线用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="todayNewUsers">-</div>
                <div class="stat-label">今日新增</div>
            </div>
            <div class="stat-card" style="border-color: #f59e0b;">
                <div class="stat-number" id="pendingWithdrawals" style="color: #f59e0b;">-</div>
                <div class="stat-label">待处理提现</div>
            </div>
        </div>

        <!-- 用户列表 -->
        <div id="usersContainer">
            <div class="loading">正在加载用户数据...</div>
        </div>
    </div>

    <!-- 用户详情弹窗 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>用户详情</h3>
                <span class="close" onclick="closeUserModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="userDetails" class="user-detail-grid">
                    <!-- 用户详情将通过JS生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑用户弹窗 -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑用户</h3>
                <span class="close" onclick="closeEditUserModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="editUserForm">
                    <input type="hidden" id="editUserId">
                    
                    <div class="form-group">
                        <label for="editUsername">用户名</label>
                        <input type="text" id="editUsername" readonly>
                    </div>

                    <div class="form-group">
                        <label for="editNickname">昵称</label>
                        <input type="text" id="editNickname">
                    </div>

                    <div class="form-group">
                        <label for="editEmail">邮箱</label>
                        <input type="email" id="editEmail">
                    </div>

                    <div class="form-group">
                        <label for="editBoundCoins">绑定金币</label>
                        <input type="number" id="editBoundCoins" step="0.01" min="0">
                    </div>

                    <div class="form-group">
                        <label for="editUnboundCoins">非绑定金币</label>
                        <input type="number" id="editUnboundCoins" step="0.01" min="0">
                    </div>
                    
                    <div class="form-group">
                        <label>总余额（自动计算）</label>
                        <input type="number" id="editTotalBalance" step="0.01" readonly style="background: #f5f5f5; cursor: not-allowed;">
                    </div>

                    <div class="modal-actions">
                        <button type="submit" class="btn-primary">保存修改</button>
                        <button type="button" class="btn-secondary" onclick="closeEditUserModal()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 用户仓库弹窗 -->
    <div id="warehouseModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3>用户仓库</h3>
                <span class="close" onclick="closeWarehouseModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="warehouseItems" class="warehouse-grid">
                    <!-- 仓库物品将通过JS生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let usersData = [];
        let currentUserType = null;

        // 检查用户权限
        async function checkUserPermission() {
            try {
                const response = await fetch('../../server/api/admin.php?action=check_auth');
                const data = await response.json();
                
                if (!data.success) {
                    // 未授权，跳转到登录页面
                    alert('请先登录');
                    window.location.href = '../../super-admin.html';
                    return false;
                }
                
                currentUserType = data.user_type;
                
                // 只有超级管理员和客服用户可以访问
                if (currentUserType !== 'super_admin' && currentUserType !== 'service') {
                    alert('您没有权限访问此页面');
                    window.location.href = '../../index.html';
                    return false;
                }
                
                // 根据用户类型显示/隐藏功能
                setupPermissions();
                return true;
                
            } catch (error) {
                console.error('权限检查失败:', error);
                alert('权限验证失败，请重新登录');
                window.location.href = '../../super-admin.html';
                return false;
            }
        }

        // 根据用户类型设置权限
        function setupPermissions() {
            // 根据用户类型显示/隐藏返回按钮
            const backToAdminBtn = document.getElementById('backToAdminBtn');
            if (currentUserType === 'super_admin') {
                // 超级管理员显示返回按钮
                backToAdminBtn.style.display = 'inline-block';
            } else {
                // 客服用户隐藏返回按钮
                backToAdminBtn.style.display = 'none';
            }
            
            if (currentUserType === 'service') {
                // 客服用户隐藏删除用户按钮和编辑按钮
                const style = document.createElement('style');
                style.textContent = `
                    .user-actions .btn-delete {
                        display: none !important;
                    }
                    .user-actions .btn-edit {
                        display: none !important;
                    }
                    .edit-user-actions .delete-user-btn {
                        display: none !important;
                    }
                    .warehouse-item-actions .btn-danger {
                        display: none !important;
                    }
                `;
                document.head.appendChild(style);
            }
        }

        // 验证敏感操作权限（需要超级管理员身份验证）
        async function verifySensitiveOperation(operation) {
            if (currentUserType === 'super_admin') {
                // 超级管理员需要输入身份验证码
                const identityCode = prompt(`执行${operation}需要验证身份，请输入身份验证码：`);
                if (!identityCode) {
                    return false;
                }
                
                try {
                    const formData = new FormData();
                    formData.append('action', 'verify_identity');
                    formData.append('identity_code', identityCode);
                    
                    const response = await fetch('../../server/api/super-admin.php', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    if (!result.success) {
                        alert('身份验证码错误');
                        return false;
                    }
                    return true;
                } catch (error) {
                    console.error('身份验证失败:', error);
                    alert('身份验证失败');
                    return false;
                }
            } else if (currentUserType === 'service') {
                alert('您没有权限执行此操作，请联系超级管理员');
                return false;
            }
            return false;
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', async function() {
            // 先检查权限
            const hasPermission = await checkUserPermission();
            if (!hasPermission) return;
            
            // 获取CSRF Token（如果还没有）
            if (!sessionStorage.getItem('csrf_token')) {
                try {
                    const response = await fetch('../../server/api/withdrawal.php?action=csrf_token', {
                        credentials: 'include'
                    });
                    const data = await response.json();
                    if (data.success && data.csrf_token) {
                        sessionStorage.setItem('csrf_token', data.csrf_token);
                        console.log('CSRF Token已获取');
                    }
                } catch (error) {
                    console.error('获取CSRF Token失败:', error);
                }
            }
            
            loadUsers();
            
            // 每30秒刷新一次在线状态
            setInterval(loadUsers, 30000);
        });

        // 加载用户数据
        async function loadUsers() {
            try {
                const response = await fetch('../../server/api/admin.php?action=users');
                const data = await response.json();
                
                if (data.success) {
                    usersData = data.users;
                    renderUsers(data.users);
                    updateStats(data.stats);
                } else {
                    showError('获取用户数据失败: ' + data.error);
                }
            } catch (error) {
                console.error('加载用户数据失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 渲染用户列表
        function renderUsers(users) {
            const container = document.getElementById('usersContainer');
            
            if (users.length === 0) {
                container.innerHTML = '<div class="loading">暂无用户数据</div>';
                return;
            }

            const usersHtml = users.map(user => {
                const isOnline = user.is_online == 1;
                const lastLogin = user.last_login ? new Date(user.last_login).toLocaleString() : '从未登录';
                const registerTime = new Date(user.created_at).toLocaleString();
                const pendingWithdrawals = (user.pending_withdrawals || 0) + (user.pending_orders || 0); // 待处理提现数量 + 待处理订单数量
                
                // 用户身份映射
                const userTypeMap = {
                    'user': '普通用户',
                    'service': '客服用户',
                    'super_admin': '超级管理员'
                };
                const userTypeName = userTypeMap[user.user_type] || '未知身份';
                
                // 用户身份颜色
                const userTypeColor = {
                    'user': '#00ffff',
                    'service': '#00ff00',
                    'super_admin': '#ff6b6b'
                };
                const typeColor = userTypeColor[user.user_type] || '#ccc';
                
                // 提现按钮的小红点标记
                const withdrawalBadge = pendingWithdrawals > 0 ? `<span class="btn-badge">${pendingWithdrawals}</span>` : '';
                const unreadMessages = user.unread_messages || 0;
                const messageBadge = unreadMessages > 0 ? `<span class="btn-badge">${unreadMessages}</span>` : '';
                
                return `
                    <div class="user-card ${isOnline ? 'online' : ''}">
                        <div class="user-header">
                            <div class="user-info">
                                <div class="user-name">${user.nickname || user.username}</div>
                                <div class="user-username">@${user.username}</div>
                            </div>
                            <div class="user-status">
                                <span class="status-dot ${isOnline ? 'online' : ''}"></span>
                                <span>${isOnline ? '在线' : '离线'}</span>
                            </div>
                        </div>
                        
                        <div class="user-details">
                            <div class="detail-item">
                                <div class="detail-label">用户身份</div>
                                <div class="detail-value" style="color: ${typeColor}; font-weight: bold;">${userTypeName}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">总余额</div>
                                <div class="detail-value">¥${user.balance}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">绑定金币</div>
                                <div class="detail-value" style="color: #fbbf24;">${user.bound_coins || 0}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">非绑定金币</div>

                            </div>
                            <div class="detail-item">
                                <div class="detail-label">用户ID</div>
                                <div class="detail-value">#${user.id}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">注册时间</div>
                                <div class="detail-value">${registerTime}</div>

        // 更新统计数据
        function updateStats(stats) {
            document.getElementById('totalUsers').textContent = stats.total;
            document.getElementById('onlineUsers').textContent = stats.online;
            document.getElementById('todayNewUsers').textContent = stats.today_new;
            document.getElementById('pendingWithdrawals').textContent = stats.pending_withdrawals || 0;
        }

        // 查看用户详情
        function viewUser(userId) {
            const user = usersData.find(u => u.id == userId);
            if (!user) return;

            const isOnline = user.is_online == 1;
            const lastLogin = user.last_login ? new Date(user.last_login).toLocaleString() : '从未登录';
            const registerTime = new Date(user.created_at).toLocaleString();

            const detailsHtml = `
                <div class="detail-row">
                    <span class="label">用户ID:</span>
                    <span class="value">#${user.id}</span>
                </div>
                <div class="detail-row">
                    <span class="label">用户名:</span>
                    <span class="value">${user.username}</span>
                </div>
                <div class="detail-row">
                    <span class="label">昵称:</span>
                    <span class="value">${user.nickname || '未设置'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">邮箱:</span>
                    <span class="value">${user.email || '未设置'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">总余额:</span>
                    <span class="value">¥${user.balance}</span>
                </div>
                <div class="detail-row">
                    <span class="label">绑定金币:</span>
                    <span class="value" style="color: #fbbf24;">${user.bound_coins || 0}</span>
                </div>
                <div class="detail-row">
                    <span class="label">非绑定金币:</span>
                    <span class="value" style="color: #4ade80;">${user.unbound_coins || 0}</span>
                </div>
                <div class="detail-row">
                    <span class="label">状态:</span>
                    <span class="value ${isOnline ? 'online' : ''}">${isOnline ? '在线' : '离线'}</span>
                </div>
                <div class="detail-row">
                    <span class="label">注册时间:</span>
                    <span class="value">${registerTime}</span>
                </div>
                <div class="detail-row">
                    <span class="label">最后登录:</span>
                    <span class="value">${lastLogin}</span>
                </div>
            `;

            document.getElementById('userDetails').innerHTML = detailsHtml;
            document.getElementById('userModal').classList.add('show');
        }

        // 编辑用户
        function editUser(userId) {
            // 检查权限
            if (currentUserType === 'service') {
                alert('您没有权限编辑用户信息，请联系超级管理员');
                return;
            }
            
            const user = usersData.find(u => u.id == userId);
            if (!user) return;

            // 填充表单数据
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editUsername').value = user.username;
            document.getElementById('editNickname').value = user.nickname || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editBoundCoins').value = user.bound_coins || 0;
            document.getElementById('editUnboundCoins').value = user.unbound_coins || 0;
            document.getElementById('editTotalBalance').value = user.balance || 0;
            
            // 添加自动计算总余额的事件监听
            const boundInput = document.getElementById('editBoundCoins');
            const unboundInput = document.getElementById('editUnboundCoins');
            const totalInput = document.getElementById('editTotalBalance');
            
            const updateTotal = () => {
                const bound = parseFloat(boundInput.value) || 0;
                const unbound = parseFloat(unboundInput.value) || 0;
                totalInput.value = (bound + unbound).toFixed(2);
            };
            
            boundInput.addEventListener('input', updateTotal);
            unboundInput.addEventListener('input', updateTotal);

            // 显示编辑弹窗
            document.getElementById('editUserModal').classList.add('show');
        }

        // 查看用户仓库
        async function viewWarehouse(userId) {
            const user = usersData.find(u => u.id == userId);
            if (!user) return;

            try {
                const response = await fetch(`../../server/api/admin.php?action=user_items&userId=${userId}`);
                const data = await response.json();
                
                if (data.success) {
                    renderWarehouse(data.items, user.username);
                    document.getElementById('warehouseModal').classList.add('show');
                } else {
                    showError('获取仓库数据失败: ' + data.error);
                }
            } catch (error) {
                console.error('获取仓库数据失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 渲染仓库内容
        function renderWarehouse(items, username) {
            const container = document.getElementById('warehouseItems');
            document.querySelector('#warehouseModal .modal-header h3').textContent = `${username} 的仓库`;
            
            if (items.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; opacity: 0.7;">仓库为空</div>';
                return;
            }

            const itemsHtml = items.map(item => {
                // 确保必要的字段存在
                const userId = item.user_id || item.userId;
                const itemId = item.id;
                const itemName = item.item_name || item.name || '未知物品';
                
                console.log('渲染物品:', { userId, itemId, itemName, item });
                
                return `
                    <div class="warehouse-item">
                        <div class="warehouse-item-icon">${item.icon || '🎁'}</div>
                        <div class="warehouse-item-name">${itemName}</div>
                        <div class="warehouse-item-type">${item.item_type || item.rarity || '普通'}</div>
                        <div class="warehouse-item-count">x${item.quantity || 1}</div>
                        <div class="warehouse-item-date">${new Date(item.created_at || item.obtained_at).toLocaleDateString()}</div>
                        <div class="warehouse-item-actions">
                            <button class="btn-danger" onclick="deleteUserItem('${userId}', '${itemId}', '${itemName.replace(/'/g, '\\\'')}')">删除</button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = itemsHtml;
        }

        // 关闭编辑用户弹窗
        function closeEditUserModal() {
            document.getElementById('editUserModal').classList.remove('show');
        }

        // 关闭仓库弹窗
        function closeWarehouseModal() {
            document.getElementById('warehouseModal').classList.remove('show');
        }

        // 删除用户物品
        async function deleteUserItem(userId, itemId, itemName) {
            // 验证敏感操作权限
            const canProceed = await verifySensitiveOperation('删除仓库物品');
            if (!canProceed) return;
            
            console.log('删除物品参数:', { userId, itemId, itemName });
            
            // 参数验证
            if (!userId || !itemId) {
                showError('删除失败: 缺少必要参数');
                return;
            }
            
            if (!confirm(`确定要删除物品 "${itemName}" 吗？此操作不可恢复！`)) {
                return;
            }

            try {
                const requestData = {
                    user_id: parseInt(userId),
                    item_id: parseInt(itemId)
                };
                
                console.log('发送删除请求:', requestData);
                
                const response = await fetch('../../server/api/admin.php?action=delete_user_item', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();
                console.log('删除响应:', data);
                
                if (data.success) {
                    showSuccess('物品删除成功！');
                    // 重新加载该用户的仓库
                    const user = usersData.find(u => u.id == userId);
                    if (user) {
                        viewWarehouse(userId);
                    }
                } else {
                    showError('删除失败: ' + data.error);
                }
            } catch (error) {
                console.error('删除用户物品失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 处理编辑用户表单提交
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
            
            // 每30秒刷新一次在线状态
            setInterval(loadUsers, 30000);

            // 编辑用户表单提交
            document.getElementById('editUserForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const formData = new FormData();
                formData.append('id', document.getElementById('editUserId').value);
                formData.append('username', document.getElementById('editNickname').value);
                formData.append('email', document.getElementById('editEmail').value);
                formData.append('bound_coins', document.getElementById('editBoundCoins').value);
                formData.append('unbound_coins', document.getElementById('editUnboundCoins').value);

                try {
                    const response = await fetch('../../server/api/admin.php?action=update_user', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        showSuccess('用户信息更新成功！');
                        closeEditUserModal();
                        loadUsers(); // 重新加载用户列表
                    } else {
                        showError('更新失败: ' + data.error);
                    }
                } catch (error) {
                    console.error('更新用户信息失败:', error);
                    showError('网络错误，请稍后重试');
                }
            });
        });

        // 删除用户
        async function deleteUser(userId) {
            // 验证敏感操作权限
            const canProceed = await verifySensitiveOperation('删除用户');
            if (!canProceed) return;
            
            const user = usersData.find(u => u.id == userId);
            if (!user) return;

            if (!confirm(`确定要删除用户 "${user.username}" 吗？此操作不可恢复！`)) {
                return;
            }

            try {
                const response = await fetch(`../../server/api/admin.php?action=delete_user&id=${userId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                
                if (data.success) {
                    showSuccess('用户删除成功！');
                    loadUsers(); // 重新加载用户列表
                } else {
                    showError('删除失败: ' + data.error);
                }
            } catch (error) {
                console.error('删除用户失败:', error);
                showError('网络错误，请稍后重试');
            }
        }

        // 关闭用户详情弹窗
        function closeUserModal() {
            document.getElementById('userModal').classList.remove('show');
        }

        // 显示错误消息
        function showError(message) {
            const container = document.getElementById('usersContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        // 显示成功消息
        function showSuccess(message) {
            // 创建临时的成功消息
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.textContent = message;
            
            const container = document.querySelector('.admin-container');
            container.insertBefore(successDiv, container.firstChild);
            
            // 3秒后自动移除
            setTimeout(() => {
                successDiv.remove();
            }, 3000);
        }
    </script>

    <script>
        let currentWithdrawalUserId = null;

        // 打开提现信息弹窗
        async function openWithdrawalModal(userId) {
            currentWithdrawalUserId = userId;
            document.getElementById('withdrawalModal').classList.add('show');
            await loadUserWithdrawals(userId);
            await loadUserOrders(userId);
        }

        // 关闭提现信息弹窗
        function closeWithdrawalModal() {
            document.getElementById('withdrawalModal').classList.remove('show');
            currentWithdrawalUserId = null;
        }

        // 切换提现类型标签
        function switchWithdrawalTab(type) {
            document.querySelectorAll('.withdrawal-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.withdrawal-tab-content').forEach(content => content.style.display = 'none');
            
            event.target.classList.add('active');
            document.getElementById('withdrawal' + type.charAt(0).toUpperCase() + type.slice(1) + 'Tab').style.display = 'block';
        }

        // 加载用户提现信息
        async function loadUserWithdrawals(userId) {
            try {
                console.log('正在加载用户提现信息，用户ID:', userId);
                
                const response = await fetch(`../../server/api/withdrawal.php?action=admin_user_withdrawals&user_id=${userId}`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                console.log('提现信息API响应:', data);
                
                if (data.success) {
                    console.log('待处理申请数量:', data.pending.length);
                    console.log('历史记录数量:', data.history.length);
                    
                    // 显示用户信息（如果有）
                    if (data.user) {
                        console.log('用户信息:', data.user);
                        const modalHeader = document.querySelector('#withdrawalModal .modal-header h3');
                        if (modalHeader) {
                            modalHeader.textContent = `💰 ${data.user.username} 的提现信息 ${data.user.is_online ? '(在线)' : '(离线)'}`;
                        }
                    }
                    
                    renderWithdrawalPending(data.pending);
                    renderWithdrawalHistory(data.history);
                } else {
                    console.error('获取提现信息失败:', data.error);
                    alert('获取提现信息失败: ' + data.error);
                    
                    // 即使失败也显示空列表
                    renderWithdrawalPending([]);
                    renderWithdrawalHistory([]);
                }
            } catch (error) {
                console.error('加载提现信息失败:', error);
                alert('网络错误，无法加载提现信息');
                
                // 显示空列表
                renderWithdrawalPending([]);
                renderWithdrawalHistory([]);
            }
        }

        // 渲染待处理申请
        function renderWithdrawalPending(pending) {
            const container = document.getElementById('withdrawalPendingList');
            
            console.log('渲染待处理申请，数量:', pending.length);
            
            if (!pending || pending.length === 0) {
                container.innerHTML = '<div class="empty-withdrawal">暂无待处理的提现申请</div>';
                return;
            }
            
            container.innerHTML = pending.map(item => `
                <div class="withdrawal-item">
                    <div class="withdrawal-item-header">
                        <div class="withdrawal-amount">${item.amount} 金币 → ${parseFloat(item.buff_coins).toFixed(0)} 哈夫币</div>
                        <div class="withdrawal-type-badge">跑刀提现</div>
                    </div>
                    <div class="withdrawal-item-details">
                        <div>申请时间: ${new Date(item.created_at).toLocaleString()}</div>
                        <div>状态: ${item.status === 'pending' ? '待处理' : '处理中'}</div>
                    </div>
                    <div class="withdrawal-actions">
                        <button class="btn-approve" onclick="processWithdrawal(${item.id}, 'approve')">
                            ✓ 批准
                        </button>
                        <button class="btn-reject" onclick="processWithdrawal(${item.id}, 'reject')">
                            ✗ 拒绝
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 渲染历史记录
        function renderWithdrawalHistory(history) {
            const container = document.getElementById('withdrawalHistoryList');
            
            console.log('渲染历史记录，数量:', history.length);
            
            if (!history || history.length === 0) {
                container.innerHTML = '<div class="empty-withdrawal">暂无历史记录</div>';
                return;
            }
            
            container.innerHTML = history.map(item => `
                <div class="withdrawal-item">
                    <div class="withdrawal-item-header">
                        <div class="withdrawal-amount">${item.amount} 金币 → ${parseFloat(item.buff_coins).toFixed(0)} 哈夫币</div>
                        <div class="withdrawal-type-badge" style="background: ${item.status === 'completed' ? 'rgba(74, 222, 128, 0.2)' : 'rgba(239, 68, 68, 0.2)'}; color: ${item.status === 'completed' ? '#4ade80' : '#ef4444'}">
                            ${item.status === 'completed' ? '已完成' : '已拒绝'}
                        </div>
                    </div>
                    <div class="withdrawal-item-details">
                        <div>申请时间: ${new Date(item.created_at).toLocaleString()}</div>
                        <div>处理时间: ${new Date(item.processed_at).toLocaleString()}</div>
                        ${item.reject_reason ? `<div style="color: #ef4444;">拒绝原因: ${item.reject_reason}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 处理提现申请
        async function processWithdrawal(requestId, action) {
            let rejectReason = null;
            
            if (action === 'reject') {
                rejectReason = prompt('请输入拒绝原因:');
                if (!rejectReason) {
                    return;
                }
            }
            
            if (!confirm(`确认${action === 'approve' ? '批准' : '拒绝'}此提现申请吗？`)) {
                return;
            }
            
            try {
                const csrfToken = sessionStorage.getItem('csrf_token');
                const response = await fetch('../../server/api/withdrawal.php?action=process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        request_id: requestId,
                        action: action,
                        reject_reason: rejectReason
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(data.message);
                    await loadUserWithdrawals(currentWithdrawalUserId);
                    // 刷新用户列表以更新小红点
                    await loadUsers();
                } else {
                    alert('操作失败: ' + data.error);
                }
            } catch (error) {
                console.error('处理失败:', error);
                alert('操作失败，请稍后重试');
            }
        }

        // 加载用户购买订单
        async function loadUserOrders(userId) {
            try {
                const response = await fetch(`../../server/api/shop.php?action=user_orders&user_id=${userId}`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    renderUserOrders(data.orders);
                } else {
                    console.error('获取购买订单失败:', data.error);
                    renderUserOrders([]);
                }
            } catch (error) {
                console.error('加载购买订单失败:', error);
                renderUserOrders([]);
            }
        }

        // 渲染购买订单
        function renderUserOrders(orders) {
            const container = document.getElementById('withdrawalOrdersList');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="empty-withdrawal">暂无购买订单</div>';
                return;
            }
            
            const statusColors = {
                'pending': '#f59e0b',
                'processing': '#3b82f6',
                'completed': '#10b981',
                'cancelled': '#ef4444'
            };
            const statusTexts = {
                'pending': '待处理',
                'processing': '处理中',
                'completed': '已完成',
                'cancelled': '已取消'
            };
            
            container.innerHTML = orders.map(order => `
                <div class="withdrawal-item">
                    <div class="withdrawal-item-header">
                        <div class="withdrawal-amount">${order.item_name}</div>
                        <div class="withdrawal-type-badge" style="background: rgba(${statusColors[order.status]}, 0.2); color: ${statusColors[order.status]};">
                            ${statusTexts[order.status]}
                        </div>
                    </div>
                    <div class="withdrawal-item-details">
                        <div><strong>订单号:</strong> #${order.id}</div>
                        <div><strong>商品类型:</strong> ${order.item_type === 'skin' ? '皮肤' : '护航'}</div>
                        <div><strong>价格:</strong> ${parseFloat(order.price).toFixed(0)} 金币</div>
                        <div><strong>玩家ID:</strong> ${order.player_id}</div>
                        <div><strong>购买时间:</strong> ${order.created_at}</div>
                        ${order.processed_at ? `<div><strong>处理时间:</strong> ${order.processed_at}</div>` : ''}
                        ${order.notes ? `<div><strong>备注:</strong> ${order.notes}</div>` : ''}
                    </div>
                    ${order.status === 'pending' || order.status === 'processing' ? `
                        <div class="withdrawal-actions">
                            <button class="btn-approve" onclick="processShopOrder(${order.id}, 'complete')">完成订单</button>
                            <button class="btn-reject" onclick="processShopOrder(${order.id}, 'cancel')">取消订单</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // 处理购买订单
        async function processShopOrder(orderId, action) {
            const notes = action === 'cancel' ? 
                prompt('请输入取消原因（可选）:') : 
                prompt('请输入处理备注（可选）:');
            
            if (action === 'cancel' && notes === null) {
                return;
            }
            
            try {
                const response = await fetch(`../../server/api/shop.php?action=process_purchase`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        purchase_id: orderId,
                        action: action,
                        notes: notes || ''
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(data.message);
                    await loadUserOrders(currentWithdrawalUserId);
                    await loadUsers(); // 刷新用户列表
                } else {
                    alert('处理失败: ' + data.error);
                }
            } catch (error) {
                console.error('处理订单失败:', error);
                alert('网络错误');
            }
        }
    </script>
    
    <!-- 引入聊天弹窗模块 -->
    <script>
        // 动态加载聊天弹窗
        fetch('chat-modal.html')
            .then(response => response.text())
            .then(html => {
                const div = document.createElement('div');
                div.innerHTML = html;
                
                // 提取并执行 script 标签
                const scripts = div.querySelectorAll('script');
                const styles = div.querySelectorAll('style');
                
                // 添加样式
                styles.forEach(style => {
                    document.head.appendChild(style.cloneNode(true));
                });
                
                // 添加 HTML 内容（不包括 script 和 style）
                const htmlContent = div.querySelector('.chat-modal') || div.querySelector('#chatModal');
                if (htmlContent) {
                    document.body.appendChild(htmlContent);
                }
                
                // 执行脚本
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    newScript.textContent = script.textContent;
                    document.body.appendChild(newScript);
                });
            })
            .catch(error => {
                console.error('加载聊天弹窗失败:', error);
            });
    </script>
</body>
</html>
