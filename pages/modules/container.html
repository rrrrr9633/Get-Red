    <div class="particles"></div>
    
    <!-- 导航栏 -->

            </div>
            
            <div class="user-info" id="userInfo">

                <span id="userBalance" class="neon-text gold" style="display: flex; flex-direction: column; align-items: flex-end; font-size: 0.85em; line-height: 1.3;">

                </span>
                <a href="../user/recharge.html" class="recharge-btn" title="充值">💰</a>
                <div class="user-dropdown">
                    <a href="../user/profile.html" class="neon-text">个人中心</a>
                    <a href="../main.html" class="neon-text">返回主页</a>
                    <a href="#" onclick="logout()" class="neon-text">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h2 class="neon-text rainbow">我的仓库</h2>
            <p class="neon-text">管理您获得的所有物品，可以分解获得<span style="color: #4ade80;">绑定金币</span>（不能用于抽奖）</p>
        </div>

        <!-- 操作工具栏 -->
        <div class="toolbar">
            <div class="filter-section">
                <label class="neon-text">筛选稀有度:</label>
                <select id="rarityFilter" onchange="filterItems()">
                    <option value="all">全部</option>
                    <option value="common">普通</option>
                    <option value="rare">稀有</option>
                    <option value="epic">史诗</option>
                    <option value="legendary">传说</option>
                </select>
            </div>
            
            <div class="batch-section">
                <button id="selectAllBtn" class="btn-secondary" onclick="selectAll()">全选</button>
                <button id="selectNoneBtn" class="btn-secondary" onclick="selectNone()">取消全选</button>
                <button id="batchDecomposeBtn" class="btn-danger" onclick="batchDecompose()" disabled>批量分解</button>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-value" id="totalItems">0</div>
                <div class="stat-label neon-text">总物品数量</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalValue">0.00</div>
                <div class="stat-label neon-text">总价值（绑定金币）</div>
            </div>
            <div class="stat-card">

    <script>
        let currentUser = null;
        let userItems = [];
        let selectedItems = [];
        let pendingDecompose = [];

        // 初始化页面
        async function initPage() {
            // 临时跳过登录检查进行调试
            console.log('initPage开始执行');
            
            // 创建临时用户数据用于测试
            currentUser = {
                id: 2,
                username: '111111',
                nickname: '111111',
                balance: 31055.00
            };
            
            // 保存到localStorage供API调用使用
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            
            console.log('设置临时用户并保存到localStorage:', currentUser);
            
            // 为了调试，先不检查登录状态
            /*
            if (!api.isLoggedIn()) {
                alert('请先登录！');
                window.location.href = '../auth/login.html';
                return;
            }
            
            currentUser = api.getCurrentUser();
            
            if (!currentUser) {
                alert('用户信息异常，请重新登录！');
                window.location.href = '../auth/login.html';
                return;
            }
            */
            
            await loadUserInfo();
            await loadUserItems();
            createParticles();
        }

        // 加载用户信息
        async function loadUserInfo() {
            try {
                const result = await api.getUserProfile();
                if (result.success) {
                    const user = result.user;
                    
                    // 处理头像路径
                    let avatarSrc = user.avatar || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiByeD0iNTAiIGZpbGw9IiNmZmQ3MDAiLz4KPHN2ZyB4PSIyNSIgeT0iMjAiIHdpZHRoPSI1MCIgaGVpZ2h0PSI2MCI+CjxjaXJjbGUgY3g9IjI1IiBjeT0iMjAiIHI9IjE1IiBmaWxsPSIjMTExIi8+CjxlbGxpcHNlIGN4PSIyNSIgY3k9IjUwIiByeD0iMjAiIHJ5PSIxNSIgZmlsbD0iIzExMSIvPgo8L3N2Zz4KPC9zdmc+';
                    if (avatarSrc && !avatarSrc.startsWith('data:') && !avatarSrc.startsWith('http')) {
                        avatarSrc = '../../' + avatarSrc;
                    }
                    
                    document.getElementById('userAvatar').src = avatarSrc;
                    document.getElementById('userNickname').textContent = user.nickname;
                    
                    const boundCoins = parseFloat(user.bound_coins || 0).toFixed(2);
                    const unboundCoins = parseFloat(user.unbound_coins || 0).toFixed(2);
                    const totalBalance = parseFloat(user.balance || 0).toFixed(2);
                    
                    document.getElementById('userBalance').innerHTML = `
                        <span class="total-balance" style="font-size: 1.1em;">总额: ${totalBalance}</span>
                        <span class="coin-details" style="font-size: 0.9em; opacity: 0.8;">绑定: ${boundCoins} | 非绑定: ${unboundCoins}</span>
                    `;
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
        }

        // 加载用户物品
        async function loadUserItems() {
            try {
                console.log('开始加载用户物品...');
                console.log('当前用户:', currentUser);
                
                // 调用后端API获取用户物品
                const result = await api.getUserItems();
                console.log('API返回结果:', result);
                
                if (result.success) {
                    userItems = result.items || [];
                    console.log('获取到用户物品:', userItems);
                } else {
                    console.error('获取用户物品失败:', result.message);
                    userItems = [];
                }
                
                renderItems();
                updateStats();
            } catch (error) {
                console.error('加载用户物品失败:', error);
                userItems = [];
                renderItems();
                updateStats();
            }
        }

        // 分页相关变量
        let currentPage = 1;
        const itemsPerPage = 20;
        
        // 渲染物品列表
        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const emptyState = document.getElementById('emptyState');
            
            console.log('渲染物品，userItems:', userItems);
            
            // 过滤物品
            const rarityFilter = document.getElementById('rarityFilter').value;
            const filteredItems = userItems.filter(item => {
                // 数据库返回的decomposed是数字0/1，需要转换为布尔值
                const isDecomposed = item.decomposed == 1 || item.decomposed === true;
                if (isDecomposed) return false; // 已分解的物品不显示
                if (rarityFilter === 'all') return true;
                return item.rarity === rarityFilter;
            });
            
            console.log('过滤后的物品:', filteredItems);
            
            if (filteredItems.length === 0) {
                console.log('没有物品，显示空状态');
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                document.getElementById('paginationControls').style.display = 'none';
                return;
            }
            
            console.log('有物品，开始渲染');
            grid.style.display = 'grid';
            emptyState.style.display = 'none';
            
            // 计算分页
            const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredItems.slice(startIndex, endIndex);
            
            grid.innerHTML = pageItems.map(item => {
                // 修复图片路径 - 确保路径正确
                let imageUrl = item.image_url || '';
                if (imageUrl && !imageUrl.startsWith('http') && !imageUrl.startsWith('data:')) {
                    // 如果是相对路径，添加正确的前缀
                    if (!imageUrl.startsWith('../../')) {
                        imageUrl = '../../' + imageUrl.replace(/^\.\.\//, '');
                    }
                }
                
                return `
                <div class="item-card ${item.rarity} ${selectedItems.includes(String(item.id)) ? 'selected' : ''}" 
                     onclick="toggleItemSelection('${item.id}')">
                    <input type="checkbox" class="item-checkbox" 
                           ${selectedItems.includes(String(item.id)) ? 'checked' : ''}
                           onchange="toggleItemSelection('${item.id}')" onclick="event.stopPropagation()">
                    
                    <div class="item-display">
                        ${imageUrl && imageUrl !== '' ? 
                            `<img src="${imageUrl}" alt="${item.name}" class="item-image" 
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                             <div class="item-icon" style="display:none;">${item.icon}</div>` :
                            `<div class="item-icon">${item.icon}</div>`
                        }
                    </div>
                    
                    <div class="item-name">${item.name}</div>
                    <div class="item-value">价值: ${parseFloat(item.value).toFixed(2)}</div>
                    <div class="item-rarity ${item.rarity}">${getRarityText(item.rarity)}</div>
                    
                    <div class="item-actions">
                        <button class="btn-small btn-decompose" onclick="decomposeItem('${item.id}'); event.stopPropagation();">
                            分解
                        </button>
                    </div>
                </div>
            `}).join('');
            
            // 渲染分页控件
            renderPagination(totalPages, filteredItems.length);
            
            console.log('渲染完成，HTML长度:', grid.innerHTML.length);
        }
        
        // 渲染分页控件
        function renderPagination(totalPages, totalItems) {
            const paginationControls = document.getElementById('paginationControls');
            
            if (totalPages <= 1) {
                paginationControls.style.display = 'none';
                return;
            }
            
            paginationControls.style.display = 'flex';
            
            let paginationHTML = `
                <button class="pagination-btn" onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>
                    首页
                </button>
                <button class="pagination-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    上一页
                </button>
                <span class="pagination-info neon-text">
                    第 ${currentPage} / ${totalPages} 页 (共 ${totalItems} 件物品)
                </span>
                <button class="pagination-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    下一页
                </button>
                <button class="pagination-btn" onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>
                    末页
                </button>
            `;
            
            paginationControls.innerHTML = paginationHTML;
        }
        
        // 跳转到指定页
        function goToPage(page) {
            const rarityFilter = document.getElementById('rarityFilter').value;
            const filteredItems = userItems.filter(item => {
                const isDecomposed = item.decomposed == 1 || item.decomposed === true;
                if (isDecomposed) return false;
                if (rarityFilter === 'all') return true;
                return item.rarity === rarityFilter;
            });
            
            const totalPages = Math.ceil(filteredItems.length / itemsPerPage);
            
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            renderItems();
            updateStats();
            
            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 获取稀有度文本
        function getRarityText(rarity) {
            const rarityMap = {
                'common': '普通',
                'rare': '稀有',
                'epic': '史诗',
                'legendary': '传说'
            };
            return rarityMap[rarity] || '普通';
        }

        // 切换物品选择状态
        function toggleItemSelection(itemId) {
            // 确保ID类型一致，都转换为字符串
            itemId = String(itemId);
            
            const index = selectedItems.indexOf(itemId);
            if (index > -1) {
                selectedItems.splice(index, 1);
            } else {
                selectedItems.push(itemId);
            }
            
            updateBatchButtons();
            updateStats();
            renderItems();
        }

        // 全选
        function selectAll() {
            const rarityFilter = document.getElementById('rarityFilter').value;
            selectedItems = userItems.filter(item => {
                const isDecomposed = item.decomposed == 1 || item.decomposed === true;
                if (isDecomposed) return false;
                if (rarityFilter === 'all') return true;
                return item.rarity === rarityFilter;
            }).map(item => String(item.id));
            
            updateBatchButtons();
            updateStats();
            renderItems();
        }

        // 取消全选
        function selectNone() {
            selectedItems = [];
            updateBatchButtons();
            updateStats();
            renderItems();
        }

        // 更新批量操作按钮状态
        function updateBatchButtons() {
            const batchBtn = document.getElementById('batchDecomposeBtn');
            batchBtn.disabled = selectedItems.length === 0;
        }

        // 更新统计信息
        function updateStats() {
            // 数据库返回的decomposed是数字0/1，需要转换为布尔值
            const activeItems = userItems.filter(item => !(item.decomposed == 1 || item.decomposed === true));
            const selectedItemsData = userItems.filter(item => selectedItems.includes(String(item.id)));
            
            const totalItems = activeItems.length;
            const totalValue = activeItems.reduce((sum, item) => sum + parseFloat(item.value), 0);
            const selectedValue = selectedItemsData.reduce((sum, item) => sum + parseFloat(item.value), 0);
            
            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('totalValue').textContent = totalValue.toFixed(2);
            document.getElementById('selectedValue').textContent = selectedValue.toFixed(2);
        }

        // 过滤物品
        function filterItems() {
            selectedItems = []; // 清空选择
            currentPage = 1; // 重置到第一页
            updateBatchButtons();
            renderItems();
            updateStats();
        }

        // 分解单个物品
        function decomposeItem(itemId) {
            console.log('分解单个物品，ID:', itemId);
            const item = userItems.find(i => i.id == itemId);
            console.log('找到的物品:', item);
            
            if (!item) {
                console.error('未找到物品');
                return;
            }
            
            pendingDecompose = [item];
            showDecomposeModal();
        }

        // 批量分解
        function batchDecompose() {
            console.log('批量分解，选中物品:', selectedItems);
            
            if (selectedItems.length === 0) {
                alert('请先选择要分解的物品');
                return;
            }
            
            pendingDecompose = userItems.filter(item => selectedItems.includes(String(item.id)));
            console.log('待分解物品:', pendingDecompose);
            
            showDecomposeModal();
        }

        // 显示分解确认弹窗
        function showDecomposeModal() {
            const modal = document.getElementById('decomposeModal');
            const info = document.getElementById('decomposeInfo');
            
            const totalValue = pendingDecompose.reduce((sum, item) => sum + parseFloat(item.value || 0), 0);
            const itemCount = pendingDecompose.length;
            
            // 生成物品统计信息
            const itemStats = {};
            pendingDecompose.forEach(item => {
                if (itemStats[item.name]) {
                    itemStats[item.name]++;
                } else {
                    itemStats[item.name] = 1;
                }
            });
            
            // 构建显示内容
            let displayContent = '';
            
            if (itemCount <= 10) {
                // 10件以下显示具体物品名称
                const itemNames = pendingDecompose.map(item => item.name).join('、');
                displayContent = `
                    <div class="neon-text">即将分解以下物品:</div>
                    <div style="margin: 15px 0; padding: 15px; background: rgba(0,0,0,0.5); border-radius: 10px;">
                        <div class="neon-text gold">${itemNames}</div>
                    </div>
                `;
            } else {
                // 10件以上显示统计信息
                const statsDisplay = Object.entries(itemStats)
                    .map(([name, count]) => `${name} x${count}`)
                    .join('、');
                
                displayContent = `
                    <div class="neon-text">即将分解 ${itemCount} 件物品:</div>
                    <div style="margin: 15px 0; padding: 15px; background: rgba(0,0,0,0.5); border-radius: 10px;">
                        <div class="neon-text gold">${statsDisplay}</div>
                    </div>
                    <div style="margin: 10px 0; padding: 10px; background: rgba(255,165,0,0.2); border-radius: 8px; border-left: 4px solid #ffa500;">
                        <div class="neon-text" style="color: #ffa500;">⚠️ 确认要分解这么多物品吗？此操作不可撤销！</div>
                    </div>
                `;
            }
            
            info.innerHTML = displayContent + `
                <div style="margin: 15px 0; padding: 15px; background: rgba(255,215,0,0.1); border-radius: 10px; border: 1px solid rgba(255,215,0,0.3);">
                    <div class="neon-text gold" style="font-size: 16px; margin-bottom: 8px;">
                        💰 将获得金币: <span style="font-size: 18px; font-weight: bold;">${totalValue.toFixed(2)}</span>
                    </div>
                    <div style="font-size: 13px; opacity: 0.8; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,215,0,0.2);">
                        <div style="color: #ffd700; margin-bottom: 5px;">📌 金币类型: <span style="color: #4ade80;">绑定金币</span></div>
                        <div style="color: #ffa500;">⚠️ 绑定金币不能用于抽奖，只能在商城兑换物品</div>
                    </div>
                </div>
            `;
            
            modal.classList.add('show');
        }

        // 关闭分解弹窗
        function closeDecomposeModal() {
            document.getElementById('decomposeModal').classList.remove('show');
            pendingDecompose = [];
        }

        // 确认分解
        async function confirmDecompose() {
            try {
                console.log('开始分解，待分解物品:', pendingDecompose);
                
                const itemCount = pendingDecompose.length;
                
                // 如果物品数量大于10，需要额外确认
                if (itemCount > 10) {
                    const confirmMessage = `您即将分解 ${itemCount} 件物品，这是一个较大的批量操作。\n\n确定要继续吗？此操作不可撤销！`;
                    if (!confirm(confirmMessage)) {
                        return; // 用户取消操作
                    }
                }
                
                const totalValue = pendingDecompose.reduce((sum, item) => sum + parseFloat(item.value), 0);
                const itemIds = pendingDecompose.map(item => String(item.id));
                
                console.log('分解参数:', { itemIds, totalValue });
                
                // 调用后端API进行分解
                const result = await api.decomposeItems(itemIds, totalValue);
                console.log('分解API响应:', result);
                
                if (result.success) {
                    // 标记物品为已分解
                    pendingDecompose.forEach(item => {
                        const itemIndex = userItems.findIndex(i => i.id == item.id);
                        if (itemIndex > -1) {
                            userItems[itemIndex].decomposed = 1;
                            userItems[itemIndex].decomposed_at = new Date().toISOString();
                        }
                    });
                    
                    // 从选择列表中移除已分解的物品
                    selectedItems = selectedItems.filter(id => 
                        !pendingDecompose.some(item => String(item.id) === String(id))
                    );
                    
                    // 更新显示
                    renderItems();
                    updateStats();
                    updateBatchButtons();
                    loadUserInfo(); // 刷新用户余额
                    
                    alert(`✅ 成功分解 ${itemCount} 件物品\n\n💰 获得 ${totalValue.toFixed(2)} 绑定金币\n\n📌 绑定金币只能在商城兑换物品，不能用于抽奖`);
                } else {
                    alert('分解失败: ' + (result.message || '未知错误'));
                }
                
                closeDecomposeModal();
            } catch (error) {
                console.error('分解失败:', error);
                alert('分解失败，请稍后重试！');
                closeDecomposeModal();
            }
        }

        // 分解物品API调用
        async function decomposeItems(itemIds, totalValue) {
            try {
                const result = await api.decomposeItems(itemIds, totalValue);
                return result;
            } catch (error) {
                console.error('分解API调用失败:', error);
                return { success: false, message: '网络错误，请稍后重试' };
            }
        }

        // 返回主页
        function goToHome() {
            window.location.href = '../main.html';
        }

        // 退出登录
        async function logout() {
            if (confirm('确定要退出登录吗？')) {
                try {
                    await api.logout();
                    window.location.href = '../auth/login.html';
                } catch (error) {
                    console.error('退出登录失败:', error);
                    window.location.href = '../auth/login.html';
                }
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
