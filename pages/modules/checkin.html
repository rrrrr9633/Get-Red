<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无敌俱乐部</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/neon.css">
    <link rel="stylesheet" href="../../css/customer-service.css">
    <style>
        /* 电脑端使用背景图片 */
        @media (min-width: 769px) {
            body {
                background-image: url('../../images/8.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <h1 class="neon-text gold" onclick="goToHome()" style="cursor: pointer;" title="返回主页">无敌俱乐部</h1>
        </div>
        
        <div class="nav-user">
            <div class="user-info" id="userInfo">
                <img id="userAvatar" src="" alt="头像" class="user-avatar">
                <span id="userNickname" class="neon-text"></span>
                <span id="userBalance" class="neon-text gold" style="display: flex; flex-direction: column; align-items: flex-end; font-size: 0.85em; line-height: 1.3;">
                    <span class="total-balance" style="font-size: 1.1em;">总额: 0.00</span>
                    <span class="coin-details" style="font-size: 0.9em; opacity: 0.8;">绑定: 0.00 | 非绑定: 0.00</span>
                </span>
                <a href="../user/recharge.html" class="recharge-btn" title="充值">💰</a>
                <div class="user-dropdown">
                    <a href="../user/profile.html" class="neon-text">个人中心</a>
                    <a href="../main.html" class="neon-text">返回主页</a>
                    <a href="#" onclick="logout()" class="neon-text">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="game-container">
        <div class="game-header">
            <h2 class="neon-text rainbow">每日签到</h2>
            <p class="neon-text">每天签到获得奖励，连续签到奖励更丰厚！</p>
        </div>

        <!-- 签到状态 -->
        <div class="checkin-status">
            <div class="current-date" id="currentDate"></div>
            <div class="checkin-info">
                <div class="info-item">
                    <span class="neon-text">本月签到:</span>
                    <span id="monthlyDays" class="neon-text gold">0/7次</span>
                </div>
                <div class="info-item">
                    <span class="neon-text">剩余次数:</span>
                    <span id="remainingCheckins" class="neon-text gold">7次</span>
                </div>
                <div class="info-item">
                    <span class="neon-text">累计签到:</span>
                    <span id="totalDays" class="neon-text gold">0天</span>
                </div>
            </div>
        </div>

        <!-- 签到按钮 -->
        <div class="checkin-button-container">
            <button id="checkinBtn" class="checkin-btn">
                <div class="btn-icon">📅</div>
                <div class="btn-text">立即签到</div>
                <div class="btn-reward">随机获得 1-5 绑定金币</div>
            </button>
        </div>

        <!-- 签到日历 -->
        <div class="checkin-calendar">
            <h3 class="neon-text gold">本月签到记录</h3>
            <div class="calendar-grid" id="calendarGrid">
                <!-- 日历将通过JS生成 -->
            </div>
        </div>

        <!-- 签到奖励说明 -->
        <div class="reward-info">
            <h3 class="neon-text gold">签到规则</h3>
            <div style="text-align: center; padding: 30px;">
                <p class="neon-text" style="font-size: 20px; margin-bottom: 20px;">
                    每月最多签到 <span class="neon-text gold" style="font-size: 24px;">7次</span>
                </p>
                <p class="neon-text" style="font-size: 18px; margin-bottom: 20px;">
                    每次随机获得 <span class="neon-text gold" style="font-size: 22px;">1-5</span> 绑定金币
                </p>
                <div class="neon-text" style="margin-top: 30px; font-size: 14px; opacity: 0.7;">
                    💡 提示：只有充值过的用户才能使用绑定金币
                </div>
            </div>
        </div>
    </div>

    <!-- 签到成功弹窗 -->
    <div id="checkinModal" class="modal">
        <div class="modal-content">
            <div class="success-animation">🎉</div>
            <h3 class="neon-text gold">签到成功！</h3>
            <div id="checkinResult" class="checkin-result"></div>
            <button onclick="closeCheckinModal()" class="btn-neon">确定</button>
        </div>
    </div>

    <style>
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
        }
        
        .nav-brand h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .nav-user {
            position: relative;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            padding: 10px;
            border-radius: 25px;
            background: rgba(255, 215, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .user-info:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            object-fit: cover;
        }
        
        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 10px 0;
            min-width: 150px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 1001;
        }
        
        .user-info:hover .user-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .user-dropdown a {
            display: block;
            padding: 10px 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .user-dropdown a:hover {
            background: rgba(255, 215, 0, 0.1);
            text-shadow: 0 0 10px currentColor;
        }
        
        .game-container {
            margin-top: 70px;
            padding: 40px 20px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .game-header h2 {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .game-header p {
            font-size: 18px;
            opacity: 0.8;
        }
        
        .checkin-status {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .current-date {
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 25px;
            text-shadow: 0 0 15px #ffd700;
        }
        
        .checkin-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        
        .info-item {
            padding: 15px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
        }
        
        .checkin-button-container {
            text-align: center;
            margin: 40px 0;
        }
        
        .checkin-btn {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            border: none;
            padding: 25px 50px;
            border-radius: 20px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .checkin-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
        }
        
        .checkin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            background: #666;
        }
        
        .btn-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .btn-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .btn-reward {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .checkin-calendar {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
        }
        
        .checkin-calendar h3 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 5px;
            font-size: 14px;
            position: relative;
        }
        
        .calendar-day.header {
            background: rgba(255, 215, 0, 0.1);
            font-weight: bold;
            color: #ffd700;
        }
        
        .calendar-day.checked {
            background: rgba(255, 215, 0, 0.3);
            color: #ffd700;
            border-color: #ffd700;
        }
        
        .calendar-day.today {
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .reward-info {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
        }
        
        .reward-info h3 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        
        .reward-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }
        
        .reward-item {
            text-align: center;
            padding: 20px 15px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        
        .reward-item:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }
        
        .reward-item.special {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
        }
        
        .reward-day {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .reward-amount {
            color: #4ade80;
            font-weight: bold;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .success-animation {
            font-size: 80px;
            animation: bounce 1s ease-in-out;
            margin-bottom: 20px;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }
        
        .modal-content h3 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        .checkin-result {
            margin: 30px 0;
            font-size: 18px;
        }
        
        @media (max-width: 768px) {
            .navbar {
                padding: 0 15px;
            }
            
            .nav-brand h1 {
                font-size: 20px;
            }
            
            .user-info {
                gap: 10px;
                padding: 8px;
            }
            
            .user-avatar {
                width: 35px;
                height: 35px;
            }
            
            /* 移动端隐藏金币详情，只显示总额 */
            .coin-details {
                display: none !important;
            }
            
            .game-container {
                padding: 20px 15px;
            }
            
            .game-header h2 {
                font-size: 36px;
            }
            
            .checkin-info {
                grid-template-columns: 1fr;
            }
            
            .reward-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>

    <script src="../../js/api-client.js"></script>
    <script src="../../js/customer-service.js"></script>
    <script src="../../js/effects.js"></script>
    <script>
        let currentUser = null;

        // 检查登录状态
        function checkLogin() {
            const userData = localStorage.getItem('currentUser');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            
            if (!userData || isLoggedIn !== 'true') {
                alert('请先登录！');
                window.location.href = '../auth/login.html';
                return null;
            }
            
            return JSON.parse(userData);
        }

        // 加载用户信息
        async function loadUserInfo() {
            currentUser = checkLogin();
            if (!currentUser) return;

            try {
                const response = await fetch('../../server/api/users.php?action=profile');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('userAvatar').src = data.user.avatar || '/images/default-avatar.png';
                    document.getElementById('userNickname').textContent = data.user.nickname || data.user.username;
                    
                    const boundCoins = parseFloat(data.user.bound_coins || 0).toFixed(2);
                    const unboundCoins = parseFloat(data.user.unbound_coins || 0).toFixed(2);
                    const totalBalance = parseFloat(data.user.balance || 0).toFixed(2);
                    
                    document.getElementById('userBalance').innerHTML = `
                        <span class="total-balance" style="font-size: 1.1em;">总额: ${totalBalance}</span>
                        <span class="coin-details" style="font-size: 0.9em; opacity: 0.8;">绑定: ${boundCoins} | 非绑定: ${unboundCoins}</span>
                    `;
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);
            }
        }

        // 加载签到状态
        async function loadCheckinStatus() {
            if (!currentUser) return;

            try {
                const response = await fetch('../../server/api/checkin.php?action=status');
                const data = await response.json();
                
                if (data.success) {
                    const checkinBtn = document.getElementById('checkinBtn');
                    
                    // 更新当前日期显示（使用服务器网络时间）
                    if (data.currentTime) {
                        updateCurrentDateFromServer(data.currentTime);
                    }
                    
                    if (data.hasCheckedIn) {
                        // 今天已签到
                        checkinBtn.disabled = true;
                        checkinBtn.querySelector('.btn-text').textContent = '今日已签到';
                        checkinBtn.querySelector('.btn-reward').textContent = '已完成签到';
                        checkinBtn.style.background = '#666';
                        checkinBtn.style.cursor = 'not-allowed';
                    }

                    // 更新统计显示
                    document.getElementById('monthlyDays').textContent = `${data.monthlyDays}/${data.maxMonthlyDays}次`;
                    document.getElementById('remainingCheckins').textContent = `${data.remainingCheckins}次`;
                    document.getElementById('totalDays').textContent = `${data.totalDays}天`;
                    
                    // 如果本月签到次数已满，禁用按钮
                    if (data.remainingCheckins <= 0) {
                        checkinBtn.disabled = true;
                        checkinBtn.querySelector('.btn-text').textContent = '本月已满';
                        checkinBtn.querySelector('.btn-reward').textContent = '下月再来';
                        checkinBtn.style.background = '#666';
                    }

                    // 加载签到日历
                    loadCheckinCalendar();
                } else {
                    console.error('获取签到状态失败:', data.error);
                }
            } catch (error) {
                console.error('加载签到状态失败:', error);
            }
        }

        // 加载签到日历
        async function loadCheckinCalendar() {
            try {
                const response = await fetch('../../server/api/checkin.php?action=calendar');
                const data = await response.json();
                
                if (data.success) {
                    generateCalendar(data.checkinDays, data.year, data.month);
                }
            } catch (error) {
                console.error('加载签到日历失败:', error);
            }
        }

        // 生成签到日历
        function generateCalendar(checkinDays, year, month) {
            const calendarGrid = document.getElementById('calendarGrid');
            const today = new Date();
            
            // 清空日历
            calendarGrid.innerHTML = '';
            
            // 添加星期标题
            const weekHeaders = ['日', '一', '二', '三', '四', '五', '六'];
            weekHeaders.forEach(header => {
                const headerDiv = document.createElement('div');
                headerDiv.className = 'calendar-day header';
                headerDiv.textContent = header;
                calendarGrid.appendChild(headerDiv);
            });
            
            // 获取本月第一天和最后一天
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());
            
            // 生成日历格子
            for (let i = 0; i < 42; i++) {
                const currentDate = new Date(startDate);
                currentDate.setDate(startDate.getDate() + i);
                
                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                
                if (currentDate.getMonth() === month - 1) {
                    dayDiv.textContent = currentDate.getDate();
                    
                    // 检查是否签到过
                    const checkedDay = checkinDays.find(day => day.day == currentDate.getDate());
                    if (checkedDay) {
                        dayDiv.classList.add('checked');
                        dayDiv.title = `获得${checkedDay.reward_amount}金币`;
                    }
                    
                    // 标记今天
                    if (currentDate.toDateString() === today.toDateString()) {
                        dayDiv.classList.add('today');
                    }
                } else {
                    dayDiv.style.opacity = '0.3';
                    dayDiv.textContent = currentDate.getDate();
                }
                
                calendarGrid.appendChild(dayDiv);
            }
        }

        // 执行签到
        async function performCheckin() {
            if (!currentUser) return;

            const checkinBtn = document.getElementById('checkinBtn');
            checkinBtn.disabled = true;
            checkinBtn.querySelector('.btn-text').textContent = '签到中...';

            try {
                const response = await fetch('../../server/api/checkin.php?action=checkin', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    // 显示成功弹窗
                    showCheckinResult(data.reward, data.monthlyCount, data.bound_coins);
                    
                    // 刷新页面状态
                    loadUserInfo();
                    loadCheckinStatus();
                } else {
                    alert('签到失败: ' + data.error);
                    checkinBtn.disabled = false;
                    checkinBtn.querySelector('.btn-text').textContent = '立即签到';
                }
            } catch (error) {
                console.error('签到失败:', error);
                alert('网络错误，请稍后再试！');
                checkinBtn.disabled = false;
                checkinBtn.querySelector('.btn-text').textContent = '立即签到';
            }
        }

        // 显示签到结果
        function showCheckinResult(reward, monthlyCount, bound_coins) {
            const modal = document.getElementById('checkinModal');
            const result = document.getElementById('checkinResult');
            
            result.innerHTML = `
                <div class="neon-text gold" style="font-size: 24px; margin: 15px 0;">获得奖励: ${reward} 绑定金币</div>
                <div class="neon-text" style="font-size: 18px;">本月已签到: ${monthlyCount}/7 次</div>
                <div class="neon-text" style="font-size: 16px; margin: 10px 0;">当前绑定金币: ${bound_coins}</div>
                <div class="neon-text" style="font-size: 14px; opacity: 0.8; margin-top: 15px;">
                    ${monthlyCount >= 7 ? '本月签到次数已满！' : `本月还可签到 ${7 - monthlyCount} 次`}
                </div>
            `;
            
            modal.classList.add('show');
        }

        // 关闭签到弹窗
        function closeCheckinModal() {
            document.getElementById('checkinModal').classList.remove('show');
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('currentUser');
                localStorage.removeItem('isLoggedIn');
                window.location.href = '../auth/login.html';
            }
        }

        // 更新当前日期显示（使用服务器网络时间）
        function updateCurrentDateFromServer(serverTime) {
            try {
                const serverDate = new Date(serverTime);
                const options = { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric',
                    weekday: 'long'
                };
                const dateString = serverDate.toLocaleDateString('zh-CN', options);
                const timeString = serverDate.toLocaleTimeString('zh-CN');
                document.getElementById('currentDate').innerHTML = `${dateString}<br><small style="color: #888;">网络时间: ${timeString}</small>`;
            } catch (error) {
                console.error('解析服务器时间失败:', error);
                updateCurrentDate(); // 备用方案
            }
        }

        // 更新当前日期显示（备用方案：本地时间）
        function updateCurrentDate() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            };
            const dateString = now.toLocaleDateString('zh-CN', options);
            const timeString = now.toLocaleTimeString('zh-CN');
            document.getElementById('currentDate').innerHTML = `${dateString}<br><small style="color: #ff6b6b;">本地时间: ${timeString}</small>`;
        }

        // 绑定签到按钮
        document.getElementById('checkinBtn').addEventListener('click', performCheckin);
        
        // 返回主页
        function goToHome() {
            window.location.href = '../main.html';
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            updateCurrentDate();
            loadUserInfo();
            loadCheckinStatus();
            createParticles();
        });
    </script>
</body>
</html>
