<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无敌俱乐部</title>
    <link rel="stylesheet" href="../css/colors.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/neon.css">
    <link rel="stylesheet" href="../css/customer-service.css">
    <script src="../js/api-client.js?v=20250115"></script>
    <script src="../js/customer-service.js?v=20250115"></script>
</head>
<body>
    <div class="particles"></div>
    
    <!-- 首次登录欢迎弹窗 -->
    <div id="welcomeModal" class="welcome-modal" style="display: none;">
        <div class="welcome-modal-overlay"></div>
        <div class="welcome-modal-content">
            <div class="welcome-icon">🎉</div>
            <h2 class="welcome-title">欢迎加入牛皮俱乐部！</h2>
            <div class="welcome-reward">
                <div class="reward-icon">💰</div>
                <div class="reward-text">获得注册奖励</div>
                <div class="reward-amount">10 金币</div>
            </div>
            <p class="welcome-message">开始您的幸运之旅吧！</p>
            <button class="welcome-btn" onclick="closeWelcomeModal()">开始游戏</button>
        </div>
    </div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <h1 class="neon-text gold" onclick="goToHome()" style="cursor: pointer;" title="返回主页">无敌俱乐部</h1>
            
            <!-- 模块切换 -->
            <div class="module-switcher">
                <button class="module-btn active" onclick="switchModule('lucky')" data-module="lucky">
                    <span class="module-icon">🎰</span>
                    <span class="module-name">幸运抽奖</span>
                </button>
                <button class="module-btn" onclick="switchModule('shop')" data-module="shop">
                    <span class="module-icon">🛒</span>
                    <span class="module-name">金币商城</span>
                </button>
            </div>
        </div>
        
        <div class="nav-user">
            <!-- 仓库 -->
            <div class="nav-item warehouse-btn" onclick="window.location.href='modules/container.html'" title="仓库">
                <i class="icon">📦</i>
                <span>仓库</span>
            </div>
            
            <!-- 每日签到 -->
            <div class="nav-item checkin-btn" onclick="window.location.href='modules/checkin.html'" title="每日签到">
                <i class="icon">📅</i>
                <span>每日签到</span>
            </div>
            
            <div class="user-info" id="userInfo">
                <img id="userAvatar" src="" alt="头像" class="user-avatar">
                <span id="userNickname" class="neon-text"></span>
                <span id="userBalance" class="neon-text gold" style="display: flex; flex-direction: column; align-items: flex-end; font-size: 0.85em; line-height: 1.3;">
                    <span class="total-balance" style="font-size: 1.1em;">总额: 0.00</span>
                    <span class="coin-details" style="font-size: 0.9em; opacity: 0.8;">绑定: 0.00 | 非绑定: 0.00</span>
                </span>
                <a href="./user/recharge-v2.html" class="recharge-btn" title="充值">
                    <span class="recharge-icon">💰</span>
                    <span class="recharge-text">充值</span>
                </a>
                <div class="user-dropdown">
                    <a href="user/profile.html" class="neon-text">个人中心</a>
                    <a href="#" onclick="logout()" class="neon-text">退出登录</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- 幸运抽奖模块 -->
        <div id="luckyModule" class="module-content active">
            <div class="welcome-section">
                <h2 id="welcomeTitle" class="neon-text rainbow">欢迎来到无敌俱乐部</h2>
                <p class="neon-text">选择您喜欢的游戏模式，开始您的幸运之旅！</p>
            </div>

            <!-- 游戏模块网格 -->
            <div class="game-grid" id="gameGrid">
                <!-- Lucky页面将动态加载到这里 -->
            </div>
        </div>
        
        <!-- 金币商城模块 -->
        <div id="shopModule" class="module-content">
            <div class="welcome-section">
                <h2 class="neon-text rainbow">金币商城</h2>
                <p class="neon-text">使用您的金币兑换各种精美物品！</p>
            </div>
            
            <div class="shop-categories-grid" id="shopCategoriesGrid">
                <div style="text-align:center;color:#ffd700;padding:40px;">加载中...</div>
            </div>
        </div>
    </div>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
        }
        
        /* 电脑端使用背景图片 */
        @media (min-width: 769px) {
            body {
                background-image: url('../images/1.jpg');
            }
        }
        
        /* 手机端使用渐变背景 */
        @media (max-width: 768px) {
            body {
                background-image: none;
                background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            }
        }
        
        /* 添加半透明遮罩层以提高内容可读性 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(26, 31, 46, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
        }
        
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .nav-brand h1 {
            margin: 0;
            font-size: 24px;
            color: var(--primary-green);
            flex-shrink: 0;
        }
        
        /* 模块切换器样式 */
        .module-switcher {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        
        .module-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            line-height: 1;
        }
        
        .module-btn:hover {
            background: rgba(74, 222, 128, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }
        
        .module-btn.active {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.2), rgba(34, 197, 94, 0.2));
            color: var(--primary-green);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
        }
        
        .module-icon {
            font-size: 15px;
            display: flex;
            align-items: center;
            line-height: 1;
        }
        
        .module-name {
            font-weight: 600;
            letter-spacing: 0.2px;
            line-height: 1;
            font-size: 13px;
        }
        
        .module-btn.active .module-name {
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }
        
        .nav-user {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            border-radius: 8px;
            background: rgba(74, 222, 128, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-green);
        }
        
        .nav-item:hover {
            background: rgba(74, 222, 128, 0.2);
            transform: translateY(-2px);
        }
        
        .nav-item .icon {
            font-size: 18px;
        }
        
        .nav-item span {
            font-size: 12px;
            color: var(--primary-green);
            font-weight: bold;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            padding: 10px;
            border-radius: 20px;
            background: rgba(74, 222, 128, 0.1);
            transition: all 0.2s ease;
        }
        
        .user-info:hover {
            background: rgba(74, 222, 128, 0.2);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-green);
            object-fit: cover;
        }
        
        .recharge-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 10px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .recharge-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }
        
        .recharge-icon {
            font-size: 20px;
            line-height: 1;
        }
        
        .recharge-text {
            font-size: 11px;
            color: #ffd700;
            font-weight: 600;
            line-height: 1;
        }
        
        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-green);
            border-radius: 8px;
            padding: 10px 0;
            min-width: 150px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
            z-index: 1001;
        }
        
        .user-info:hover .user-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .user-dropdown a {
            display: block;
            padding: 10px 20px;
            text-decoration: none;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }
        
        .user-dropdown a:hover {
            background: rgba(74, 222, 128, 0.1);
        }
        
        .main-container {
            margin-top: 70px;
            padding: 40px 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* 模块内容切换 */
        .module-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .module-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .welcome-section {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .welcome-section h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--primary-green);
        }
        
        .welcome-section p {
            font-size: 18px;
            opacity: 0.8;
            color: var(--text-primary);
        }
        
        /* 商城即将开放样式 */
        .shop-coming-soon {
            text-align: center;
            padding: 80px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(74, 222, 128, 0.3);
            border-radius: 20px;
            margin-top: 40px;
        }
        
        .coming-soon-icon {
            font-size: 100px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        .shop-coming-soon h3 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        .shop-coming-soon p {
            font-size: 18px;
            opacity: 0.8;
            margin-bottom: 50px;
        }
        
        .features-preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 30px 20px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 15px;
            transition: all 0.3s ease;
        }
        
        .feature-item:hover {
            background: rgba(74, 222, 128, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(74, 222, 128, 0.2);
        }
        
        .feature-icon {
            font-size: 48px;
            filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.5));
        }
        
        .feature-text {
            font-size: 16px;
            font-weight: bold;
        }
        
        /* 商城2x2网格布局 - 引用lucky页面样式 */
        .shop-categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .shop-card {
            position: relative;
            background: linear-gradient(135deg, rgba(26, 31, 46, 0.9) 0%, rgba(31, 41, 55, 0.9) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-green);
            border-radius: 16px;
            padding: 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .shop-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-green-hover);
            border-color: var(--border-green-hover);
        }
        
        /* 商城卡片图片容器 - 占据卡片上半部分 */
        .shop-card-image {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .shop-card-image img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            transition: transform 0.4s ease, filter 0.4s ease;
            filter: brightness(0.9) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
        }
        
        .shop-card:hover .shop-card-image img {
            transform: scale(1.1);
            filter: brightness(1.1) drop-shadow(0 8px 20px rgba(74, 222, 128, 0.3));
        }
        
        .shop-card-icon {
            font-size: 120px;
            filter: drop-shadow(0 4px 12px var(--primary-green-glow));
            transition: transform 0.4s ease;
        }
        
        .shop-card:hover .shop-card-icon {
            transform: scale(1.1);
        }
        
        /* 图片上的渐变遮罩 */
        .shop-card-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, var(--bg-secondary) 0%, rgba(26, 31, 46, 0) 100%);
            pointer-events: none;
        }
        
        /* 商城卡片内容区域 */
        .shop-card-content {
            padding: 24px 20px 16px;
            background: linear-gradient(180deg, transparent 0%, rgba(26, 31, 46, 0.8) 20%);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .shop-card-content h3 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-green);
        }
        
        .shop-card-content p {
            font-size: 14px;
            opacity: 0.7;
            margin: 0;
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* 悬停时的光效 */
        .shop-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(74, 222, 128, 0.15), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
            z-index: 1;
        }
        
        .shop-card:hover::before {
            left: 100%;
        }
        
        /* 商城按钮 */
        .shop-btn {
            width: calc(100% - 40px);
            margin: 0 20px 20px;
            padding: 14px 30px;
            background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }
        
        .shop-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .shop-btn:hover::before {
            left: 100%;
        }
        
        .shop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.4);
        }
        
        .shop-btn:active {
            transform: translateY(0);
        }
        
        .btn-text {
            position: relative;
            z-index: 1;
        }
        
        .btn-arrow {
            position: relative;
            z-index: 1;
            font-size: 20px;
            transition: transform 0.3s ease;
        }
        
        .shop-btn:hover .btn-arrow {
            transform: translateX(5px);
        }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 40px;
        }
        
        @media (min-width: 1200px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (min-width: 900px) and (max-width: 1199px) {
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .game-card {
            position: relative;
            background: linear-gradient(135deg, rgba(26, 31, 46, 0.9) 0%, rgba(31, 41, 55, 0.9) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-green);
            border-radius: 16px;
            padding: 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-green-hover);
            border-color: var(--border-green-hover);
        }
        
        .card-icon {
            font-size: 120px;
            margin: 40px 0 20px;
            filter: drop-shadow(0 4px 12px var(--primary-green-glow));
        }
        
        /* 大图片容器 - 占据卡片上半部分 */
        .card-thumb {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .card-thumb img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            transition: transform 0.4s ease, filter 0.4s ease;
            filter: brightness(0.9) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
        }
        
        .game-card:hover .card-thumb img {
            transform: scale(1.1);
            filter: brightness(1.1) drop-shadow(0 8px 20px rgba(74, 222, 128, 0.3));
        }
        
        /* 图片上的渐变遮罩 */
        .card-thumb::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, var(--bg-secondary) 0%, rgba(26, 31, 46, 0) 100%);
            pointer-events: none;
        }
        
        /* 卡片内容区域 */
        .card-content {
            padding: 24px 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(26, 31, 46, 0.8) 20%);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .game-card h3 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-green);
        }
        
        .game-card p {
            font-size: 14px;
            opacity: 0.7;
            margin: 0;
            color: var(--text-primary);
        }
        
        /* 悬停时的光效 */
        .card-glow {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(74, 222, 128, 0.15), transparent);
            transition: left 0.6s ease;
            pointer-events: none;
        }
        
        .game-card:hover .card-glow {
            left: 100%;
        }
        
        /* 卡片角标 - 可选 */
        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--primary-red);
            color: #fff;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            z-index: 2;
            text-transform: uppercase;
        }
        
        @media (max-width: 768px) {
            body::before {
                display: none;
            }
            
            .navbar {
                padding: 0 6px;
                height: 50px;
            }
            
            .nav-brand {
                flex-direction: row;
                gap: 6px;
                align-items: center;
            }
            
            .nav-brand h1 {
                font-size: 13px;
                white-space: nowrap;
            }
            
            .module-switcher {
                gap: 2px;
                padding: 2px;
                border-radius: 6px;
            }
            
            .module-btn {
                padding: 4px 5px;
                font-size: 10px;
                gap: 0;
                min-width: 28px;
                justify-content: center;
                border-radius: 5px;

        // 检查是否首次登录
        function checkFirstLogin(user) {
            // 使用localStorage记录用户是否已经看过欢迎弹窗
            const welcomeShownKey = `welcome_shown_${user.id}`;
            const hasShownWelcome = localStorage.getItem(welcomeShownKey);
            
            // 如果没有显示过欢迎弹窗，且用户是新注册的（创建时间和最后登录时间相近）
            if (!hasShownWelcome) {
                const createdAt = new Date(user.created_at);
                const lastLogin = user.last_login ? new Date(user.last_login) : new Date();
                const timeDiff = Math.abs(lastLogin - createdAt) / 1000 / 60; // 分钟差
                
                // 如果创建时间和最后登录时间相差小于5分钟，认为是首次登录
                if (timeDiff < 5) {
                    showWelcomeModal();
                    localStorage.setItem(welcomeShownKey, 'true');
                }
            }
        }

                    renderShopCards(data.icons);
                } else {
                    // 如果加载失败，使用默认配置
                    renderDefaultShopCards();
                }
            } catch (error) {
                console.error('加载商店图标失败:', error);
                renderDefaultShopCards();
            }
        }

        // 渲染商店卡片
        function renderShopCards(icons) {
            const container = document.getElementById('shopCategoriesGrid');
            
            container.innerHTML = icons.map(icon => {
                // 处理图片路径：如果是相对路径，添加../前缀
                let imageSrc = icon.icon_url;
                if (imageSrc && !imageSrc.startsWith('http://') && !imageSrc.startsWith('https://') && !imageSrc.startsWith('data:')) {
                    imageSrc = '../' + imageSrc;
                }
                
                return `
                    <div class="shop-card" onclick="navigateToShop('${icon.icon_key}')">
                        <div class="shop-card-image">
                            ${icon.icon_url ? 
                                `<img src="${imageSrc}" alt="${icon.icon_name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                 <div class="shop-card-icon" style="display: none;">${icon.fallback_icon}</div>` :
                                `<div class="shop-card-icon">${icon.fallback_icon}</div>`
                            }
                        </div>
                        <div class="shop-card-content">
                            <h3 class="neon-text">${icon.icon_name}</h3>
                            <p class="neon-text">${icon.description || ''}</p>
                        </div>
                        <button class="shop-btn">
                            <span class="btn-text">立即查看</span>
                            <span class="btn-arrow">→</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // 渲染默认商店卡片（备用）
        function renderDefaultShopCards() {
            const container = document.getElementById('shopCategoriesGrid');
            const defaultCards = [
                { key: 'gold-escort', name: '金牌护航', icon: '🛡️', desc: '保障您的每一次抽奖体验' },
                { key: 'knife-exchange', name: '1:1跑刀', icon: '🔪', desc: '公平公正的刀具兑换服务' },
                { key: 'skin-exchange', name: '皮肤兑换', icon: '🎨', desc: '精美皮肤，随心兑换' },
                { key: 'legendary-exchange', name: '传说级兑换', icon: '⭐', desc: '顶级稀有物品，尊享兑换' }
            ];
            
            container.innerHTML = defaultCards.map(card => `
                <div class="shop-card" onclick="navigateToShop('${card.key}')">
                    <div class="shop-card-image">
                        <div class="shop-card-icon">${card.icon}</div>
                    </div>
                    <div class="shop-card-content">
                        <h3 class="neon-text">${card.name}</h3>
                        <p class="neon-text">${card.desc}</p>
                    </div>
                    <button class="shop-btn">
                        <span class="btn-text">立即查看</span>
                        <span class="btn-arrow">→</span>
                    </button>
                </div>
            `).join('');
        }

        // 跳转到商城页面
        function navigateToShop(shopType) {
            if (api.isLoggedIn()) {
                const shopUrls = {
                    'gold-escort': 'shop/gold-escort.html',
                    'knife-exchange': 'shop/knife-exchange.html',
                    'skin-exchange': 'shop/skin-exchange.html',
                    'legendary-exchange': 'shop/legendary-exchange.html'
                };
                
                if (shopUrls[shopType]) {
                    window.location.href = shopUrls[shopType];
                }
            } else {
                alert('请先登录！');
                window.location.href = 'auth/login.html';
            }
        }
        
        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                api.logout();
                window.location.href = 'auth/login.html';
            }
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化API客户端
            window.api = new APIClient();
            
            loadUserInfo();
            loadLuckyPages();
            loadShopIcons(); // 加载商店图标
            loadThemeName(); // 加载主题名称
        });
        
        // 加载主题名称
        async function loadThemeName() {
            try {
                const response = await fetch('../server/api/admin.php?action=get_theme_settings');
                const data = await response.json();
                
                if (data.success && data.theme && data.theme.name) {
                    const themeName = data.theme.name;
                    
                    // 更新页面标题
                    document.title = themeName;
                    
                    // 更新导航栏品牌名
                    const navBrandH1 = document.querySelector('.nav-brand h1');
                    if (navBrandH1) {
                        navBrandH1.textContent = themeName;
                    }
                    
                    // 更新欢迎标题
                    const welcomeTitle = document.getElementById('welcomeTitle');
                    if (welcomeTitle) {
                        welcomeTitle.textContent = '欢迎来到' + themeName;
                    }
                }
            } catch (error) {
                console.error('加载主题名称失败:', error);
            }
        }

        // 加载Lucky页面列表
        async function loadLuckyPages() {
            try {
                // 使用新的合并接口
                const response = await fetch('../server/api/admin.php?action=list_lucky_pages_merged');
                const data = await response.json();
                
                if (data.success && data.items) {
                    renderLuckyPagesMerged(data.items);
                } else {
                    // fallback到默认页面
                    renderLuckyPages([
                        {fileName: "lucky1.html", displayName: "大红行动", icon: "🍎"}
                    ]);
                }
            } catch (error) {
                console.error('加载Lucky页面失败:', error);
                // fallback到默认页面
                renderLuckyPages([
                    {fileName: "lucky1.html", displayName: "大红行动", icon: "🍎"}
                ]);
            }
        }

        // 渲染合并后的Lucky页面
        function renderLuckyPagesMerged(items) {
            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            
            console.log('Lucky页面数据（合并）:', items);
            
            items.forEach(function(item) {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                
                // 点击进入fileName指定的页面
                gameCard.onclick = function() { navigateToGame(item.fileName); };
                
                // 构建卡片内容
                let cardContent = '<div class="card-glow"></div>';
                
                // 获取描述文本
                const description = item.description || '抽取心爱的大红';
                
                // 如果有缩略图，显示图片；否则显示icon
                if (item.thumbImage) {
                    cardContent += `
                        <div class="card-thumb">
                            <img src="../${item.thumbImage}" alt="${item.displayName}" 
                                 onerror="console.error('图片加载失败:', this.src); this.style.display='none'; this.parentElement.innerHTML='<div class=\\'card-icon\\'>${item.icon || '🍎'}</div>';" />
                        </div>
                        <div class="card-content">
                            <h3>${item.displayName}</h3>
                            <p>${description}</p>
                        </div>
                    `;
                } else {
                    cardContent += `
                        <div class="card-icon">${item.icon || '🍎'}</div>
                        <div class="card-content">
                            <h3>${item.displayName}</h3>
                            <p>${description}</p>
                        </div>
                    `;
                }
                
                gameCard.innerHTML = cardContent;
                gameGrid.appendChild(gameCard);
            });
        }

        // 渲染Lucky页面卡片
        function renderLuckyPages(pages) {
            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            
            console.log('Lucky页面数据:', pages); // 调试信息
            
            pages.forEach(function(page, index) {
                console.log('处理页面:', page.fileName, '缩略图路径:', page.thumbImage); // 调试信息
                
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                gameCard.onclick = function() { navigateToGame(page.fileName); };
                
                // 构建卡片内容
                let cardContent = '<div class="card-glow"></div>';
                
                // 获取描述文本，优先使用page.description，否则使用默认值
                const description = page.description || '抽取心爱的大红';
                
                // 如果有小图片，显示大图片；否则显示icon
                if (page.thumbImage) {
                    cardContent += `
                        <div class="card-thumb">
                            <img src="${page.thumbImage}" alt="${page.displayName}" onerror="console.error('图片加载失败:', this.src); this.style.display='none'; this.parentElement.innerHTML='<div class=\\'card-icon\\'>${page.icon || '🍎'}</div>';" />
                        </div>
                        <div class="card-content">
                            <h3>${page.displayName || page.fileName}</h3>
                            <p>${description}</p>
                        </div>
                    `;
                } else {
                    cardContent += `
                        <div class="card-icon">${page.icon || '🍎'}</div>
                        <div class="card-content">
                            <h3>${page.displayName || page.fileName}</h3>
                            <p>${description}</p>
                        </div>
                    `;
                }
                
                gameCard.innerHTML = cardContent;
                gameGrid.appendChild(gameCard);
            });
        }

        // 新增功能函数
        
        // 返回主页
        function goToHome() {
            // 已经在主页，无需跳转
            console.log('已在主页');
        }

    </script>

    <!-- 公告按钮 -->
    <div class="announcement-btn" id="announcementBtn" onclick="openAnnouncementModal()">
        <span class="announcement-icon">📢</span>
        <span class="announcement-badge" id="announcementBadge" style="display: none;">0</span>
    </div>

    <!-- 公告弹窗 -->
    <div class="announcement-modal" id="announcementModal">
        <div class="announcement-modal-overlay" onclick="closeAnnouncementModal()"></div>
        <div class="announcement-modal-content">
            <div class="announcement-modal-header">
                <h2 class="neon-text gold">📢 系统公告</h2>
                <button class="close-btn" onclick="closeAnnouncementModal()">×</button>
            </div>
            <div class="announcement-modal-body" id="announcementList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script src="../js/announcement.js"></script>
</body>
</html>
