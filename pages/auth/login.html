<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛皮俱乐部</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/neon.css">
    <style>
        /* 主网站风格的登录样式 - 红色主题 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f1419 0%, #1a1a2e 50%, #16213e 100%);
            position: relative;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            position: relative;
        }
        
        .login-form {
            background: linear-gradient(135deg, rgba(15, 15, 25, 0.95), rgba(20, 20, 35, 0.95));
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(239, 68, 68, 0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(239, 68, 68, 0.3);
            position: relative;
            width: 450px;
            max-width: 90vw;
            text-align: center;
        }
        
        .login-form h2 {
            font-size: 32px;
            margin-bottom: 40px;
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            font-weight: 700;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-group input {
            width: 100%;
            padding: 18px 25px;
            background: rgba(30, 30, 50, 0.8);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
            background: rgba(30, 30, 50, 0.95);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .btn-neon {
            width: 100%;
            padding: 18px 25px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: 2px solid rgba(239, 68, 68, 0.5);
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 25px rgba(239, 68, 68, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        
        .btn-neon:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 35px rgba(239, 68, 68, 0.6),
                0 0 40px rgba(239, 68, 68, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-color: rgba(239, 68, 68, 0.8);
        }
        
        .btn-neon:active {
            transform: translateY(-1px);
        }
        
        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-neon:hover::before {
            left: 100%;
        }
        
        .form-links {
            margin-top: 30px;
        }
        
        .form-links a {
            color: #4ade80;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-links a:hover {
            color: #22c55e;
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.5);
        }
        
        /* 消息提示样式 */
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 30px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .message.show {
            opacity: 1;
            visibility: visible;
        }
        
        .message.success {
            background: linear-gradient(45deg, #22c55e, #16a34a);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.4);
        }
        
        .message.error {
            background: linear-gradient(45deg, #ef4444, #dc2626);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }
        
        /* 手机端响应式样式 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .login-form {
                padding: 30px 25px;
                width: 100%;
                max-width: 400px;
                margin: 20px auto;
            }
            
            .login-form h2 {
                font-size: 28px;
                margin-bottom: 30px;
            }
            
            .form-group {
                margin-bottom: 18px;
            }
            
            .form-group input {
                padding: 12px 16px;
                font-size: 15px;
            }
            
            .btn-neon {
                padding: 12px 30px;
                font-size: 16px;
            }
            
            .form-links {
                margin-top: 20px;
            }
            
            .form-links a {
                font-size: 14px;
            }
            
            .message {
                padding: 12px 20px;
                font-size: 14px;
                max-width: 90vw;
            }
        }
        
        @media (max-width: 480px) {
            .login-form {
                padding: 25px 20px;
                border-radius: 15px;
            }
            
            .login-form h2 {
                font-size: 24px;
            }
            
            .form-group input {
                padding: 10px 14px;
                font-size: 14px;
                border-radius: 10px;
            }
            
            .btn-neon {
                padding: 10px 25px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    
    <div class="login-container">
        <div class="login-form">
            <h2>用户登录</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="用户名" required>
                </div>
                
                <div class="form-group">
                    <input type="password" id="password" placeholder="密码" required>
                </div>
                
                <button type="submit" class="btn-neon">登录</button>
            </form>
            
            <div class="form-links">
                <a href="register.html">还没有账号？立即注册</a>
            </div>
        </div>
    </div>

    <script src="../../js/api-client.js"></script>
    <script src="../../js/effects.js"></script>
    <script>
        let countdownInterval = null;
        
        // 消息提示函数
        function showMessage(text, type = 'success') {
            // 移除已存在的消息
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            document.body.appendChild(message);
            
            // 显示消息
            setTimeout(() => message.classList.add('show'), 100);
            
            // 3秒后隐藏消息
            setTimeout(() => {
                message.classList.remove('show');
                setTimeout(() => message.remove(), 300);
            }, 3000);
        }
        
        // 显示倒计时消息
        function showCountdownMessage(seconds) {
            // 清除之前的倒计时
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            // 移除已存在的消息
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const message = document.createElement('div');
            message.className = 'message error';
            message.id = 'countdownMessage';
            document.body.appendChild(message);
            
            let remainingSeconds = seconds;
            
            // 更新倒计时显示
            function updateCountdown() {
                if (remainingSeconds > 0) {
                    message.textContent = `请求过于频繁，请 ${remainingSeconds} 秒后重试`;
                    remainingSeconds--;
                } else {
                    clearInterval(countdownInterval);
                    message.classList.remove('show');
                    setTimeout(() => message.remove(), 300);
                }
            }
            
            // 立即显示第一次
            updateCountdown();
            message.classList.add('show');
            
            // 每秒更新一次
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        // 登录表单处理
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showMessage('请填写完整的登录信息！', 'error');
                return;
            }
            
            // 显示加载状态
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            
            try {
                submitBtn.textContent = '登录中...';
                submitBtn.disabled = true;
                
                // 调用API登录
                const result = await api.login(username, password);
                
                if (result.success) {
                    showMessage('登录成功！正在跳转...', 'success');
                    
                    // 1.5秒后跳转到主页
                    setTimeout(() => {
                        window.location.href = '../main.html';
                    }, 1500);
                } else {
                    // 检查是否有retry_after字段（频率限制）
                    if (result.retry_after && result.retry_after > 0) {
                        showCountdownMessage(result.retry_after);
                    } else {
                        showMessage(result.message || '登录失败，请检查用户名和密码！', 'error');
                    }
                }
            } catch (error) {
                console.error('登录失败:', error);
                
                // 检查错误响应中是否有retry_after
                if (error.retry_after && error.retry_after > 0) {
                    showCountdownMessage(error.retry_after);
                } else {
                    showMessage('网络错误，请稍后再试！', 'error');
                }
            } finally {
                // 恢复按钮状态
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });

        // 不再自动检查登录状态，用户需要手动登录
        // 但仍保留自动填充功能
        const savedUsername = localStorage.getItem('savedUsername');
        const savedPassword = localStorage.getItem('savedPassword');
        
        if (savedUsername && savedPassword) {
            document.getElementById('username').value = savedUsername;
            document.getElementById('password').value = savedPassword;
        }

        // 初始化粒子效果
        if (typeof createParticles === 'function') {
            createParticles();
        }
        
        // 页面卸载时清除倒计时
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
        });
    </script>
</body>
</html>
