<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无敌俱乐部</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/neon.css">
    <link rel="stylesheet" href="../../css/sms-captcha.css">
    <style>
        /* 优化的注册样式 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 50%, #0a1a0a 100%);
            position: relative;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            position: relative;
        }
        
        .login-form {
            background: rgba(20, 20, 40, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 
                0 0 50px rgba(255, 0, 255, 0.3),
                0 0 100px rgba(0, 255, 255, 0.2),
                inset 0 0 50px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
            width: 500px;
            max-width: 90vw;
            text-align: center;
        }
        
        .login-form::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            border-radius: 22px;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
        }
        
        @keyframes borderGlow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .login-form h2 {
            font-size: 32px;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #ffd700, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: #333;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4);
            background: rgba(255, 255, 255, 0.95);
        }
        
        .form-group input::placeholder {
            color: #333;
            font-weight: 500;
        }
        
        .form-group input {
            color: #333 !important;
        }
        
        .btn-neon {
            width: 100%;
            padding: 18px 25px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .btn-neon:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-neon:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 0, 255, 0.4);
        }
        
        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-neon:hover:not(:disabled)::before {
            left: 100%;
        }
        
        .form-links {
            margin-top: 30px;
        }
        
        .form-links a {
            color: #ffd700;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-links a:hover {
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }
        
        /* 消息提示样式 */
        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 30px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .message.show {
            opacity: 1;
            visibility: visible;
        }
        
        .message.success {
            background: linear-gradient(45deg, #00ff88, #00cc66);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }
        
        .message.error {
            background: linear-gradient(45deg, #ff0044, #cc0033);
            box-shadow: 0 0 30px rgba(255, 0, 68, 0.4);
        }
        
        /* 手机端响应式样式 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .login-form {
                padding: 30px 25px;
                width: 100%;
                max-width: 400px;
                margin: 20px auto;
            }
            
            .login-form h2 {
                font-size: 28px;
                margin-bottom: 30px;
            }
            
            .form-group {
                margin-bottom: 18px;
            }
            
            .form-group input {
                padding: 12px 16px;
                font-size: 15px;
            }
            
            .btn-neon {
                padding: 12px 30px;
                font-size: 16px;
            }
            
            .form-links {
                margin-top: 20px;
            }
            
            .form-links a {
                font-size: 14px;
            }
            
            .message {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
        
        @media (max-width: 480px) {
            .login-form {
                padding: 25px 20px;
                border-radius: 15px;
            }
            
            .login-form h2 {
                font-size: 24px;
            }
            
            .form-group input {
                padding: 10px 14px;
                font-size: 14px;
            }
            
            .btn-neon {
                padding: 10px 25px;
                font-size: 15px;
            }
            
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    
    <div class="login-container">
        <div class="login-form">
            <h2>用户注册</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="用户名" required>
                </div>
                
                <div class="form-group">
                    <input type="password" id="password" placeholder="密码（至少6位）" required>
                </div>
                
                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="确认密码" required>
                </div>
                
                <div class="form-group">
                    <input type="text" id="nickname" placeholder="昵称" required>
                </div>
                
                <div class="form-group">
                    <input type="tel" id="phoneNumber" placeholder="手机号" maxlength="11" required>
                </div>
                
                <div id="sms-captcha-container"></div>
                
                <button type="submit" class="btn-neon">注册</button>
            </form>
            
            <div class="form-links">
                <a href="login.html">已有账号？立即登录</a>
            </div>
        </div>
    </div>

    <script src="../../js/api-client.js"></script>
    <script src="../../js/effects.js"></script>
    <script src="../../js/sms-captcha.js"></script>
    <script>
        let countdownInterval = null;
        let smsCaptchaManager = null; // 全局变量保存实例
        
        // 页面加载完成后初始化短信验证码组件
        document.addEventListener('DOMContentLoaded', function() {
            smsCaptchaManager = new SmsCaptchaManager('sms-captcha-container');
        });
        
        // 消息提示函数
        function showMessage(text, type = 'success') {
            // 移除已存在的消息
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            document.body.appendChild(message);
            
            // 显示消息
            setTimeout(() => message.classList.add('show'), 100);
            
            // 3秒后隐藏消息
            setTimeout(() => {
                message.classList.remove('show');
                setTimeout(() => message.remove(), 300);
            }, 3000);
        }
        
        // 显示倒计时消息
        function showCountdownMessage(seconds) {
            // 清除之前的倒计时
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            // 移除已存在的消息
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            const message = document.createElement('div');
            message.className = 'message error';
            message.id = 'countdownMessage';
            document.body.appendChild(message);
            
            let remainingSeconds = seconds;
            
            // 更新倒计时显示
            function updateCountdown() {
                if (remainingSeconds > 0) {
                    message.textContent = `请求过于频繁，请 ${remainingSeconds} 秒后重试`;
                    remainingSeconds--;
                } else {
                    clearInterval(countdownInterval);
                    message.classList.remove('show');
                    setTimeout(() => message.remove(), 300);
                }
            }
            
            // 立即显示第一次
            updateCountdown();
            message.classList.add('show');
            
            // 每秒更新一次
            countdownInterval = setInterval(updateCountdown, 1000);
        }

        // 注册表单处理
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const nickname = document.getElementById('nickname').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            
            // 基础验证
            if (!username || !password || !confirmPassword || !nickname || !phoneNumber) {
                showMessage('请填写所有必填信息！', 'error');
                return;
            }
            
            // 用户名验证
            if (username.length < 3 || username.length > 20) {
                showMessage('用户名长度应在3-20个字符之间！', 'error');
                return;
            }
            
            // 密码验证
            if (password.length < 6) {
                showMessage('密码至少需要6位字符！', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致！', 'error');
                return;
            }
            
            // 昵称验证
            if (nickname.length < 2 || nickname.length > 20) {
                showMessage('昵称长度应在2-20个字符之间！', 'error');
                return;
            }
            
            // 手机号验证
            if (!/^1[3-9]\d{9}$/.test(phoneNumber)) {
                showMessage('请输入正确的手机号！', 'error');
                return;
            }
            
            // 获取按钮引用
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            
            try {
                // 验证短信验证码（使用全局实例）
                if (!smsCaptchaManager) {
                    showMessage('验证码组件未初始化', 'error');
                    return;
                }
                
                const smsCaptchaResult = await smsCaptchaManager.verify();
                
                if (!smsCaptchaResult.success) {
                    showMessage(smsCaptchaResult.message, 'error');
                    return;
                }
                
                // 显示加载状态
                submitBtn.textContent = '注册中...';
                submitBtn.disabled = true;
                
                // 准备注册数据（包含手机号）
                const userData = {
                    username,
                    password,
                    nickname,
                    phone_number: phoneNumber
                };
                
                // 直接发送POST请求到API
                const response = await fetch('/server/api/users.php?action=register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('注册成功！正在跳转到登录页面...', 'success');
                    
                    // 清空表单
                    this.reset();
                    
                    // 2秒后跳转到登录页面（不恢复按钮状态，因为要跳转了）
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    // 注册失败，恢复按钮状态
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                    
                    // 检查是否有retry_after字段（频率限制）
                    if (result.retry_after && result.retry_after > 0) {
                        showCountdownMessage(result.retry_after);
                    } else {
                        showMessage(result.error || result.message || '注册失败，请稍后再试！', 'error');
                    }
                }
            } catch (error) {
                console.error('注册失败:', error);
                
                // 网络错误，恢复按钮状态
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                
                showMessage('网络连接失败，请检查服务器是否正常运行！', 'error');
            }
        });

        // 检查是否已登录 - 改为更严格的检查
        async function checkLoginStatus() {
            try {
                // 先检查本地存储
                if (!api.isLoggedIn()) {
                    return; // 未登录，正常显示注册页面
                }
                
                // 如果本地显示已登录，验证服务器端状态
                const profileResult = await api.getUserProfile();
                if (profileResult.success && profileResult.user) {
                    // 确实已登录，跳转到主页
                    showMessage('您已登录，正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = '../main.html';
                    }, 1000);
                } else {
                    // 服务器端未登录，清除本地数据
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('isLoggedIn');
                    api.currentUser = null;
                }
            } catch (error) {
                // 网络错误或其他问题，清除本地数据
                console.error('检查登录状态失败:', error);
                localStorage.removeItem('currentUser');
                localStorage.removeItem('isLoggedIn');
                api.currentUser = null;
            }
        }
        
        // 执行登录状态检查
        checkLoginStatus();

        // 初始化粒子效果
        if (typeof createParticles === 'function') {
            createParticles();
        }
        
        // 页面卸载时清除倒计时
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
        });
    </script>
</body>
</html>
