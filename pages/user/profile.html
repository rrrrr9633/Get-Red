<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛皮俱乐部</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/neon.css">
    <link rel="stylesheet" href="../../css/customer-service.css">
</head>
<body>
    <div class="particles"></div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <h1 class="neon-text gold" onclick="goToHome()" style="cursor: pointer;" title="返回主页">牛皮俱乐部</h1>
        </div>
        
        <div class="nav-user">
            <div class="nav-links">
                <a href="../main.html" class="neon-text">返回主页</a>
                <a href="#" onclick="logout()" class="neon-text">退出登录</a>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar-section">
                <div class="avatar-container">
                    <img id="profileAvatar" src="" alt="头像" class="profile-avatar">
                    <button class="avatar-edit-btn" onclick="triggerAvatarUpload()">
                        <span>📷</span>
                    </button>
                    <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="handleAvatarUpload(event)">
                </div>
            </div>
            
            <div class="profile-info">
                <h2 id="profileNickname" class="neon-text gold"></h2>
                <p id="profileUsername" class="neon-text"></p>
                <div class="balance-info">
                    <span class="neon-text">当前余额: </span>
                    <span id="profileBalance" class="neon-text gold"></span>
                </div>
            </div>
        </div>

        <div class="profile-tabs">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('account')">账户信息</button>
                <button class="tab-btn" onclick="showTab('transactions')">交易记录</button>
                <button class="tab-btn" onclick="showTab('withdrawal')">提现记录</button>
                <button class="tab-btn" onclick="showTab('checkin')">签到记录</button>
            </div>

            <!-- 账户信息标签页 -->
            <div id="accountTab" class="tab-content active">
                <div class="info-card">
                    <h3 class="neon-text gold">个人资料</h3>
                    <div id="profileInfo" class="profile-info-display">
                        <!-- 资料信息将在这里显示 -->
                    </div>
                    <button id="editProfileBtn" class="btn-profile-action" onclick="toggleEditMode()">
                        <span class="btn-icon">✏️</span>
                        <span class="btn-text">编辑资料</span>
                    </button>
                    
                    <form id="profileForm" style="display: none;">
                        <div class="form-group">
                            <label class="neon-text">昵称:</label>
                            <input type="text" id="editNickname" placeholder="请输入昵称">
                        </div>
                        
                        <div class="form-group">
                            <label class="neon-text">用户名:</label>
                            <input type="text" id="editUsername" disabled>
                        </div>
                        
                        <div class="form-group">
                            <label class="neon-text">邮箱:</label>
                            <input type="email" id="editEmail" placeholder="请输入邮箱">
                        </div>
                        
                        <div class="form-buttons">
                            <button type="submit" class="btn-neon">保存修改</button>
                            <button type="button" class="btn-neon secondary" onclick="cancelEdit()">取消</button>
                        </div>
                    </form>
                </div>
                
                <div class="info-card">
                    <h3 class="neon-text gold">修改密码</h3>
                    <form id="passwordForm">
                        <div class="form-group">
                            <input type="password" id="currentPassword" placeholder="当前密码">
                        </div>
                        
                        <div class="form-group">
                            <input type="password" id="newPassword" placeholder="新密码">
                        </div>
                        
                        <div class="form-group">
                            <input type="password" id="confirmNewPassword" placeholder="确认新密码">
                        </div>
                        
                        <button type="submit" class="btn-profile-action">
                            <span class="btn-icon">🔒</span>
                            <span class="btn-text">修改密码</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- 交易记录标签页 -->
            <div id="transactionsTab" class="tab-content">
                <div class="info-card">
                    <h3 class="neon-text gold">交易记录</h3>
                    <div class="tab-sub-nav">
                        <button class="sub-tab-btn active" onclick="showTransactionType('all')">全部记录</button>
                        <button class="sub-tab-btn" onclick="showTransactionType('draws')">抽奖获得</button>
                        <button class="sub-tab-btn" onclick="showTransactionType('decompose')">分解物品</button>
                        <button class="sub-tab-btn" onclick="showTransactionType('financial')">资金流水</button>
                        <button class="sub-tab-btn" onclick="showTransactionType('recharge')">充值记录</button>
                    </div>
                    
                    <div id="transactionsList" class="transactions-list">
                        <!-- 交易记录将在这里显示 -->
                    </div>
                    
                    <div class="pagination-controls">
                        <button class="btn-pagination" onclick="previousPage()" id="prevBtn">上一页</button>
                        <div class="page-info">
                            <span>第</span>
                            <input type="number" id="pageInput" min="1" value="1" 
                                   onchange="goToPage(this.value)" 
                                   onkeypress="if(event.key==='Enter') goToPage(this.value)">
                            <span>页，共 <span id="totalPages">1</span> 页</span>
                        </div>
                        <button class="btn-pagination" onclick="nextPage()" id="nextBtn">下一页</button>
                    </div>
                </div>
            </div>

            <!-- 签到记录标签页 -->
            <div id="checkinTab" class="tab-content">
                <div class="info-card">
                    <h3 class="neon-text gold">签到记录</h3>
                    <div id="checkinStats" class="checkin-stats">
                        <div class="stat-item">
                            <span class="neon-text">总签到天数:</span>
                            <span id="totalCheckins" class="neon-text gold">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="neon-text">连续签到:</span>
                            <span id="consecutiveCheckins" class="neon-text gold">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="neon-text">本月签到:</span>
                            <span id="monthlyCheckins" class="neon-text gold">0</span>
                        </div>
                    </div>
                    <div id="checkinList" class="checkin-list">
                        <!-- 签到记录将在这里显示 -->
                    </div>
                </div>
            </div>

            <!-- 提现记录标签页 -->
            <div id="withdrawalTab" class="tab-content">
                <div class="info-card">
                    <h3 class="neon-text gold">💰 我的提现记录</h3>
                    
                    <div class="withdrawal-info-notice">
                        <p class="neon-text">💡 提示：前往 <a href="../shop/knife-exchange.html" class="link-highlight">跑刀提现页面</a> 申请提现</p>
                        <p class="neon-text" style="font-size: 14px; opacity: 0.8; margin-top: 10px;">
                            兑换汇率：1金币 = 10000哈夫币
                        </p>
                    </div>

                    <div class="withdrawal-tabs">
                        <button class="withdrawal-sub-tab active" onclick="switchWithdrawalTab('pending')">待处理</button>
                        <button class="withdrawal-sub-tab" onclick="switchWithdrawalTab('history')">历史记录</button>
                    </div>

                    <div id="withdrawalPendingTab" class="withdrawal-tab-content active">
                        <div id="withdrawalPendingList" class="withdrawal-records-list">
                            <div class="empty-state">暂无待处理的提现申请</div>
                        </div>
                    </div>

                    <div id="withdrawalHistoryTab" class="withdrawal-tab-content">
                        <div id="withdrawalHistoryList" class="withdrawal-records-list">
                            <div class="empty-state">暂无历史记录</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 头像上传进度提示 -->
    <div id="uploadProgress" class="upload-progress" style="display: none;">
        <div class="upload-progress-content">
            <div class="neon-text gold">正在上传头像...</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <style>
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ffd700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
        }
        
        .nav-brand h1 {
            margin: 0;
            font-size: 24px;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .nav-links a:hover {
            background: rgba(255, 215, 0, 0.1);
            text-shadow: 0 0 10px currentColor;
        }
        
        .profile-container {
            margin-top: 70px;
            padding: 40px 20px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .profile-header {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 20px;
        }
        
        .profile-avatar-section {
            flex-shrink: 0;
        }
        
        .avatar-container {
            position: relative;
            display: inline-block;
        }
        
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            object-fit: cover;
        }
        
        .avatar-edit-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ffd700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .avatar-edit-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        
        /* 头像上传进度提示 */
        .upload-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .upload-progress-content {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
        }
        
        .progress-bar {
            width: 300px;
            height: 8px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            width: 0%;
            animation: progressAnimation 1.5s ease-in-out infinite;
        }
        
        @keyframes progressAnimation {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .profile-info {
            flex: 1;
        }
        
        .profile-info h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }
        
        .profile-info p {
            margin: 8px 0;
            font-size: 16px;
            opacity: 0.8;
        }
        
        .balance-info {
            margin-top: 20px;
            font-size: 18px;
        }
        
        .profile-tabs {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .tab-buttons {
            display: flex;
            border-bottom: 1px solid #ffd700;
        }
        
        .tab-btn {
            flex: 1;
            padding: 20px;
            background: transparent;
            border: none;
            color: #ffd700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 1px solid #ffd700;
        }
        
        .tab-btn:last-child {
            border-right: none;
        }
        
        .tab-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        
        .tab-btn.active {
            background: rgba(255, 215, 0, 0.2);
            text-shadow: 0 0 10px currentColor;
        }
        
        .tab-content {
            display: none;
            padding: 30px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .info-card {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .info-card h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #ffd700;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }
        
        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .profile-info-display {
            margin-bottom: 20px;
        }
        
        .profile-info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .profile-info-item:last-child {
            border-bottom: none;
        }
        
        .profile-info-label {
            font-weight: bold;
            min-width: 100px;
        }
        
        .profile-info-value {
            color: #ffd700;
        }
        
        .form-buttons {
            display: flex;
            gap: 15px;
        }
        
        /* 美化的个人资料操作按钮 */
        .btn-profile-action {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 25px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-profile-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
            background: linear-gradient(135deg, #ffed4e, #ffd700);
        }
        
        .btn-profile-action:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }
        
        .btn-profile-action .btn-icon {
            font-size: 20px;
            display: flex;
            align-items: center;
        }
        
        .btn-profile-action .btn-text {
            font-weight: bold;
        }
        
        .btn-neon.secondary {
            background: transparent;
            border: 2px solid #666;
            color: #666;
        }
        
        .btn-neon.secondary:hover {
            border-color: #ffd700;
            color: #ffd700;
        }
        
        .tab-sub-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .sub-tab-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .sub-tab-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        
        .sub-tab-btn.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }
        
        .pagination-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            padding: 25px;
            border-top: 2px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.05);
            border-radius: 0 0 15px 15px;
        }
        
        .btn-pagination {
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 14px;
            min-width: 100px;
        }
        
        .btn-pagination:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.2));
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            transform: translateY(-2px);
        }
        
        .btn-pagination:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .btn-pagination:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
            background: rgba(100, 100, 100, 0.1);
        }
        
        .page-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        .page-info input {
            width: 70px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd700;
            border-radius: 5px;
            color: #ffd700;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
        
        .page-info input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .page-info span {
            color: #ffd700;
        }
        
        .neon-text.green {
            color: #00ff88;
        }
        
        .neon-text.red {
            color: #ff4444;
        }
        
        .transactions-list,
        .checkin-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .transaction-item,
        .checkin-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .transaction-item:last-child,
        .checkin-item:last-child {
            border-bottom: none;
        }
        
        .checkin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* 提现记录样式 */
        .withdrawal-info-notice {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
        }

        .withdrawal-info-notice p {
            margin: 0;
        }

        .link-highlight {
            color: #ffd700;
            text-decoration: underline;
            font-weight: bold;
        }

        .link-highlight:hover {
            color: #ffed4e;
        }

        .withdrawal-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .withdrawal-sub-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .withdrawal-sub-tab:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .withdrawal-sub-tab.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }

        .withdrawal-tab-content {
            display: none;
        }

        .withdrawal-tab-content.active {
            display: block;
        }

        .withdrawal-records-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .withdrawal-record-item {
            padding: 15px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .withdrawal-record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .withdrawal-record-amount {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
        }

        .withdrawal-status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pending {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
        }

        .status-processing {
            background: rgba(100, 149, 237, 0.2);
            color: #6495ed;
        }

        .status-completed {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .withdrawal-record-details {
            font-size: 13px;
            opacity: 0.8;
        }

        .withdrawal-record-details div {
            margin: 5px 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            opacity: 0.6;
        }
        
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .tab-buttons {
                flex-direction: column;
            }
            
            .tab-btn {
                border-right: none;
                border-bottom: 1px solid #ffd700;
            }
            
            .tab-btn:last-child {
                border-bottom: none;
            }
            
            .checkin-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script src="../../js/api-client.js"></script>
    <script src="../../js/customer-service.js"></script>
    <script src="../../js/effects.js"></script>
    <script>
        let currentUser = null;
        let isEditMode = false;
        let currentTransactionType = 'all';
        let currentPage = 1;
        let totalPages = 1;
        const pageSize = 10;

        // 检查登录状态
        function checkLogin() {
            const userData = localStorage.getItem('currentUser');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            
            if (!userData || isLoggedIn !== 'true') {
                alert('请先登录！');
                window.location.href = '../auth/login.html';
                return null;
            }
            
            return JSON.parse(userData);
        }

        // 加载用户资料
        async function loadProfile() {
            currentUser = checkLogin();
            if (!currentUser) return;

            try {
                const response = await fetch('../../server/api/users.php?action=profile', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const user = data.user;
                    
                    // 设置头像 - 处理路径
                    let avatarSrc = user.avatar || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiByeD0iNTAiIGZpbGw9IiNmZmQ3MDAiLz4KPHN2ZyB4PSIyNSIgeT0iMjAiIHdpZHRoPSI1MCIgaGVpZ2h0PSI2MCI+CjxjaXJjbGUgY3g9IjI1IiBjeT0iMjAiIHI9IjE1IiBmaWxsPSIjMTExIi8+CjxlbGxpcHNlIGN4PSIyNSIgY3k9IjUwIiByeD0iMjAiIHJ5PSIxNSIgZmlsbD0iIzExMSIvPgo8L3N2Zz4KPC9zdmc+';
                    
                    // 如果是上传的图片（不是 data: 或 http 开头），添加相对路径
                    if (avatarSrc && !avatarSrc.startsWith('data:') && !avatarSrc.startsWith('http')) {
                        avatarSrc = '../../' + avatarSrc;
                    }
                    
                    document.getElementById('profileAvatar').src = avatarSrc;
                    
                    // 设置基本信息
                    document.getElementById('profileNickname').textContent = user.nickname || '未设置昵称';
                    document.getElementById('profileUsername').textContent = `@${user.username}`;
                    document.getElementById('profileBalance').textContent = `${user.balance || 0} 金币`;
                    
                    // 渲染资料信息
                    renderProfileInfo(user);
                    
                    // 填充编辑表单
                    document.getElementById('editNickname').value = user.nickname || '';
                    document.getElementById('editUsername').value = user.username;
                    document.getElementById('editEmail').value = user.email || '';
                } else {
                    console.error('获取用户资料失败:', data.error);
                }
            } catch (error) {
                console.error('加载用户资料失败:', error);
            }
        }

        // 渲染资料信息
        function renderProfileInfo(user) {
            const profileInfo = document.getElementById('profileInfo');
            profileInfo.innerHTML = `
                <div class="profile-info-item">
                    <span class="profile-info-label neon-text">用户ID:</span>
                    <span class="profile-info-value neon-text">${user.id}</span>
                </div>
                <div class="profile-info-item">
                    <span class="profile-info-label neon-text">用户名:</span>
                    <span class="profile-info-value neon-text">${user.username}</span>
                </div>
                <div class="profile-info-item">
                    <span class="profile-info-label neon-text">昵称:</span>
                    <span class="profile-info-value neon-text">${user.nickname || '未设置'}</span>
                </div>
                <div class="profile-info-item">
                    <span class="profile-info-label neon-text">邮箱:</span>
                    <span class="profile-info-value neon-text">${user.email || '未设置'}</span>
                </div>
                <div class="profile-info-item">
                    <span class="profile-info-label neon-text">余额:</span>
                    <span class="profile-info-value neon-text">${user.balance || 0} 金币</span>
                </div>
                <div class="profile-info-item">
                    <span class="profile-info-label neon-text">注册时间:</span>
                    <span class="profile-info-value neon-text">${user.created_at ? new Date(user.created_at).toLocaleDateString() : '未知'}</span>
                </div>
            `;
        }

        // 触发头像上传
        function triggerAvatarUpload() {
            document.getElementById('avatarInput').click();
        }
        
        // 处理头像上传
        async function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            console.log('开始上传头像:', file.name, file.type, file.size);
            
            // 验证文件类型
            const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            if (!allowedTypes.includes(file.type)) {
                alert('不支持的文件类型！请上传 JPG、PNG、GIF 或 WEBP 格式的图片');
                return;
            }
            
            // 验证文件大小（最大2MB）
            const maxSize = 2 * 1024 * 1024;
            if (file.size > maxSize) {
                alert('文件大小超过限制！请上传小于 2MB 的图片');
                return;
            }
            
            // 显示上传进度
            const progressModal = document.getElementById('uploadProgress');
            progressModal.style.display = 'flex';
            
            try {
                // 创建 FormData
                const formData = new FormData();
                formData.append('avatar', file);
                
                console.log('发送上传请求到: ../../server/api/upload-avatar.php');
                
                // 上传文件
                const response = await fetch('../../server/api/upload-avatar.php', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                console.log('响应状态:', response.status, response.statusText);
                
                // 先获取响应文本，看看是否是有效的 JSON
                const responseText = await response.text();
                console.log('响应内容:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    console.error('JSON 解析失败:', e);
                    console.error('原始响应:', responseText);
                    alert('服务器返回了无效的响应格式。请检查 PHP 错误日志。');
                    return;
                }
                
                if (data.success) {
                    // 更新头像显示
                    const avatarUrl = '../../' + data.avatar_url;
                    console.log('更新头像 URL:', avatarUrl);
                    document.getElementById('profileAvatar').src = avatarUrl;
                    alert('头像上传成功！');
                    
                    // 重新加载用户资料
                    await loadProfile();
                } else {
                    console.error('上传失败:', data.error);
                    alert('头像上传失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                console.error('头像上传异常:', error);
                alert('头像上传失败！错误: ' + error.message);
            } finally {
                // 隐藏上传进度
                progressModal.style.display = 'none';
                // 清空文件选择器
                event.target.value = '';
            }
        }

        // 切换编辑模式
        function toggleEditMode() {
            isEditMode = !isEditMode;
            
            const profileInfo = document.getElementById('profileInfo');
            const profileForm = document.getElementById('profileForm');
            const editBtn = document.getElementById('editProfileBtn');
            
            if (isEditMode) {
                profileInfo.style.display = 'none';
                profileForm.style.display = 'block';
                editBtn.style.display = 'none';
            } else {
                profileInfo.style.display = 'block';
                profileForm.style.display = 'none';
                editBtn.style.display = 'block';
            }
        }

        // 取消编辑
        function cancelEdit() {
            toggleEditMode();
            // 重新加载原始数据
            loadProfile();
        }

        // 显示标签页
        function showTab(tabName) {
            // 隐藏所有标签页
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 显示选中的标签页
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
            
            // 加载对应的数据
            if (tabName === 'transactions') {
                loadTransactions();
            } else if (tabName === 'checkin') {
                loadCheckinRecords();
            } else if (tabName === 'withdrawal') {
                loadWithdrawalData();
            }
        }

        // 加载提现数据
        async function loadWithdrawalData() {
            try {
                // 加载提现记录
                loadWithdrawalRecords();
            } catch (error) {
                console.error('加载提现数据失败:', error);
            }
        }

        // 切换提现记录标签
        function switchWithdrawalTab(tab) {
            document.querySelectorAll('.withdrawal-sub-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.withdrawal-tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('withdrawal' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Tab').classList.add('active');
        }

        // 加载提现记录
        async function loadWithdrawalRecords() {
            try {
                // 加载待处理的申请
                const pendingResponse = await fetch('../../server/api/withdrawal.php?action=user_requests', {
                    credentials: 'include'
                });
                const pendingData = await pendingResponse.json();
                
                if (pendingData.success) {
                    renderWithdrawalPending(pendingData.requests);
                }
                
                // 加载历史记录
                const historyResponse = await fetch('../../server/api/withdrawal.php?action=user_history', {
                    credentials: 'include'
                });
                const historyData = await historyResponse.json();
                
                if (historyData.success) {
                    renderWithdrawalHistory(historyData.history);
                }
            } catch (error) {
                console.error('加载提现记录失败:', error);
            }
        }

        // 渲染待处理的提现申请
        function renderWithdrawalPending(records) {
            const container = document.getElementById('withdrawalPendingList');
            
            if (records.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无待处理的提现申请</div>';
                return;
            }
            
            container.innerHTML = records.map(record => {
                const statusMap = {
                    'pending': '待处理',
                    'processing': '处理中'
                };
                
                return `
                    <div class="withdrawal-record-item">
                        <div class="withdrawal-record-header">
                            <div class="withdrawal-record-amount">${record.amount} 金币 → ${parseFloat(record.buff_coins).toFixed(0)} 哈夫币</div>
                            <div class="withdrawal-status-badge status-${record.status}">
                                ${statusMap[record.status] || record.status}
                            </div>
                        </div>
                        <div class="withdrawal-record-details">
                            <div>申请时间: ${new Date(record.created_at).toLocaleString()}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染提现历史记录
        function renderWithdrawalHistory(records) {
            const container = document.getElementById('withdrawalHistoryList');
            
            if (records.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无历史记录</div>';
                return;
            }
            
            container.innerHTML = records.map(record => {
                const statusMap = {
                    'completed': '已完成',
                    'rejected': '已拒绝'
                };
                
                return `
                    <div class="withdrawal-record-item">
                        <div class="withdrawal-record-header">
                            <div class="withdrawal-record-amount">${record.amount} 金币 → ${parseFloat(record.buff_coins).toFixed(0)} 哈夫币</div>
                            <div class="withdrawal-status-badge status-${record.status}">
                                ${statusMap[record.status] || record.status}
                            </div>
                        </div>
                        <div class="withdrawal-record-details">
                            <div>申请时间: ${new Date(record.created_at).toLocaleString()}</div>
                            <div>处理时间: ${new Date(record.processed_at).toLocaleString()}</div>
                            ${record.reject_reason ? `<div style="color: #ef4444;">拒绝原因: ${record.reject_reason}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 显示交易记录类型
        function showTransactionType(type) {
            currentTransactionType = type;
            currentPage = 1;
            
            // 更新按钮状态
            document.querySelectorAll('.sub-tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            loadTransactions();
        }

        // 加载交易记录
        async function loadTransactions(page = 1) {
            console.log('=== 开始加载交易记录 ===');
            console.log('请求页码:', page);
            console.log('交易类型:', currentTransactionType);
            
            try {
                let url;
                let transactions = [];
                let totalPagesCount = 1;
                
                if (currentTransactionType === 'recharge') {
                    // 加载充值记录
                    console.log('加载充值记录...');
                    const response = await fetch(`../../server/api/recharge.php?action=get_user_recharge_history`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({ 
                            page: page, 
                            limit: pageSize 
                        })
                    });
                    
                    const data = await response.json();
                    console.log('充值记录响应:', data);
                    
                    if (data.success) {
                        transactions = (data.history || []).map(record => ({
                            description: `充值 - ${record.payment_method === 'alipay' ? '支付宝' : record.payment_method === 'wechat' ? '微信支付' : record.payment_method}`,
                            amount: record.coins_gained,
                            created_at: record.created_at,
                            type: 'recharge',
                            status: record.status
                        }));
                        totalPagesCount = Math.ceil((data.total || 0) / pageSize);
                        console.log('充值记录总数:', data.total, '计算总页数:', totalPagesCount);
                    }
                } else {
                    // 加载其他类型的交易记录
                    console.log('加载交易记录...');
                    const response = await fetch(`../../server/api/users.php?action=transactions&type=${currentTransactionType}&page=${page}&limit=${pageSize}`, {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    console.log('交易记录响应:', data);
                    
                    if (data.success) {
                        transactions = data.transactions || [];
                        
                        // 尝试多种方式获取总页数
                        if (data.pagination && data.pagination.total_pages) {
                            totalPagesCount = data.pagination.total_pages;
                            console.log('从 pagination.total_pages 获取:', totalPagesCount);
                        } else if (data.totalPages) {
                            totalPagesCount = data.totalPages;
                            console.log('从 totalPages 获取:', totalPagesCount);
                        } else if (data.total) {
                            totalPagesCount = Math.ceil(data.total / pageSize);
                            console.log('从 total 计算:', data.total, '/', pageSize, '=', totalPagesCount);
                        } else {
                            // 如果都没有，根据返回的记录数估算
                            totalPagesCount = transactions.length === pageSize ? page + 1 : page;
                            console.log('根据记录数估算:', totalPagesCount);
                        }
                    }
                }
                
                console.log('交易记录数量:', transactions.length);
                console.log('总页数 (totalPagesCount):', totalPagesCount);
                
                const container = document.getElementById('transactionsList');
                
                // 确保 totalPagesCount 至少为 1
                totalPagesCount = Math.max(1, totalPagesCount || 1);
                
                currentPage = page;
                totalPages = totalPagesCount;
                
                console.log('更新状态 - 当前页:', currentPage, '总页数:', totalPages);
                console.log('totalPages 类型:', typeof totalPages, '值:', totalPages);
                
                // 更新分页控件
                updatePaginationControls();
                
                if (transactions.length === 0) {
                    container.innerHTML = '<p class="neon-text" style="text-align: center; opacity: 0.6;">暂无交易记录</p>';
                    return;
                }
                
                container.innerHTML = transactions.map(transaction => {
                    const date = new Date(transaction.created_at).toLocaleString();
                    const amount = parseFloat(transaction.amount);
                    const amountClass = amount > 0 ? 'green' : 'red';
                    const amountText = amount > 0 ? `+${amount}` : amount;
                    
                    // 清理描述，删除括号内容
                    let description = transaction.description || '';
                    description = description.replace(/\s*\([^)]*\)/g, ''); // 删除所有括号及其内容
                    
                    let statusText = '';
                    if (transaction.type === 'recharge' && transaction.status) {
                        const statusMap = {
                            'pending': '待支付',
                            'completed': '已完成',
                            'failed': '失败',
                            'cancelled': '已取消'
                        };
                        statusText = ` (${statusMap[transaction.status] || transaction.status})`;
                    }
                    
                    return `
                        <div class="transaction-item">
                            <div>
                                <div class="neon-text">${description}${statusText}</div>
                                <div style="font-size: 12px; opacity: 0.6; margin-top: 5px;">
                                    ${date}
                                </div>
                            </div>
                            <div class="neon-text ${amountClass}">
                                ${amountText} 金币
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('加载交易记录失败:', error);
                
                // 即使出错也要设置 totalPages，避免 undefined
                if (typeof totalPages === 'undefined') {
                    totalPages = 1;
                    currentPage = 1;
                }
                
                const container = document.getElementById('transactionsList');
                container.innerHTML = '<p class="neon-text" style="text-align: center; opacity: 0.6;">加载失败，请稍后重试</p>';
                
                // 更新分页控件
                updatePaginationControls();
            }
        }

        // 更新分页控件
        function updatePaginationControls() {
            console.log('更新分页控件:', { currentPage, totalPages });
            
            const pageInput = document.getElementById('pageInput');
            const totalPagesSpan = document.getElementById('totalPages');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (pageInput) pageInput.value = currentPage;
            if (totalPagesSpan) totalPagesSpan.textContent = totalPages;
            
            if (prevBtn) prevBtn.disabled = currentPage <= 1;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages;
            
            console.log('分页控件状态:', {
                currentPage,
                totalPages,
                prevDisabled: currentPage <= 1,
                nextDisabled: currentPage >= totalPages
            });
        }

        // 上一页
        function previousPage() {
            console.log('点击上一页，当前页:', currentPage);
            if (currentPage > 1) {
                console.log('加载上一页:', currentPage - 1);
                loadTransactions(currentPage - 1);
            } else {
                console.log('已经是第一页了');
            }
        }

        // 下一页
        function nextPage() {
            console.log('点击下一页，当前页:', currentPage, '总页数:', totalPages);
            if (currentPage < totalPages) {
                console.log('加载下一页:', currentPage + 1);
                loadTransactions(currentPage + 1);
            } else {
                console.log('已经是最后一页了');
            }
        }

        // 跳转到指定页
        function goToPage(page) {
            console.log('跳转到页面:', page, '当前页:', currentPage, '总页数:', totalPages);
            const pageNum = parseInt(page);
            
            if (isNaN(pageNum)) {
                console.log('无效的页码');
                return;
            }
            
            if (pageNum < 1) {
                console.log('页码小于1，设置为1');
                document.getElementById('pageInput').value = 1;
                return;
            }
            
            if (pageNum > totalPages) {
                console.log('页码超过总页数，设置为', totalPages);
                document.getElementById('pageInput').value = totalPages;
                return;
            }
            
            if (pageNum !== currentPage) {
                console.log('加载页面:', pageNum);
                loadTransactions(pageNum);
            } else {
                console.log('已经在当前页');
            }
        }

        // 加载签到记录
        async function loadCheckinRecords() {
            try {
                const response = await fetch('../../server/api/checkin.php?action=status', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 更新统计显示
                    document.getElementById('totalCheckins').textContent = data.totalDays || 0;
                    document.getElementById('consecutiveCheckins').textContent = data.consecutiveDays || 0;
                    document.getElementById('monthlyCheckins').textContent = data.monthlyDays || 0;
                    
                    // 加载签到历史记录
                    loadCheckinHistory();
                } else {
                    console.error('加载签到数据失败:', data.error);
                }
            } catch (error) {
                console.error('加载签到记录失败:', error);
            }
        }

        // 加载签到历史记录
        async function loadCheckinHistory() {
            try {
                const response = await fetch('../../server/api/checkin.php?action=history', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const container = document.getElementById('checkinList');
                    const records = data.records || [];
                    
                    if (records.length === 0) {
                        container.innerHTML = '<p class="neon-text" style="text-align: center; opacity: 0.6;">暂无签到记录</p>';
                        return;
                    }
                    
                    container.innerHTML = records.slice(0, 20).map(record => `
                        <div class="checkin-item">
                            <div>
                                <div class="neon-text">签到奖励</div>
                                <div style="font-size: 12px; opacity: 0.6; margin-top: 5px;">
                                    ${new Date(record.checkin_date).toLocaleDateString()}
                                </div>
                            </div>
                            <div class="neon-text gold">+${record.reward_amount || 10} 金币</div>
                        </div>
                    `).join('');
                } else {
                    console.error('加载签到历史失败:', data.error);
                }
            } catch (error) {
                console.error('加载签到历史失败:', error);
            }
        }

        // 保存资料
        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nickname = document.getElementById('editNickname').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            
            if (!nickname) {
                alert('昵称不能为空！');
                return;
            }
            
            try {
                const response = await fetch('../../server/api/users.php?action=profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ nickname, email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('资料更新成功！');
                    toggleEditMode();
                    loadProfile(); // 重新加载资料
                } else {
                    alert('资料更新失败: ' + data.error);
                }
            } catch (error) {
                console.error('资料更新失败:', error);
                alert('资料更新失败！');
            }
        });

        // 修改密码
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            
            if (!currentPassword || !newPassword || !confirmNewPassword) {
                alert('请填写所有密码字段！');
                return;
            }
            
            if (newPassword !== confirmNewPassword) {
                alert('新密码两次输入不一致！');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('新密码长度至少6位！');
                return;
            }
            
            try {
                const response = await fetch('../../server/api/users.php?action=password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('密码修改成功！');
                    document.getElementById('passwordForm').reset();
                } else {
                    alert('密码修改失败: ' + data.error);
                }
            } catch (error) {
                console.error('密码修改失败:', error);
                alert('密码修改失败！');
            }
        });

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('currentUser');
                localStorage.removeItem('isLoggedIn');
                window.location.href = '../auth/login.html';
            }
        }

        // 返回主页
        function goToHome() {
            window.location.href = '../main.html';
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadProfile();
        });
    </script>
</body>
</html>
