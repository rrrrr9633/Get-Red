<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛皮俱乐部</title>
    <link rel="stylesheet" href="../../css/neon.css">
    <link rel="stylesheet" href="../../css/customer-service.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 50%, #0a1a0a 100%);
            color: #fff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 粒子背景 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .header {
            text-align: center;
            margin: 80px 0 40px 0;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .header p {
            font-size: 18px;
            opacity: 0.8;
        }

        .recharge-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .option-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .option-card:hover::before {
            animation: shine 1.5s ease-in-out;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); opacity: 0; }
        }

        .option-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 80px rgba(255, 215, 0, 0.3);
        }

        .option-amount {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 15px;
        }

        .option-coins {
            font-size: 20px;
            color: #4ade80;
            margin-bottom: 10px;
        }

        .option-bonus {
            font-size: 14px;
            color: #fbbf24;
            margin-bottom: 20px;
        }

        .option-description {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .select-btn {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .select-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        /* 支付弹窗 */
        .payment-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .payment-modal.show {
            display: flex;
        }

        .payment-content {
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #ffd700;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .payment-method {
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .payment-method:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .payment-method.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .payment-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .payment-name {
            font-size: 18px;
            font-weight: bold;
        }

        .alipay-method {
            color: #1677ff;
        }

        .wechat-method {
            color: #07c160;
        }

        .confirm-payment-btn {
            background: linear-gradient(45deg, #4ade80, #22c55e);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .confirm-payment-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
        }

        .confirm-payment-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 支付窗口 */
        .payment-window {
            display: none;
            background: #fff;
            color: #333;
            border-radius: 15px;
            padding: 30px;
            margin-top: 20px;
            text-align: center;
        }

        .payment-window.show {
            display: block;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        .payment-info {
            font-size: 16px;
            margin: 10px 0;
        }

        .payment-amount {
            font-size: 24px;
            font-weight: bold;
            color: #e74c3c;
            margin: 15px 0;
        }

        .payment-tips {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .recharge-options {
                grid-template-columns: 1fr;
            }
            
            .payment-methods {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <a href="../main.html" class="back-btn">← 返回主页</a>

    <div class="container">
        <div class="header">
            <h1 class="neon-text rainbow">充值中心</h1>
            <p class="neon-text">选择充值套餐，获得更多金币开启幸运之旅</p>
        </div>

        <div class="recharge-options" id="rechargeOptions">
            <!-- 充值选项将在这里动态生成 -->
        </div>
    </div>

    <!-- 支付弹窗 -->
    <div class="payment-modal" id="paymentModal">
        <div class="payment-content">
            <span class="close-btn" onclick="closePaymentModal()">&times;</span>
            
            <h2 class="neon-text gold" id="modalTitle">选择支付方式</h2>
            <div class="neon-text" id="modalAmount" style="font-size: 24px; margin: 20px 0;"></div>
            
            <div class="payment-methods">
                <div class="payment-method alipay-method" onclick="selectPaymentMethod('alipay')">
                    <div class="payment-icon">💰</div>
                    <div class="payment-name">支付宝</div>
                </div>
                <div class="payment-method wechat-method" onclick="selectPaymentMethod('wechat')">
                    <div class="payment-icon">💚</div>
                    <div class="payment-name">微信支付</div>
                </div>
            </div>
            
            <button class="confirm-payment-btn" id="confirmPaymentBtn" onclick="confirmPayment()" disabled>
                确认支付
            </button>
            
            <!-- 支付窗口 -->
            <div class="payment-window" id="paymentWindow">
                <h3 id="paymentTitle">扫码支付</h3>
                <img class="qr-code" id="qrCode" src="" alt="支付二维码">
                <div class="payment-info" id="paymentMessage"></div>
                <div class="payment-amount" id="paymentAmountDisplay"></div>
                <div class="payment-tips">
                    请使用对应的支付应用扫描二维码完成支付<br>
                    支付完成后，金币将自动到账
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/api-client.js"></script>
    <script src="../../js/customer-service.js"></script>
    <script src="../../js/effects.js"></script>
    <script>
        let selectedOption = null;
        let selectedPaymentMethod = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            loadRechargeOptions();
        });

        // API请求函数
        async function apiRequest(action, method = 'GET', data = null) {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            
            if (data) {
                options.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(`../../server/api/recharge.php?action=${action}`, options);
                return await response.json();
            } catch (error) {
                console.error('API请求失败:', error);
                return { success: false, error: error.message };
            }
        }

        // 加载充值选项
        async function loadRechargeOptions() {
            const result = await apiRequest('get_user_recharge_options');
            const container = document.getElementById('rechargeOptions');
            
            if (result.success && result.options) {
                // 将选项存储在全局变量中
                window.rechargeOptionsData = result.options;
                
                container.innerHTML = result.options.map((option, index) => `
                    <div class="option-card" onclick="selectRechargeOption(${index})">
                        <div class="option-amount">¥${option.amount}</div>
                        <div class="option-coins">获得 ${option.total_coins} 金币</div>
                        ${option.bonus_coins > 0 ? `<div class="option-bonus">含赠送 ${option.bonus_coins} 金币</div>` : ''}
                        <div class="option-description">
                            基础金币: ${option.amount * result.coin_ratio}
                            ${option.bonus_coins > 0 ? ` + 赠送: ${option.bonus_coins}` : ''}
                        </div>
                        <button class="select-btn">立即充值</button>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px;">
                        <p>暂无充值选项，请联系管理员</p>
                    </div>
                `;
            }
        }

        // 选择充值选项
        function selectRechargeOption(index) {
            if (!window.rechargeOptionsData || !window.rechargeOptionsData[index]) {
                console.error('充值选项数据不存在');
                return;
            }
            
            selectedOption = window.rechargeOptionsData[index];
            document.getElementById('modalAmount').textContent = `充值金额: ¥${selectedOption.amount} = ${selectedOption.total_coins} 金币`;
            document.getElementById('paymentModal').classList.add('show');
            
            // 重置选择状态
            selectedPaymentMethod = null;
            document.querySelectorAll('.payment-method').forEach(el => el.classList.remove('selected'));
            document.getElementById('confirmPaymentBtn').disabled = true;
            document.getElementById('paymentWindow').classList.remove('show');
        }

        // 选择支付方式
        function selectPaymentMethod(method) {
            selectedPaymentMethod = method;
            
            // 更新UI
            document.querySelectorAll('.payment-method').forEach(el => el.classList.remove('selected'));
            document.querySelector(`.${method}-method`).classList.add('selected');
            document.getElementById('confirmPaymentBtn').disabled = false;
        }

        // 确认支付
        async function confirmPayment() {
            if (!selectedOption || !selectedPaymentMethod) {
                alert('请选择充值选项和支付方式');
                return;
            }

            const btn = document.getElementById('confirmPaymentBtn');
            btn.disabled = true;
            btn.textContent = '创建订单中...';

            try {
                const result = await apiRequest('create_recharge_order', 'POST', {
                    option_id: selectedOption.id,
                    payment_method: selectedPaymentMethod
                });

                if (result.success) {
                    // 显示支付窗口
                    showPaymentWindow(result);
                } else {
                    alert('创建订单失败: ' + (result.error || '未知错误'));
                }
            } catch (error) {
                alert('网络错误，请稍后再试');
            } finally {
                btn.disabled = false;
                btn.textContent = '确认支付';
            }
        }

        // 显示支付窗口
        function showPaymentWindow(orderInfo) {
            const paymentWindow = document.getElementById('paymentWindow');
            const methodName = selectedPaymentMethod === 'alipay' ? '支付宝' : '微信支付';
            
            document.getElementById('paymentTitle').textContent = `${methodName}支付`;
            document.getElementById('qrCode').src = orderInfo.qr_code;
            document.getElementById('paymentMessage').textContent = orderInfo.message;
            document.getElementById('paymentAmountDisplay').textContent = `¥${orderInfo.amount}`;
            
            paymentWindow.classList.add('show');
            
            // 模拟支付检查（实际应该轮询后端检查支付状态）
            setTimeout(() => {
                if (confirm('支付完成了吗？\n\n实际项目中这里会自动检测支付状态')) {
                    alert(`支付成功！获得 ${orderInfo.coins_gained} 金币`);
                    closePaymentModal();
                }
            }, 5000);
        }

        // 关闭支付弹窗
        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('show');
            selectedOption = null;
            selectedPaymentMethod = null;
        }

        // 创建粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = Math.random() * 4 + 1 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = '#ffd700';
                particle.style.borderRadius = '50%';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.opacity = Math.random() * 0.5 + 0.3;
                particle.style.animation = `float ${Math.random() * 3 + 2}s ease-in-out infinite alternate`;
                
                particlesContainer.appendChild(particle);
            }
        }

        // 检查登录状态
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn !== 'true') {
                alert('请先登录');
                window.location.href = '../auth/login.html';
                return false;
            }
            return true;
        }

        // 页面加载时检查登录状态
        if (!checkLoginStatus()) {
            // 如果未登录，不执行后续代码
        }
    </script>
</body>
</html>
